[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-ob"
version = "0.1.0"
description = "Memory_OB — a personal memory engine: capture anything, trust as a score, truth by signature."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nishad Islam Utso" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# The acceptance suite drives the real HTTP surface.
test = [
    "httpx>=0.27",
]

[project.scripts]
memory-ob = "memory_ob.cli:main"

[tool.setuptools]
packages = ["memory_ob"]

[tool.setuptools.package-data]
# The screens are served from the package, so they ship with it.
memory_ob = ["py.typed", "web/index.html"]
