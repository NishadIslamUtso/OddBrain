<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- An empty data URI keeps the browser from requesting /favicon.ico and
     logging a 404 on every page load. -->
<link rel="icon" href="data:,">
<title>Memory_OB</title>
<style>
  /* Design tokens.
     The host sets --ui-* names on its own <html>; the script at the bottom of
     this file copies them onto our root, so any change in the Hermes
     Appearance settings follows through. The values here are the standalone
     fallbacks, used when there is no host to read.

     Theme is a data attribute, not a variable set: light and dark need
     different values for the same token, and one indirection keeps the rest of
     the stylesheet free of branching. */
  :root {
    --accent: #d4a74a;
    --accent-soft: #d4a74a22;
    --bg: #1a1a1a;
    --bg-2: #222222;
    --bg-3: #2b2b2b;
    --stroke: #333333;
    --stroke-2: #444444;
    --text: #e8e8e8;
    --text-2: #b0b0b0;
    --text-3: #888888;
    --text-4: #666666;
    --ok: #7fd98f;
    --warn: #e0a060;
    --bad: #ff8f8f;
    --info: #6ec1ff;
    --radius: 8px;
    --radius-sm: 6px;
    --font: var(--ui-font, system-ui, -apple-system, "Segoe UI", sans-serif);
    --font-size: 14px;
  }
  :root[data-theme="light"] {
    --bg: #fafafa;
    --bg-2: #ffffff;
    --bg-3: #f0f0f0;
    --stroke: #e2e2e2;
    --stroke-2: #cfcfcf;
    --text: #1c1c1c;
    --text-2: #4a4a4a;
    --text-3: #6b6b6b;
    --text-4: #8f8f8f;
    --accent-soft: #d4a74a18;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: var(--font-size);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  /* Column: the tab bar on top, the view below. Inside Hermes this keeps a
     single sidebar (the app's) instead of nesting a second one. */
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ---- top bar ---- */
  nav {
    display: flex; flex-wrap: wrap; align-items: center; gap: 2px;
    flex: 0 0 auto;
    background: var(--bg-2);
    border-bottom: 1px solid var(--stroke);
    padding: 6px 10px;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  nav h1 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-3); margin: 0 10px 0 2px; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  nav h1 svg { color: var(--accent); }
  nav button {
    display: inline-flex; align-items: center; gap: 5px;
    background: none; border: 0; color: var(--text-2);
    padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer;
    font-size: 13px; font-family: inherit; white-space: nowrap;
    transition: background .12s, color .12s;
  }
  nav button:hover { background: var(--stroke); color: var(--text); }
  nav button.active { background: var(--stroke); color: var(--accent); }
  nav button:focus-visible, button.act:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  nav .badge {
    display: inline-block; margin-left: 4px; background: var(--accent); color: #000;
    border-radius: 10px; padding: 0 6px; font-size: 11px; font-weight: 600;
  }
  nav .spacer { flex: 1 1 auto; }
  nav .palette-btn { color: var(--text-3); }
  nav .palette-btn kbd {
    font-family: inherit; font-size: 11px; color: var(--text-4);
    border: 1px solid var(--stroke); border-radius: 4px; padding: 0 4px;
  }

  main { flex: 1 1 auto; overflow-y: auto; padding: 20px 24px; }
  h2 { font-size: 18px; margin: 0 0 4px; }
  h3 { font-size: 15px; }
  .sub { color: var(--text-3); font-size: 13px; margin-bottom: 16px; }

  /* ---- cards ---- */
  .card {
    background: var(--bg-2); border: 1px solid var(--stroke);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px;
    transition: border-color .12s;
  }
  .card:hover { border-color: var(--stroke-2); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft); }
  .row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .muted { color: var(--text-3); }
  .dim { color: var(--text-4); }
  .accent { color: var(--accent); }

  .pill {
    display: inline-block; padding: 1px 7px; border-radius: 10px;
    font-size: 11px; border: 1px solid var(--stroke); color: var(--text-3);
    white-space: nowrap;
  }
  .pill.diff { color: var(--warn); border-color: #e0a06055; }
  .pill.proposal { color: var(--info); border-color: #6ec1ff55; }
  .pill.ask { color: var(--bad); border-color: #ff8f8f55; }
  .pill.merge { color: #b98fff; border-color: #b98fff55; }
  .pill.confirmed { color: var(--ok); border-color: #7fd98f55; }
  .pill.unverified { color: #e0c060; border-color: #e0c06055; }

  /* ---- buttons ---- */
  button.act {
    background: var(--bg-3); color: var(--text);
    border: 1px solid var(--stroke); border-radius: var(--radius-sm);
    padding: 5px 10px; cursor: pointer; font-size: 13px; font-family: inherit;
    margin-right: 6px; transition: border-color .12s, color .12s;
  }
  button.act:hover { border-color: var(--accent); color: var(--accent); }
  button.act:disabled { opacity: .5; cursor: default; }
  button.act.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  button.act.primary:hover { color: #000; filter: brightness(1.08); }
  button.act.danger:hover { border-color: var(--bad); color: var(--bad); }

  /* ---- forms ---- */
  input, select, textarea {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--stroke); border-radius: var(--radius-sm);
    padding: 7px 10px; font-size: 14px; font-family: inherit;
  }
  textarea { width: 100%; min-height: 90px; resize: vertical; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .toolbar input[type=search] { flex: 1; min-width: 200px; }

  table.models { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  table.models th, table.models td { padding: 4px 6px; }
  table.models th { text-align: left; color: var(--text-3); font-weight: 500; }
  table.models td:first-child { color: var(--text-2); width: 70px; }
  table.models input { width: 100%; padding: 4px 6px; font-size: 12px; word-break: break-all; }

  /* ---- markdown ---- */
  .md h2, .md h3, .md h4 { margin: 10px 0 4px; color: var(--text); }
  .md h2 { font-size: 16px; }
  .md h3 { font-size: 15px; }
  .md h4 { font-size: 14px; }
  .md p { margin: 6px 0; }
  .md code { background: var(--bg); border: 1px solid var(--stroke); border-radius: 4px; padding: 0 4px; font-size: 12px; }
  .md b { color: var(--text); }

  pre {
    background: var(--bg); border: 1px solid var(--stroke);
    border-radius: var(--radius-sm); padding: 10px; overflow-x: auto; font-size: 12px;
    color: var(--text-2);
  }

  /* ---- empty states ---- */
  .empty { color: var(--text-4); padding: 30px; text-align: center; }
  .empty b { display: block; color: var(--text-3); font-size: 14px; margin-bottom: 4px; }

  /* ---- stats ---- */
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat b { font-size: 22px; color: var(--accent); }
  .stats { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 18px; }

  svg.graph { width: 100%; height: 420px; background: var(--bg); border: 1px solid var(--stroke); border-radius: var(--radius); }

  .err { color: var(--bad); font-size: 13px; }
  .ok { color: var(--ok); font-size: 13px; }

  label.f { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 13px; color: var(--text-2); }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; font-size: 13px; }
  .kv span:nth-child(odd) { color: var(--text-3); }

  /* ---- overlays: command palette ---- */
  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 12vh; z-index: 50;
  }
  .palette {
    background: var(--bg-2); border: 1px solid var(--stroke-2);
    border-radius: var(--radius); width: min(560px, 92vw);
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    overflow: hidden;
  }
  .palette input {
    width: 100%; border: 0; border-radius: 0; border-bottom: 1px solid var(--stroke);
    background: var(--bg); padding: 12px 14px; font-size: 15px;
  }
  .palette input:focus { outline: none; border-bottom-color: var(--accent); }
  .palette ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow-y: auto; }
  .palette li {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer;
    color: var(--text-2); font-size: 13px;
  }
  .palette li .hint { margin-left: auto; color: var(--text-4); font-size: 11px; }
  .palette li.active { background: var(--accent-soft); color: var(--text); }
  .palette li .icon { color: var(--accent); flex: 0 0 auto; }
  .palette .empty { padding: 20px; }

  /* ---- toasts ---- */
  #toasts {
    position: fixed; bottom: 18px; right: 18px; z-index: 60;
    display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
  }
  .toast {
    background: var(--bg-2); border: 1px solid var(--stroke-2);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-sm); padding: 10px 14px;
    font-size: 13px; color: var(--text); max-width: 340px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
    animation: toast-in .16s ease-out;
  }
  .toast.ok { border-left-color: var(--ok); }
  .toast.err { border-left-color: var(--bad); }
  .toast.leaving { opacity: 0; transform: translateY(4px); transition: all .18s; }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  .hint-bar {
    font-size: 11px; color: var(--text-4); margin-top: 10px;
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .hint-bar kbd {
    font-family: inherit; border: 1px solid var(--stroke);
    border-radius: 4px; padding: 0 4px; color: var(--text-3);
  }

  @media (max-width: 720px) {
    main { padding: 14px; }
    nav h1 span.word { display: none; }
    .kv { grid-template-columns: 1fr; gap: 0; }
    .kv span:nth-child(odd) { margin-top: 6px; }
  }
  /* Density is a data attribute: it changes several spacings at once. */
  :root[data-density="compact"] main { padding: 12px 16px; }
  :root[data-density="compact"] .card { padding: 8px 12px; margin-bottom: 6px; }
  :root[data-density="compact"] .sub { margin-bottom: 10px; }
</style>
</head>
<body>
<div id="app">
  <nav id="nav">
    <h1><span id="logo"></span><span class="word">Memory_OB</span></h1>
    <span class="spacer"></span>
    <button class="palette-btn" id="openPalette" title="Search and jump (Ctrl+K)">
      <span>Search</span><kbd>Ctrl K</kbd>
    </button>
  </nav>
  <main id="main"></main>
</div>
<div id="toasts"></div>
<div id="overlay"></div>
<script>
  /* The host injects the API base here when this page is served from a
     plugin backend. Standalone, it stays empty (same origin). */
  window.__MEMORY_OB_BASE__ = "";
  /* The write token. The backend injects it here, and every write echoes it
     back — the pages authenticate by shape, not by a hand-typed header. */
  window.__MEMORY_OB_TOKEN__ = "";
  /* Appearance: the backend injects the validated values here. */
  window.__MEMORY_OB_APPEARANCE__ = null;
</script>
<script>
'use strict';

const API = window.__MEMORY_OB_BASE__ || '';
const TOKEN = window.__MEMORY_OB_TOKEN__ || '';
const TOKEN_HEADER = 'X-Memory-OB-Token';

/* ---- icons ---------------------------------------------------------------
   Inline SVG, currentColor. No icon font, no external request. */
const ICONS = {
  brain: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3a3 3 0 0 0-3 3 3 3 0 0 0-2 3c0 .6.2 1.2.5 1.7A3 3 0 0 0 4 14a3 3 0 0 0 3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3z"/><path d="M15 3a3 3 0 0 1 3 3 3 3 0 0 1 2 3c0 .6-.2 1.2-.5 1.7A3 3 0 0 1 20 14a3 3 0 0 1-3 3 3 3 0 0 1-3 3 3 3 0 0 1-3-3"/></svg>',
  review: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  vault: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16"/></svg>',
  search: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  graph: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M8.5 7.5l7 8M15.5 6h-7M6 8.5v7"/></svg>',
  journal: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  notes: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  health: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
  settings: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  intake: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>',
  recall: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
};

const TABS = [
  ['review', 'Review', 'review'],
  ['vault', 'Vault', 'vault'],
  ['search', 'Search', 'search'],
  ['graph', 'Graph', 'graph'],
  ['journal', 'Journal', 'journal'],
  ['notes', 'Notes', 'notes'],
  ['health', 'Health', 'health'],
  ['settings', 'Settings', 'settings'],
  ['intake', 'Intake', 'intake'],
  ['recall', 'Recall', 'recall'],
];

const state = {
  tab: 'review',
  data: {},
  loading: false,
  error: '',
  selectedCard: null,
};

/* ---- api --------------------------------------------------------------- */

async function api(path, opts) {
  const method = (opts && opts.method) || 'GET';
  /* The payload stays an OBJECT: the host bridge serializes it, so handing it
     a string here would double-encode and FastAPI would reject the body. */
  const payload = opts && opts.body ? opts.body : undefined;
  /* Writes echo the injected token; reads stay open. The actor header tells
     the log WHO clicked — the owner through these pages, the agent through
     its own tools. */
  const headers = Object.assign(
    { 'Content-Type': 'application/json', 'X-Memory-OB-Actor': 'owner' },
    method === 'GET' ? {} : { [TOKEN_HEADER]: TOKEN }
  );

  /* Inside the Hermes host shell a plain fetch carries no dashboard session
     token, so the app's authenticated bridge does the calling instead. The
     bridge is reached through the parent window because this document lives
     in a srcdoc iframe. Standalone (or a plain browser tab) falls through to
     fetch against the same origin. */
  const bridge = window.parent && window.parent.hermesDesktop && window.parent.hermesDesktop.api;
  if (typeof bridge === 'function') {
    try {
      return await bridge({ path: API + path, method, body: payload, headers });
    } catch (e) {
      throw new Error((e && e.message) || 'request failed');
    }
  }

  const res = await fetch(API + path, opts ? {
    method: method,
    headers,
    body: payload === undefined ? undefined : JSON.stringify(payload),
  } : undefined);
  if (!res.ok) {
    let msg = res.status + ' ' + res.statusText;
    try { msg = (await res.json()).detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}

/* ---- helpers ------------------------------------------------------------ */

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
  }[c]));
}

/* Minimal markdown. The input is escaped FIRST, so no character in the source
   text can become a tag — the regexes below only ever see entities. */
function md(s) {
  let h = esc(s);
  h = h.replace(/^###### (.*)$/gm, '<h4>$1</h4>')
       .replace(/^### (.*)$/gm, '<h4>$1</h4>')
       .replace(/^## (.*)$/gm, '<h3>$1</h3>')
       .replace(/^# (.*)$/gm, '<h2>$1</h2>')
       .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
       .replace(/\*(.+?)\*/g, '<i>$1</i>')
       .replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
  return `<div class="md">${h}</div>`;
}

function pill(text, cls) { return `<span class="pill ${cls || ''}">${esc(text)}</span>`; }

function trustLabel(r) {
  if (r.trust >= 0.8) return pill('confirmed', 'confirmed');
  if (r.trust >= 0.3) return pill('unverified', 'unverified');
  return pill('raw', '');
}

function empty(title, body) {
  return `<div class="empty"><b>${esc(title)}</b>${esc(body || '')}</div>`;
}

/* ---- toasts -------------------------------------------------------------
   Every failure used to be an alert(), which blocks the page. Toasts report
   and get out of the way. */
function toast(message, kind, ms) {
  const box = document.getElementById('toasts');
  if (!box) { alert(message); return; }
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = message;
  box.appendChild(el);
  setTimeout(() => {
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 200);
  }, ms || 3200);
}

/* ---- theme --------------------------------------------------------------
   The host's --ui-* values win; the appearance settings from the backend are
   applied on top. Both are re-read every second so an Appearance change in
   Hermes follows through without a reload. */
const THEME_MAP = [
  ['--ui-bg-chrome', '--bg'],
  ['--ui-bg-sidebar', '--bg'],
  ['--ui-bg-secondary', '--bg-2'],
  ['--ui-bg-elevated', '--bg-3'],
  ['--ui-stroke-secondary', '--stroke'],
  ['--ui-stroke-tertiary', '--stroke-2'],
  ['--ui-text-primary', '--text'],
  ['--ui-text-secondary', '--text-2'],
  ['--ui-text-tertiary', '--text-3'],
  ['--ui-text-quaternary', '--text-4'],
  ['--ui-accent', '--accent'],
];

function applyTheme() {
  const root = document.documentElement;
  const host = window.parent;

  /* Host colours first, so an explicit appearance setting can override. */
  if (host && host !== window && host.document) {
    try {
      const cs = host.getComputedStyle(host.document.documentElement);
      for (const [from, to] of THEME_MAP) {
        const value = cs.getPropertyValue(from).trim();
        if (value) root.style.setProperty(to, value);
      }
    } catch (e) { /* cross-origin parent — keep our own theme */ }
  }

  /* Then the owner's appearance settings. */
  const a = window.__MEMORY_OB_APPEARANCE__;
  if (a) {
    if (a.css) {
      for (const [k, v] of Object.entries(a.css)) root.style.setProperty(k, v);
    }
    if (a.theme && a.theme !== 'auto') {
      root.setAttribute('data-theme', a.theme);
    } else {
      root.removeAttribute('data-theme');
    }
    if (a.density) root.setAttribute('data-density', a.density);
    if (a.font_size) root.style.setProperty('--font-size', Number(a.font_size) + 'px');
  }
}

/* ---- routing ------------------------------------------------------------
   Hash routing: the tab is the URL, so back/forward work and a view can be
   linked. Kept in sync on every render. */
function route() {
  const hash = location.hash.replace(/^#\/?/, '');
  return TABS.some(t => t[0] === hash) ? hash : 'review';
}

function go(tab) {
  if (location.hash === '#/' + tab) render();
  else location.hash = '#/' + tab;
}

window.addEventListener('hashchange', render);

/* ---- render ------------------------------------------------------------- */

async function render() {
  state.tab = route();
  if (location.hash !== '#/' + state.tab) history.replaceState(null, '', '#/' + state.tab);

  const nav = document.getElementById('nav');
  nav.innerHTML = '<h1>' + ICONS.brain + '<span class="word">Memory_OB</span></h1><span class="spacer"></span>';
  for (const [id, label, icon] of TABS) {
    const b = document.createElement('button');
    b.innerHTML = ICONS[icon] + '<span>' + esc(label) + '</span>';
    b.className = state.tab === id ? 'active' : '';
    if (id === 'review' && state.data.reviewCount) {
      const s = document.createElement('span');
      s.className = 'badge';
      s.textContent = state.data.reviewCount;
      b.appendChild(s);
    }
    b.onclick = () => go(id);
    nav.appendChild(b);
  }
  const pal = document.createElement('button');
  pal.className = 'palette-btn';
  pal.id = 'openPalette';
  pal.innerHTML = ICONS.search + '<span>Search</span><kbd>Ctrl K</kbd>';
  pal.onclick = openPalette;
  nav.appendChild(pal);

  /* Capture the tab we are loading. A slow view (Settings reads the model
     config over the bridge) must never overwrite a tab the owner already
     clicked past — without this guard the earlier response lands last and
     the screen "sticks". */
  const tab = state.tab;
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty"><b>Loading…</b></div>';
  try {
    const fn = VIEWS[tab];
    const html = await fn(state.data);
    if (state.tab !== tab) return;
    main.innerHTML = html;
    state.selectedCard = null;
    await bindLate();
  } catch (e) {
    if (state.tab !== tab) return;
    main.innerHTML = `<div class="empty"><b>Something went wrong</b><div class="err">${esc(e.message)}</div></div>`;
  }
}

/* ---- command palette ---------------------------------------------------- */

function allCommands() {
  const cmds = TABS.map(([id, label, icon]) => ({
    title: label, hint: 'go to', icon: ICONS[icon], run: () => go(id),
  }));
  try {
    for (const r of (state.data.vaultRecords || []).slice(0, 12)) {
      cmds.push({
        title: r.title || '(untitled)',
        hint: r.kind || 'record',
        icon: ICONS.vault,
        run: () => go('vault'),
      });
    }
  } catch (e) {}
  cmds.push({ title: 'Run the consistency sweep', hint: 'action', icon: ICONS.health, run: runSweep });
  cmds.push({ title: 'Run doctor', hint: 'action', icon: ICONS.health, run: () => go('health') });
  return cmds;
}

function openPalette() {
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = `
    <div class="scrim" role="dialog" aria-modal="true" aria-label="Search">
      <div class="palette">
        <input id="palInput" type="text" placeholder="Search tabs, records, actions…" autocomplete="off">
        <ul id="palList"></ul>
      </div>
    </div>`;
  const input = document.getElementById('palInput');
  const list = document.getElementById('palList');
  let items = [];
  let active = 0;
  const lastFocus = document.activeElement;

  function draw() {
    const q = input.value.trim().toLowerCase();
    items = allCommands().filter(c => c.title.toLowerCase().includes(q));
    active = 0;
    if (!items.length) {
      list.innerHTML = '<div class="empty">No matches.</div>';
      return;
    }
    list.innerHTML = items.map((c, i) => `
      <li class="${i === 0 ? 'active' : ''}" data-i="${i}" role="option" aria-selected="${i === 0}">
        <span class="icon">${c.icon}</span>
        <span>${esc(c.title)}</span>
        <span class="hint">${esc(c.hint)}</span>
      </li>`).join('');
    for (const li of list.querySelectorAll('li')) {
      li.onclick = () => choose(Number(li.dataset.i));
      li.onmousemove = () => { active = Number(li.dataset.i); mark(); };
    }
  }

  function mark() {
    for (const li of list.querySelectorAll('li')) {
      const on = Number(li.dataset.i) === active;
      li.classList.toggle('active', on);
      li.setAttribute('aria-selected', on ? 'true' : 'false');
    }
    const el = list.querySelector(`li[data-i="${active}"]`);
    if (el) el.scrollIntoView({ block: 'nearest' });
  }

  function choose(i) {
    const c = items[i];
    close();
    if (c) c.run();
  }

  function close() {
    overlay.innerHTML = '';
    document.removeEventListener('keydown', onKey, true);
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function onKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, items.length - 1); mark(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); mark(); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(active); }
  }

  input.addEventListener('input', draw);
  document.addEventListener('keydown', onKey, true);
  overlay.querySelector('.scrim').onclick = (e) => { if (e.target.classList.contains('scrim')) close(); };
  draw();
  input.focus();
}

/* ---- keyboard triage ----------------------------------------------------
   j/k move between cards, then a number key runs the matching action. The
   review queue is the most-used screen and the mouse is the slow way
   through it. */
const ACT_KEYS = { 1: 'approve', 2: 'deny', 3: 'later', 4: 'keep_both', 5: 'take_old', 6: 'merge' };

function bindCardKeys() {
  const cards = Array.from(document.querySelectorAll('[data-card]'));
  if (!cards.length) return;
  let idx = 0;
  const select = (i) => {
    idx = Math.max(0, Math.min(i, cards.length - 1));
    cards.forEach((c, n) => c.classList.toggle('selected', n === idx));
    cards[idx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    state.selectedCard = cards[idx].getAttribute('data-card');
  };
  select(0);
  document.addEventListener('keydown', (e) => {
    if (state.tab !== 'review') return;
    const tag = (document.activeElement || {}).tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.key === 'j') { e.preventDefault(); select(idx + 1); }
    else if (e.key === 'k') { e.preventDefault(); select(idx - 1); }
    else if (ACT_KEYS[e.key]) {
      const btn = cards[idx] && cards[idx].querySelector(`[data-act="${ACT_KEYS[e.key]}"]`);
      if (btn) { e.preventDefault(); btn.click(); }
    }
  });
}

  let html = `<h2>Review</h2><div class="sub">${cards.length} card(s) waiting. The AI proposes; you sign.</div>`;
  for (const c of cards) {
    html += `<div class="card" data-card="${c.id}">

        <b>${esc(c.title)}</b>

      </div>`;
    if (c.body) html += `<div class="muted" style="margin:6px 0">${esc(c.body)}</div>`;
    if (c.type === 'diff' && c.old && c.new) {
      html += `<pre>${esc(JSON.stringify(c.old, null, 2))} → ${esc(JSON.stringify(c.new, null, 2))}</pre>`;

    if (c.speakers && c.speakers.length) {

    }

               <button class="act" data-act="keep_both">keep both</button>
               <button class="act" data-act="take_old">take old</button>`;

      html += `<button class="act primary" data-act="approve">approve</button>
               <button class="act danger" data-act="deny">deny</button>`;
    } else if (c.type === 'ask') {
      html += `<button class="act primary" data-act="confirm">confirm</button>

async function viewGraph() {
  const data = await api('/api/graph');
  const nodes = data.nodes || [];
  const edges = data.edges || [];
  const f = state.graphFilter || (state.graphFilter = { subject: '', tag: '', kind: '', trust: '' });
  const t = parseFloat(f.trust);
  const visible = nodes.filter(n =>
    (!f.subject || (n.subject || '').includes(f.subject)) &&
    (!f.tag || (n.tags || []).some(x => x.includes(f.tag))) &&
    (!f.kind || n.kind === f.kind) &&
    (isNaN(t) || n.trust >= t));
  const ids = new Set(visible.map(n => n.id));
  const shownEdges = edges.filter(e => ids.has(e.src) && ids.has(e.dst));

  const kinds = [...new Set(nodes.map(n => n.kind))].sort();
  const sel = (id, val, opts) => `<select id="${id}"><option value="">all</option>` +
    opts.map(o => `<option value="${esc(o)}" ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('') + '</select>';

  if (!nodes.length) {
    return `<h2>Graph</h2><div class="sub">No connections yet.</div>`
      + empty('Nothing to draw', 'Records with links, supersedes, contradicts or supports will appear here.')
      + `<div class="card">${linkForm()}</div>`;
  }

  const cx = 450, cy = 210, R = 150;
  const pos = visible.map((n, i) => {
    const a = (2 * Math.PI * i) / visible.length;
    return { id: n.id, x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) };
  });
  const byId = Object.fromEntries(pos.map(p => [p.id, p]));
  const title = Object.fromEntries(nodes.map(n => [n.id, n.title || n.id]));
  const edgeColor = l => l === 'contradicts' ? 'var(--bad)'
    : l === 'supports' ? 'var(--ok)'
    : l === 'supersedes' ? 'var(--warn)'
    : l === 'shares_tag' ? 'var(--text-4)' : 'var(--info)';
  let svg = `<svg class="graph" viewBox="0 0 900 420">`;
  for (const e of shownEdges) {
    const a = byId[e.src], b = byId[e.dst];
    if (!a || !b) continue;
    const color = edgeColor(e.label);
    const dash = e.label === 'shares_tag' ? ' stroke-dasharray="3 3"' : '';
    svg += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="1.5" opacity="0.75"${dash}/>`;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    svg += `<text x="${mx}" y="${my}" fill="${color}" font-size="10" text-anchor="middle">${esc(e.label)}</text>`;
  }
  for (const p of pos) {
    svg += `<circle cx="${p.x}" cy="${p.y}" r="14" fill="var(--bg-3)" stroke="var(--accent)"/>`;
    svg += `<text x="${p.x}" y="${p.y + 26}" fill="var(--text-3)" font-size="9" text-anchor="middle">${esc((title[p.id] || p.id).slice(0, 14))}</text>`;
  }
  svg += `</svg>`;

  return `<h2>Graph</h2><div class="sub">${visible.length} of ${nodes.length} nodes · ${shownEdges.length} of ${edges.length} edges. Dashed grey is the machine's shared-tag layer; solid colours are curated links.</div>
    <div class="card"><div class="toolbar">
      <input id="gfSubject" placeholder="person" value="${esc(f.subject)}">
      ${sel('gfKind', f.kind, kinds)}
      <input id="gfTag" placeholder="tag" value="${esc(f.tag)}">
      <input id="gfTrust" placeholder="min trust" value="${esc(f.trust)}" style="width:80px">
      <button class="act" id="gfApply">Filter</button>
      <button class="act" id="gfRebuild" title="Rebuild the shared-tag layer">Rebuild shared edges</button>
    </div></div>
    ${svg}
    <div class="card" style="margin-top:10px">${linkForm()}
      <div id="linkOut"></div>
    </div>`;
}

            ${[12, 13, 14, 15, 16, 18].map(n => `<option value="${n}" ${Number(appearance.font_size) === n ? 'selected' : ''}>${n}px</option>`).join('')}
          </select>
        </label>
        <label class="f" style="margin:0">Density
          <select id="appDensity">
            <option value="comfortable" ${appearance.density === 'comfortable' ? 'selected' : ''}>Comfortable</option>
            <option value="compact" ${appearance.density === 'compact' ? 'selected' : ''}>Compact</option>
          </select>
        </label>
        <button class="act primary" id="saveAppearance">Apply</button>
      </div>
      <div id="appearanceMsg"></div>` : '';
  return `<h2>Settings</h2><div class="sub">Model selector — the app's aux-model pattern. <code>auto</code> follows main (Hermes when hosted).</div>
    <div class="card">
      <div class="kv" style="margin-bottom:12px">
        <span>backend</span><span class="accent">${esc(data.backend)}</span>
      </div>
      <table class="models">
        <colgroup>
          <col style="width:64px"><col style="width:78px"><col style="width:110px"><col>
        </colgroup>
        <thead><tr>
          <th style="padding:4px">slot</th><th>provider</th><th>model</th><th>base_url</th>
        </tr></thead>
        <tbody>${slotRows}</tbody>
      </table>
      <div class="toolbar" style="margin-top:12px">
        <button class="act primary" id="saveModels">Save</button>
        <button class="act" id="refreshModels">Refresh</button>
      </div>
      <div id="modelMsg"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Appearance</h3>
      <div class="sub">Applied on top of the Hermes theme, so the app still follows the host's colours.</div>
      ${appearanceBlock}
    </div>
    <div class="card">
      <h3 style="margin-top:0">Vault</h3>
      <div class="kv">
        <span>vault path</span><span>${esc(location.pathname.replace('/ui', '') || '(default)')}</span>
      </div>
      <div class="toolbar" style="margin-top:10px">
        <button class="act" id="doExport">Export vault</button>
        <button class="act" id="doEmbed">Compute embeddings</button>
        <button class="act" id="doBackup">Back up</button>
      </div>
      <div id="vaultMsg"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Brain settings</h3>
      <div class="kv"><span>brain path</span><span>${esc(settings.brain_path || '(default vault)')}</span></div>
      <div class="kv"><span>semantic search</span><span>${settings.semantic ? 'on' : 'off'}</span></div>
      <div class="kv"><span>sweep schedule</span><span>${esc(settings.sweep_schedule)}</span></div>
      <div class="kv"><span>checkpoint before compress</span><span>${settings.checkpoint_required ? 'on' : 'off'}</span></div>
      <div class="kv"><span>show demo records</span><span>${settings.demo_visible ? 'on' : 'off'}</span></div>
      <div class="toolbar" style="margin-top:10px">
        <button class="act" id="toggleSemantic">${settings.semantic ? 'Turn semantic off' : 'Turn semantic on'}</button>
        <button class="act" id="toggleCheckpoint">${settings.checkpoint_required ? 'Turn checkpoint off' : 'Turn checkpoint on'}</button>
        <button class="act" id="toggleDemo">${settings.demo_visible ? 'Hide demo records' : 'Show demo records'}</button>
      </div>
      <div id="appSettingsMsg"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Private records</h3>
      <div class="kv"><span>neverSend records</span><span>${neverSend.length}</span></div>
      <div class="sub">Ids only — the contents never leave the store (law 2). Clearing the flag is your decision and is logged.</div>
      <div id="neverSendList">${neverSend.map(id => `<div class="kv"><span>${esc(id)}</span><button class="act" data-clear-ns="${esc(id)}">clear flag</button></div>`).join('')}</div>
    </div>`;
}

async function viewIntake() {
  return `<h2>Intake</h2><div class="sub">Capture anything. It lands as candidate facts — truth needs a card.</div>
    <div class="card">
      <label class="f">Capture text
        <textarea id="capText" placeholder="Paste a session, a note, a thought…"></textarea>
      </label>
      <div class="toolbar">
        <button class="act primary" id="doCapture">Capture</button>
        <button class="act" id="doDream">Run nightly dream</button>
        <button class="act" id="doChapter">Draft a Life Story chapter</button>
      </div>
      <div id="capOut"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Bring a file in</h3>
      <div class="sub">The raw bytes are copied unchanged into <code>01 Inbox</code> and fingerprinted. Memory_OB never rewrites the original.</div>
      <div class="toolbar">
        <input type="file" id="intakeFile">
        <button class="act" id="doIntake">Copy in</button>
      </div>
      <div id="intakeOut"></div>
    </div>
    <div class="card">
      <div class="kv">
        <span>note</span><span>Candidates land below the truth line with a score. Nothing becomes truth without a Review card.</span>
      </div>
    </div>`;
}

async function viewRecall() {
  const activity = await api('/api/activity?limit=100');
  const rec = (await api('/api/receipts?limit=50')).receipts || [];
  const rows = activity.filter(a => ['receipt', 'sync', 'capture', 'search'].includes(a.action));
  const line = a => `<div class="kv"><span>${esc(a.action)}</span><span>${esc(a.detail || '')}</span><span class="dim">${esc((a.at || '').replace('T', ' ').slice(0, 19))}</span></div>`;
  return `<h2>Recall feed</h2><div class="sub">What memory has been doing — captures, recalls, receipts and syncs. Receipts are audit records, never blockers.</div>
    <div class="card">
      <h3 style="margin-top:0">Sharing receipts (${rec.length})</h3>
      ${rec.length ? rec.map(r => `<div class="kv"><span>${esc(r.file)}</span></div>`).join('') : empty('No memory has left the store yet', '')}
    </div>
    <div class="card">
      <h3 style="margin-top:0">Recent activity</h3>
      ${rows.length ? rows.slice(0, 30).map(line).join('') : empty('Nothing yet', '')}
    </div>`;
}

const VIEWS = {
  review: viewReview,
  vault: viewVault,
  search: viewSearch,
  graph: viewGraph,
  journal: viewJournal,
  notes: viewNotes,
  health: viewHealth,
  settings: viewSettings,
  intake: viewIntake,
  recall: viewRecall,
};

/* ---- late bindings ------------------------------------------------------
   Views render buttons after innerHTML, so anything that needs a node is
   wired here rather than with inline handlers. */
async function bindLate() {
  if (state.tab === 'health') {
    const b = document.getElementById('runSweep');
    if (b) b.onclick = async () => {
      b.disabled = true;
      try {
        const r = await api('/api/sweep', { method: 'POST' });
        document.getElementById('sweepOut').innerHTML =
          `<div class="card"><pre>${esc(JSON.stringify(r, null, 2))}</pre></div>`;
        toast('Sweep complete.', 'ok', 2000);
      } catch (e) { toast(e.message, 'err'); }
      b.disabled = false;
    };
  }
  if (state.tab === 'graph') {
    const apply = document.getElementById('gfApply');
    if (apply) apply.onclick = () => {
      const f = state.graphFilter || (state.graphFilter = {});
      for (const [id, key] of [['gfSubject', 'subject'], ['gfKind', 'kind'], ['gfTag', 'tag'], ['gfTrust', 'trust']]) {
        const el = document.getElementById(id);
        if (el) f[key] = el.value.trim();
      }
      render();
    };
    const rebuild = document.getElementById('gfRebuild');
    if (rebuild) rebuild.onclick = async () => {
      rebuild.disabled = true;
      try {
        const r = await api('/api/graph/rebuild', { method: 'POST', body: {} });
        rebuild.textContent = `${r.rebuilt} shared edge(s)`;
      } catch (e) { toast(e.message, 'err'); }
      setTimeout(() => { rebuild.textContent = 'Rebuild shared edges'; rebuild.disabled = false; }, 1500);
    };
    const link = document.getElementById('doLink');
    if (link) link.onclick = async () => {
      const src = document.getElementById('linkSrc').value.trim();
      const dst = document.getElementById('linkDst').value.trim();
      const label = document.getElementById('linkLabel').value;
      const out = document.getElementById('linkOut');
      try {
        await api('/api/graph/link', { method: 'POST', body: { src, dst, label } });
        out.innerHTML = '<span class="ok">Linked.</span>';
        render();
      } catch (e) { out.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
  }
  if (state.tab === 'settings') {
    const save = document.getElementById('saveModels');
    if (save) save.onclick = async () => {
      const out = { main: { provider: 'auto', model: '', base_url: '' }, auxiliary: {} };
      document.querySelectorAll('[data-slot]').forEach(inp => {
        const slot = inp.getAttribute('data-slot');
        const k = inp.getAttribute('data-k');
        out.auxiliary[slot] = out.auxiliary[slot] || {};
        out.auxiliary[slot][k] = inp.value;
      });
      try {
        await api('/api/settings', { method: 'POST', body: out });
        document.getElementById('modelMsg').innerHTML = '<span class="ok">Saved.</span>';
      } catch (e) { document.getElementById('modelMsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
    const appBtn = document.getElementById('saveAppearance');
    if (appBtn) appBtn.onclick = async () => {
      const out = {
        theme: document.getElementById('appTheme').value,
        accent: document.getElementById('appAccent').value,
        font_size: Number(document.getElementById('appFontSize').value),
        density: document.getElementById('appDensity').value,
      };
      const msg = document.getElementById('appearanceMsg');
      try {
        const saved = await api('/api/appearance', { method: 'POST', body: out });
        window.__MEMORY_OB_APPEARANCE__ = saved;
        applyTheme();
        msg.innerHTML = '<span class="ok">Applied.</span>';
      } catch (e) { msg.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
    const exp = document.getElementById('doExport');
    if (exp) exp.onclick = async () => {
      try { await api('/api/export', { method: 'POST' }); document.getElementById('vaultMsg').innerHTML = '<span class="ok">Vault exported.</span>'; }
      catch (e) { document.getElementById('vaultMsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
    const emb = document.getElementById('doEmbed');
    if (emb) emb.onclick = async () => {
      try { const r = await api('/api/embed', { method: 'POST', body: {} }); document.getElementById('vaultMsg').innerHTML = `<span class="ok">${r.computed} computed, ${r.cached} cached.</span>`; }
      catch (e) { document.getElementById('vaultMsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
    const backup = document.getElementById('doBackup');
    if (backup) backup.onclick = async () => {
      try { const r = await api('/api/backup', { method: 'POST', body: {} }); document.getElementById('vaultMsg').innerHTML = `<span class="ok">Backed up: ${esc(r.backup)}</span>`; }
      catch (e) { document.getElementById('vaultMsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
    const flip = async (key) => {
      try {
        await api('/api/app-settings', { method: 'POST', body: { [key]: !(settings[key]) } });
        document.getElementById('appSettingsMsg').innerHTML = '<span class="ok">Saved.</span>';
        render();
      } catch (e) { document.getElementById('appSettingsMsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
    for (const [id, key] of [['toggleSemantic', 'semantic'], ['toggleCheckpoint', 'checkpoint_required'], ['toggleDemo', 'demo_visible']]) {
      const b = document.getElementById(id);
      if (b) b.onclick = () => flip(key);
    }
    document.querySelectorAll('[data-clear-ns]').forEach(b => {
      b.onclick = async () => {
        try {
          await api('/api/neversend/' + encodeURIComponent(b.getAttribute('data-clear-ns')), { method: 'POST' });
          render();
        } catch (e) { toast(e.message, 'err'); }
      };
    });
  }
  if (state.tab === 'intake') {
    const up = document.getElementById('doIntake');
    if (up) up.onclick = async () => {
      const file = document.getElementById('intakeFile').files[0];
      const out = document.getElementById('intakeOut');
      if (!file) { out.innerHTML = '<span class="err">Choose a file first.</span>'; return; }
      const data = await file.arrayBuffer();
      const b64 = btoa(String.fromCharCode(...new Uint8Array(data)));
      try {
        const r = await api('/api/intake/data', { method: 'POST', body: { name: file.name, data_b64: b64 } });
        out.innerHTML = `<span class="ok">${r.bytes} bytes copied — sha256 ${esc(r.sha256.slice(0, 16))}…</span>`;
      } catch (e) { out.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
    const cap = document.getElementById('doCapture');
    if (cap) cap.onclick = async () => {
      const text = document.getElementById('capText').value.trim();
      if (!text) return;
      cap.disabled = true;
      try {
        const r = await api('/api/capture', { method: 'POST', body: { text } });
        document.getElementById('capOut').innerHTML =
          `<div class="card"><b>${r.candidates} candidate(s)</b><pre>${esc(JSON.stringify(r.facts, null, 2))}</pre></div>`;
      } catch (e) { toast(e.message, 'err'); }
      cap.disabled = false;
    };
    const dream = document.getElementById('doDream');
    if (dream) dream.onclick = async () => {
      dream.disabled = true;
      try { const r = await api('/api/dream', { method: 'POST' }); document.getElementById('capOut').innerHTML = `<div class="card"><pre>${esc(JSON.stringify(r, null, 2))}</pre></div>`; }
      catch (e) { toast(e.message, 'err'); }
      dream.disabled = false;
    };
    const ch = document.getElementById('doChapter');
    if (ch) ch.onclick = async () => {
      ch.disabled = true;
      try { const r = await api('/api/chapter', { method: 'POST', body: {} }); document.getElementById('capOut').innerHTML = `<div class="card"><pre>${esc(JSON.stringify(r, null, 2))}</pre></div>`; }
      catch (e) { toast(e.message, 'err'); }
      ch.disabled = false;
    };
  }
}

async function runSweep() {
  try {
    await api('/api/sweep', { method: 'POST' });
    toast('Sweep complete.', 'ok', 2000);
    go('health');
  } catch (e) { toast(e.message, 'err'); }
}

/* ---- boot --------------------------------------------------------------- */

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openPalette();
  }
});

applyTheme();
setInterval(applyTheme, 1000);
render();
</script>
