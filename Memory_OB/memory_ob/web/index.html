<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- An empty data URI keeps the browser from requesting /favicon.ico and
     logging a 404 on every page load. -->
<link rel="icon" href="data:,">
<title>Memory_OB</title>
<style>
  /* Design tokens.
     The host sets --ui-* names on its own <html>; the script at the bottom of
     this file copies them onto our root, so any change in the Hermes
     Appearance settings follows through. The values here are the standalone
     fallbacks, used when there is no host to read.

     Theme is a data attribute, not a variable set: light and dark need
     different values for the same token, and one indirection keeps the rest of
     the stylesheet free of branching. */
  :root {
    --accent: #d4a74a;
    --accent-soft: #d4a74a22;
    --bg: #1a1a1a;
    --bg-2: #222222;
    --bg-3: #2b2b2b;
    --stroke: #333333;
    --stroke-2: #444444;
    --text: #e8e8e8;
    --text-2: #b0b0b0;
    --text-3: #888888;
    --text-4: #666666;
    --ok: #7fd98f;
    --warn: #e0a060;
    --bad: #ff8f8f;
    --info: #6ec1ff;
    --radius: 8px;
    --radius-sm: 6px;
    --font: var(--ui-font, system-ui, -apple-system, "Segoe UI", sans-serif);
    --font-size: 14px;
  }
  :root[data-theme="light"] {
    --bg: #fafafa;
    --bg-2: #ffffff;
    --bg-3: #f0f0f0;
    --stroke: #e2e2e2;
    --stroke-2: #cfcfcf;
    --text: #1c1c1c;
    --text-2: #4a4a4a;
    --text-3: #6b6b6b;
    --text-4: #5a5a5a;
    --accent-soft: #d4a74a18;
    --ok: #2e8b47;
    --warn: #a86a1a;
    --bad: #b83333;
    --info: #1f6fb2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: var(--font-size);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  /* Column: the tab bar on top, the view below. Inside Hermes this keeps a
     single sidebar (the app's) instead of nesting a second one. */
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ---- top bar ---- */
  nav {
    display: flex; flex-wrap: wrap; align-items: center; gap: 2px;
    flex: 0 0 auto;
    background: var(--bg-2);
    border-bottom: 1px solid var(--stroke);
    padding: 6px 10px;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  nav h1 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-3); margin: 0 10px 0 2px; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  nav h1 svg { color: var(--accent); }
  nav button {
    display: inline-flex; align-items: center; gap: 5px;
    background: none; border: 0; color: var(--text-2);
    padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer;
    font-size: 13px; font-family: inherit; white-space: nowrap;
    transition: background .12s, color .12s;
  }
  nav button:hover { background: var(--stroke); color: var(--text); }
  nav button.active { background: var(--stroke); color: var(--accent); }
  nav button:focus-visible, button.act:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  nav .badge {
    display: inline-block; margin-left: 4px; background: var(--accent); color: #000;
    border-radius: 10px; padding: 0 6px; font-size: 11px; font-weight: 600;
  }
  nav .spacer { flex: 1 1 auto; }
  nav .palette-btn { color: var(--text-3); }
  nav .palette-btn kbd {
    font-family: inherit; font-size: 11px; color: var(--text-4);
    border: 1px solid var(--stroke); border-radius: 4px; padding: 0 4px;
  }

  main { flex: 1 1 auto; overflow-y: auto; padding: 20px 24px; }
  h2 { font-size: 18px; margin: 0 0 4px; }
  h3 { font-size: 15px; }
  .sub { color: var(--text-3); font-size: 13px; margin-bottom: 16px; }

  /* ---- cards ---- */
  .card {
    background: var(--bg-2); border: 1px solid var(--stroke);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px;
    transition: border-color .12s;
  }
  .card:hover { border-color: var(--stroke-2); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft); }
  .row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .muted { color: var(--text-3); }
  .dim { color: var(--text-4); }
  .accent { color: var(--accent); }

  .pill {
    display: inline-block; padding: 1px 7px; border-radius: 10px;
    font-size: 11px; border: 1px solid var(--stroke); color: var(--text-3);
    white-space: nowrap;
  }
  .pill.diff { color: var(--warn); border-color: #e0a06055; }
  .pill.proposal { color: var(--info); border-color: #6ec1ff55; }
  .pill.ask { color: var(--bad); border-color: #ff8f8f55; }
  .pill.merge { color: #b98fff; border-color: #b98fff55; }
  .pill.confirmed { color: var(--ok); border-color: #7fd98f55; }
  .pill.unverified { color: #e0c060; border-color: #e0c06055; }
  :root[data-theme="light"] .pill.merge { color: #7a4fd6; }
  :root[data-theme="light"] .pill.unverified { color: #8a6a00; }

  /* ---- buttons ---- */
  button.act {
    background: var(--bg-3); color: var(--text);
    border: 1px solid var(--stroke); border-radius: var(--radius-sm);
    padding: 5px 10px; cursor: pointer; font-size: 13px; font-family: inherit;
    margin-right: 6px; transition: border-color .12s, color .12s;
  }
  button.act:hover { border-color: var(--accent); color: var(--accent); }
  button.act:disabled { opacity: .5; cursor: default; }
  button.act.primary { background: var(--accent); color: var(--accent-text, #000); border-color: var(--accent); font-weight: 600; }
  button.act.primary:hover { color: var(--accent-text, #000); filter: brightness(1.08); }
  button.act.danger:hover { border-color: var(--bad); color: var(--bad); }

  /* ---- forms ---- */
  input, select, textarea {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--stroke); border-radius: var(--radius-sm);
    padding: 7px 10px; font-size: 14px; font-family: inherit;
  }
  textarea { width: 100%; min-height: 90px; resize: vertical; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .toolbar input[type=search] { flex: 1; min-width: 200px; }

  table.models { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  table.models th, table.models td { padding: 4px 6px; }
  table.models th { text-align: left; color: var(--text-3); font-weight: 500; }
  table.models td:first-child { color: var(--text-2); width: 70px; }
  table.models input { width: 100%; padding: 4px 6px; font-size: 12px; word-break: break-all; }

  /* ---- markdown ---- */
  .md h2, .md h3, .md h4 { margin: 10px 0 4px; color: var(--text); }
  .md h2 { font-size: 16px; }
  .md h3 { font-size: 15px; }
  .md h4 { font-size: 14px; }
  .md p { margin: 6px 0; }
  .md code { background: var(--bg); border: 1px solid var(--stroke); border-radius: 4px; padding: 0 4px; font-size: 12px; }
  .md b { color: var(--text); }

  pre {
    background: var(--bg); border: 1px solid var(--stroke);
    border-radius: var(--radius-sm); padding: 10px; overflow-x: auto; font-size: 12px;
    color: var(--text-2);
  }

  /* ---- empty states ---- */
  .empty { color: var(--text-4); padding: 30px; text-align: center; }
  .empty b { display: block; color: var(--text-3); font-size: 14px; margin-bottom: 4px; }

  /* ---- stats ---- */
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat b { font-size: 22px; color: var(--accent); }
  .stats { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 18px; }

  svg.graph { width: 100%; height: 420px; background: var(--bg); border: 1px solid var(--stroke); border-radius: var(--radius); }

  .err { color: var(--bad); font-size: 13px; }
  .ok { color: var(--ok); font-size: 13px; }

  label.f { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 13px; color: var(--text-2); }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; font-size: 13px; }
  .kv span:nth-child(odd) { color: var(--text-3); }

  /* ---- overlays: command palette ---- */
  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 12vh; z-index: 50;
  }
  .palette {
    background: var(--bg-2); border: 1px solid var(--stroke-2);
    border-radius: var(--radius); width: min(560px, 92vw);
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    overflow: hidden;
  }
  .palette input {
    width: 100%; border: 0; border-radius: 0; border-bottom: 1px solid var(--stroke);
    background: var(--bg); padding: 12px 14px; font-size: 15px;
  }
  .palette input:focus { outline: none; border-bottom-color: var(--accent); }
  .palette ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow-y: auto; }
  .palette li {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer;
    color: var(--text-2); font-size: 13px;
  }
  .palette li .hint { margin-left: auto; color: var(--text-4); font-size: 11px; }
  .palette li.active { background: var(--accent-soft); color: var(--text); }
  .palette li .icon { color: var(--accent); flex: 0 0 auto; }
  .palette .empty { padding: 20px; }

  /* ---- record drawer ---- */
  .drawer {
    background: var(--bg-2); border: 1px solid var(--stroke-2);
    border-radius: var(--radius); width: min(720px, 94vw);
    max-height: 82vh; overflow-y: auto; padding: 18px 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .drawer h2 { margin-bottom: 2px; }
  .drawer .sub { margin-bottom: 12px; }
  .drawer .close { float: right; }
  .drawer .body { background: var(--bg); border: 1px solid var(--stroke);
    border-radius: var(--radius-sm); padding: 12px; margin: 12px 0; }
  .ver { border-left: 2px solid var(--stroke); padding: 2px 0 8px 12px; margin-bottom: 8px; }
  .ver .meta { color: var(--text-4); font-size: 12px; }
  .ver .diff-old { color: var(--bad); }
  .ver .diff-new { color: var(--ok); }
  .tag { display: inline-block; background: var(--bg-3); border-radius: 4px;
    padding: 0 6px; margin-right: 4px; font-size: 11px; color: var(--text-3); }

  /* ---- toasts ---- */
  #toasts {
    position: fixed; bottom: 18px; right: 18px; z-index: 60;
    display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
  }
  .toast {
    background: var(--bg-2); border: 1px solid var(--stroke-2);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-sm); padding: 10px 14px;
    font-size: 13px; color: var(--text); max-width: 340px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
    animation: toast-in .16s ease-out;
  }
  .toast.ok { border-left-color: var(--ok); }
  .toast.err { border-left-color: var(--bad); }
  .toast.leaving { opacity: 0; transform: translateY(4px); transition: all .18s; }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  .hint-bar {
    font-size: 11px; color: var(--text-4); margin-top: 10px;
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .hint-bar kbd {
    font-family: inherit; border: 1px solid var(--stroke);
    border-radius: 4px; padding: 0 4px; color: var(--text-3);
  }

  @media (max-width: 720px) {
    main { padding: 14px; }
    nav h1 span.word { display: none; }
    .kv { grid-template-columns: 1fr; gap: 0; }
    .kv span:nth-child(odd) { margin-top: 6px; }
  }
  /* Density is a data attribute: it changes several spacings at once. */
  :root[data-density="compact"] main { padding: 12px 16px; }
  :root[data-density="compact"] .card { padding: 8px 12px; margin-bottom: 6px; }
  :root[data-density="compact"] .sub { margin-bottom: 10px; }
/* ---- diff + edit ------------------------------------------------------ */
.diffbox {
  margin: 8px 0;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  font-size: 14px;
  line-height: 1.7;
}
.diffline { margin: 2px 0; }
.diffline .tag {
  display: inline-block;
  min-width: 58px;
  margin-right: 8px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted-foreground);
}
.diffbox :is(.del, .ins) {
  border-radius: 3px;
  padding: 1px 3px;
}
.diffbox .del {
  background: color-mix(in srgb, #e5484d 18%, transparent);
  color: #e5484d;
  text-decoration: line-through;
}
.diffbox .ins {
  background: color-mix(in srgb, #30a46c 18%, transparent);
  color: #30a46c;
}
.editbox {
  margin: 8px 0;
  padding: 10px 12px;
  border: 1px dashed var(--border);
  border-radius: 8px;
}
.editbox textarea {
  width: 100%;
  box-sizing: border-box;
  background: transparent;
  color: var(--foreground);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px;
  font: inherit;
  resize: vertical;
}
.editbox select {
  background: transparent;
  color: var(--foreground);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 6px;
  font: inherit;
}
.toastbtns { margin-top: 8px; }
</style>

</head>
<body>
<div id="app">
  <nav id="nav">
    <h1><span id="logo"></span><span class="word">Memory_OB</span></h1>
    <span class="spacer"></span>
    <button class="palette-btn" id="openPalette" title="Search and jump (Ctrl+K)">
      <span>Search</span><kbd>Ctrl K</kbd>
    </button>
  </nav>
  <main id="main"></main>
  <div id="confirmations"></div>
</div>
<div id="toasts"></div>
<div id="overlay"></div>
<script>
  /* The host injects the API base here when this page is served from a
     plugin backend. Standalone, it stays empty (same origin). */
  window.__MEMORY_OB_BASE__ = "";
  /* The write token. The backend injects it here, and every write echoes it
     back — the pages authenticate by shape, not by a hand-typed header. */
  window.__MEMORY_OB_TOKEN__ = "";
  /* Appearance: the backend injects the validated values here. */
  window.__MEMORY_OB_APPEARANCE__ = null;
</script>
<script>
'use strict';

const API = window.__MEMORY_OB_BASE__ || '';
const TOKEN = window.__MEMORY_OB_TOKEN__ || '';
const TOKEN_HEADER = 'X-Memory-OB-Token';

/* ---- icons ---------------------------------------------------------------
   Inline SVG, currentColor. No icon font, no external request. */
const ICONS = {
  brain: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3a3 3 0 0 0-3 3 3 3 0 0 0-2 3c0 .6.2 1.2.5 1.7A3 3 0 0 0 4 14a3 3 0 0 0 3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3z"/><path d="M15 3a3 3 0 0 1 3 3 3 3 0 0 1 2 3c0 .6-.2 1.2-.5 1.7A3 3 0 0 1 20 14a3 3 0 0 1-3 3 3 3 0 0 1-3 3 3 3 0 0 1-3-3"/></svg>',
  review: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  vault: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16"/></svg>',
  search: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  graph: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M8.5 7.5l7 8M15.5 6h-7M6 8.5v7"/></svg>',
  journal: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  notes: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  health: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
  settings: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  intake: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>',
  recall: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
};

const TABS = [
  ['review', 'Review', 'review'],
  ['inbox', 'Inbox', 'intake'],
  ['vault', 'Vault', 'vault'],
  ['search', 'Search', 'search'],
  ['graph', 'Graph', 'graph'],
  ['journal', 'Journal', 'journal'],
  ['notes', 'Notes', 'notes'],
  ['health', 'Health', 'health'],
  ['settings', 'Settings', 'settings'],
  ['intake', 'Intake', 'intake'],
  ['recall', 'Recall', 'recall'],
  ['conversations', 'Conversations', 'vault'],
  ['people', 'People', 'vault'],
  ['changes', 'Changes', 'activity'],
];

const state = {
  tab: 'review',
  data: {},
  loading: false,
  error: '',
  selectedCard: null,
};

/* ---- api --------------------------------------------------------------- */

async function api(path, opts) {
  const method = (opts && opts.method) || 'GET';
  /* The payload stays an OBJECT: the host bridge serializes it, so handing it
     a string here would double-encode and FastAPI would reject the body. */
  const payload = opts && opts.body ? opts.body : undefined;
  /* Writes echo the injected token; reads stay open. The actor header tells
     the log WHO clicked — the owner through these pages, the agent through
     its own tools. */
  const headers = Object.assign(
    { 'Content-Type': 'application/json', 'X-Memory-OB-Actor': 'owner' },
    method === 'GET' ? {} : { [TOKEN_HEADER]: TOKEN }
  );

  /* Inside the Hermes host shell a plain fetch carries no dashboard session
     token, so the app's authenticated bridge does the calling instead. The
     bridge is reached through the parent window because this document lives
     in a srcdoc iframe. Standalone (or a plain browser tab) falls through to
     fetch against the same origin. */
  const bridge = window.parent && window.parent.hermesDesktop && window.parent.hermesDesktop.api;
  if (typeof bridge === 'function') {
    try {
      return await bridge({ path: API + path, method, body: payload, headers });
    } catch (e) {
      throw new Error((e && e.message) || 'request failed');
    }
  }

  const res = await fetch(API + path, opts ? {
    method: method,
    headers,
    body: payload === undefined ? undefined : JSON.stringify(payload),
  } : undefined);
  if (!res.ok) {
    let msg = res.status + ' ' + res.statusText;
    try { msg = (await res.json()).detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}

/* ---- helpers ------------------------------------------------------------ */

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
  }[c]));
}

/* Minimal markdown. The input is escaped FIRST, so no character in the source
   text can become a tag — the regexes below only ever see entities. */
function md(s) {
  let h = esc(s);
  h = h.replace(/^###### (.*)$/gm, '<h4>$1</h4>')
       .replace(/^### (.*)$/gm, '<h4>$1</h4>')
       .replace(/^## (.*)$/gm, '<h3>$1</h3>')
       .replace(/^# (.*)$/gm, '<h2>$1</h2>')
       .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
       .replace(/\*(.+?)\*/g, '<i>$1</i>')
       .replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
  return `<div class="md">${h}</div>`;
}

function pill(text, cls) { return `<span class="pill ${cls || ''}">${esc(text)}</span>`; }

function trustLabel(r) {
  if (r.trust >= 0.8) return pill('confirmed', 'confirmed');
  if (r.trust >= 0.3) return pill('unverified', 'unverified');
  return pill('raw', '');
}

function empty(title, body) {
  return `<div class="empty"><b>${esc(title)}</b>${esc(body || '')}</div>`;
}

/* Dates the owner can read. The store keeps ISO stamps; showing them raw was
   one of the things that made the screens feel like a database dump. */
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d.getTime())) return String(s);
  return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

function fmtDay(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d.getTime())) return String(s);
  return d.toLocaleDateString(undefined, { dateStyle: 'medium' });
}

/* A 404 on a screen's own data usually means the app process is holding an
   older copy of the plugin than the page it just loaded: the page is read
   from disk every time, the routes are mounted once and never re-scanned.
   A window reload is not enough — the app itself has to come back up. */
function errText(e) {
  const msg = (e && e.message) || 'unknown error';
  if (/^404\b/.test(msg)) {
    return msg + ' — the app is running an older copy of Memory_OB. Quit Hermes completely and start it again.';
  }
  return msg;
}

/* ---- toasts -------------------------------------------------------------
   Every failure used to be an alert(), which blocks the page. Toasts report
   and get out of the way. */
function toast(message, kind, ms, buttons) {
  const box = document.getElementById('toasts');
  if (!box) { alert(message); return; }
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = message;
  // Some toasts carry an action — the Undo after a truth change. They stay
  // until the owner decides rather than vanishing on a timer.
  if (buttons && buttons.length) {
    const row = document.createElement('div');
    row.className = 'toastbtns';
    buttons.forEach((b) => {
      const btn = document.createElement('button');
      btn.className = 'act';
      btn.textContent = b.label;
      btn.onclick = () => {
        const keep = b.run && b.run();
        if (!keep) {
          el.classList.add('leaving');
          setTimeout(() => el.remove(), 200);
        }
      };
      row.appendChild(btn);
    });
    el.appendChild(row);
    box.appendChild(el);
    setTimeout(() => {
      if (!el.isConnected) return;
      el.classList.add('leaving');
      setTimeout(() => el.remove(), 200);
    }, ms || 8000);
    return;
  }
  box.appendChild(el);
  setTimeout(() => {
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 200);
  }, ms || 3200);
}

/* ---- theme --------------------------------------------------------------
   The host's --ui-* values win; the appearance settings from the backend are
   applied on top. Both are re-read every second so an Appearance change in
   Hermes follows through without a reload. */
const THEME_MAP = [
  ['--ui-bg-chrome', '--bg'],
  ['--ui-bg-sidebar', '--bg'],
  ['--ui-bg-secondary', '--bg-2'],
  ['--ui-bg-elevated', '--bg-3'],
  ['--ui-stroke-secondary', '--stroke'],
  ['--ui-stroke-tertiary', '--stroke-2'],
  ['--ui-text-primary', '--text'],
  ['--ui-text-secondary', '--text-2'],
  ['--ui-text-tertiary', '--text-3'],
  ['--ui-text-quaternary', '--text-4'],
  ['--ui-accent', '--accent'],
];

function applyTheme() {
  const root = document.documentElement;
  const host = window.parent;

  /* Host colours first, so an explicit appearance setting can override. */
  if (host && host !== window && host.document) {
    try {
      const cs = host.getComputedStyle(host.document.documentElement);
      for (const [from, to] of THEME_MAP) {
        const value = cs.getPropertyValue(from).trim();
        if (value) root.style.setProperty(to, value);
      }
      // --ui-bg-elevated is not defined by every host theme. When it is
      // missing, --bg-3 keeps its dark standalone fallback even in a light
      // theme, which makes the button rows unreadable. Derive it from the
      // nearest available surface colour instead.
      if (!root.style.getPropertyValue('--bg-3')) {
        const fb = cs.getPropertyValue('--ui-bg-secondary').trim()
                || cs.getPropertyValue('--ui-bg-chrome').trim();
        if (fb) root.style.setProperty('--bg-3', fb);
      }
    } catch (e) { /* cross-origin parent — keep our own theme */ }
  }

  /* Then the owner's appearance settings. */
  const a = window.__MEMORY_OB_APPEARANCE__;
  if (a) {
    if (a.css) {
      for (const [k, v] of Object.entries(a.css)) root.style.setProperty(k, v);
    }
    if (a.theme && a.theme !== 'auto') {
      root.setAttribute('data-theme', a.theme);
    } else {
      root.removeAttribute('data-theme');
    }
    if (a.density) root.setAttribute('data-density', a.density);
    if (a.font_size) root.style.setProperty('--font-size', Number(a.font_size) + 'px');
  }
  // Accent text colour: keep primary buttons readable on any accent the host
  // or the owner picks, instead of forcing #000.
  const accent = getComputedStyle(root).getPropertyValue('--accent').trim();
  if (accent) {
    const m = accent.match(/#([0-9a-f]{3,8})/i);
    if (m) {
      let hex = m[1];
      if (hex.length === 3) hex = hex.split('').map((c) => c + c).join('');
      const r = parseInt(hex.slice(0, 2), 16);
      const g = parseInt(hex.slice(2, 4), 16);
      const b = parseInt(hex.slice(4, 6), 16);
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      root.style.setProperty('--accent-text', lum > 0.55 ? '#000' : '#fff');
    }
  }
}

/* ---- routing ------------------------------------------------------------
   Hash routing: the tab is the URL, so back/forward work and a view can be
   linked. Kept in sync on every render. */
function route() {
  const hash = location.hash.replace(/^#\/?/, '');
  if (hash === 'home') return 'home';
  return TABS.some(t => t[0] === hash) ? hash : 'home';
}

function go(tab) {
  if (tab !== 'inbox') inboxShown = 200;
  if (location.hash === '#/' + tab) render();
  else location.hash = '#/' + tab;
}

window.addEventListener('hashchange', render);

/* ---- render ------------------------------------------------------------- */

async function renderConfirmations() {
  const box = document.getElementById('confirmations');
  if (!box) return;
  try {
    const data = await api('/api/confirmations?status=pending');
    const confs = data.confirmations || [];
    if (!confs.length) { box.innerHTML = ''; return; }
    box.innerHTML = confs.map(c => `
      <div class="card" style="border-left:3px solid var(--accent);margin-bottom:8px">
        <div class="row"><span class="pill ask">the AI asks</span>
          <span class="dim">${fmtDate(c.at)}</span></div>
        <div class="muted" style="margin:6px 0">${esc(c.question)}</div>
        ${c.context ? `<div class="dim" style="font-size:12px;margin-bottom:6px">${esc(c.context)}</div>` : ''}
        <div class="toolbar">
          <button class="act primary" data-conf-yes="${esc(c.id)}">yes, remember it</button>
          <button class="act" data-conf-no="${esc(c.id)}">no, skip</button>
        </div>
      </div>`).join('');
    box.querySelectorAll('[data-conf-yes]').forEach(b => {
      b.onclick = async () => {
        await api('/api/confirmations/' + encodeURIComponent(b.getAttribute('data-conf-yes')) + '/answer',
          { method: 'POST', body: JSON.stringify({ answer: 'yes' }) });
        toast('Noted — it will be remembered.', 'ok');
        renderConfirmations();
      };
    });
    box.querySelectorAll('[data-conf-no]').forEach(b => {
      b.onclick = async () => {
        await api('/api/confirmations/' + encodeURIComponent(b.getAttribute('data-conf-no')) + '/answer',
          { method: 'POST', body: JSON.stringify({ answer: 'no' }) });
        toast('Skipped.', 'ok');
        renderConfirmations();
      };
    });
  } catch (e) { /* the banner is optional — never break the page */ }
}

async function render() {
  if (typeof state.advanced === 'undefined') {
    try { state.advanced = localStorage.getItem('memory_ob_advanced') === '1'; }
    catch (e) { state.advanced = false; }
  }
  state.tab = route();
  if (location.hash !== '#/' + state.tab) history.replaceState(null, '', '#/' + state.tab);

  let autonomous = false;
  try { autonomous = !!(await api('/api/app-settings')).autonomous; } catch (e) {}
  state.autonomous = autonomous;

  const nav = document.getElementById('nav');
  nav.innerHTML = '<h1>' + ICONS.brain + '<span class="word">Memory_OB</span></h1><span class="spacer"></span>';
  if (!state.advanced) {
    const home = document.createElement('button');
    home.innerHTML = ICONS.review + '<span>For you</span>';
    home.className = state.tab === 'home' ? 'active' : '';
    home.onclick = () => go('home');
    nav.appendChild(home);
  } else {
    for (const [id, label, icon] of TABS) {
      const shown = (id === 'review' && autonomous) ? 'Doubts' : label;
      const b = document.createElement('button');
      b.innerHTML = ICONS[icon] + '<span>' + esc(shown) + '</span>';
      b.className = state.tab === id ? 'active' : '';
      if (id === 'review' && state.data.reviewCount) {
        const s = document.createElement('span');
        s.className = 'badge';
        s.textContent = state.data.reviewCount;
        b.appendChild(s);
      }
      b.onclick = () => go(id);
      nav.appendChild(b);
    }
  }
  const adv = document.createElement('button');
  adv.className = 'palette-btn';
  adv.id = 'advToggle';
  adv.innerHTML = (state.advanced ? 'Hide ' : '') + 'Advanced';
  adv.onclick = () => {
    state.advanced = !state.advanced;
    try { localStorage.setItem('memory_ob_advanced', state.advanced ? '1' : '0'); } catch (e) {}
    if (!state.advanced) go('home'); else render();
  };
  nav.appendChild(adv);
  const pal = document.createElement('button');
  pal.className = 'palette-btn';
  pal.id = 'openPalette';
  pal.innerHTML = ICONS.search + '<span>Search</span><kbd>Ctrl K</kbd>';
  pal.onclick = openPalette;
  nav.appendChild(pal);
  if (state.advanced) renderConfirmations();

  /* Capture the tab we are loading. A slow view (Settings reads the model
     config over the bridge) must never overwrite a tab the owner already
     clicked past — without this guard the earlier response lands last and
     the screen "sticks". */
  const tab = state.tab;
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty"><b>Loading…</b></div>';
  try {
    const fn = VIEWS[tab];
    const html = await fn(state.data);
    if (state.tab !== tab) return;
    main.innerHTML = html;
    state.selectedCard = null;
    await bindLate();
  } catch (e) {
    if (state.tab !== tab) return;
    main.innerHTML = `<div class="empty"><b>Something went wrong</b><div class="err">${esc(errText(e))}</div></div>`;
  }
}

/* ---- command palette ---------------------------------------------------- */

function allCommands() {
  const cmds = TABS.map(([id, label, icon]) => ({
    title: label, hint: 'go to', icon: ICONS[icon], run: () => go(id),
  }));
  try {
    for (const r of (state.data.vaultRecords || []).slice(0, 12)) {
      cmds.push({
        title: r.title || '(untitled)',
        hint: r.kind || 'record',
        icon: ICONS.vault,
        run: () => go('vault'),
      });
    }
  } catch (e) {}
  cmds.push({ title: 'Run the consistency sweep', hint: 'action', icon: ICONS.health, run: runSweep });
  cmds.push({ title: 'Run doctor', hint: 'action', icon: ICONS.health, run: () => go('health') });
  return cmds;
}

function openPalette() {
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = `
    <div class="scrim" role="dialog" aria-modal="true" aria-label="Search">
      <div class="palette">
        <input id="palInput" type="text" placeholder="Search tabs, records, actions…" autocomplete="off">
        <ul id="palList"></ul>
      </div>
    </div>`;
  const input = document.getElementById('palInput');
  const list = document.getElementById('palList');
  let items = [];
  let active = 0;
  const lastFocus = document.activeElement;

  function draw() {
    const q = input.value.trim().toLowerCase();
    items = allCommands().filter(c => c.title.toLowerCase().includes(q));
    active = 0;
    if (!items.length) {
      list.innerHTML = '<div class="empty">No matches.</div>';
      return;
    }
    list.innerHTML = items.map((c, i) => `
      <li class="${i === 0 ? 'active' : ''}" data-i="${i}" role="option" aria-selected="${i === 0}">
        <span class="icon">${c.icon}</span>
        <span>${esc(c.title)}</span>
        <span class="hint">${esc(c.hint)}</span>
      </li>`).join('');
    for (const li of list.querySelectorAll('li')) {
      li.onclick = () => choose(Number(li.dataset.i));
      li.onmousemove = () => { active = Number(li.dataset.i); mark(); };
    }
  }

  function mark() {
    for (const li of list.querySelectorAll('li')) {
      const on = Number(li.dataset.i) === active;
      li.classList.toggle('active', on);
      li.setAttribute('aria-selected', on ? 'true' : 'false');
    }
    const el = list.querySelector(`li[data-i="${active}"]`);
    if (el) el.scrollIntoView({ block: 'nearest' });
  }

  function choose(i) {
    const c = items[i];
    close();
    if (c) c.run();
  }

  function close() {
    overlay.innerHTML = '';
    document.removeEventListener('keydown', onKey, true);
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function onKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, items.length - 1); mark(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); mark(); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(active); }
  }

  input.addEventListener('input', draw);
  document.addEventListener('keydown', onKey, true);
  overlay.querySelector('.scrim').onclick = (e) => { if (e.target.classList.contains('scrim')) close(); };
  draw();
  input.focus();
}

/* ---- keyboard triage ----------------------------------------------------
   j/k move between cards, then a LETTER runs an action by NAME.
   Letters, not digits: a digit would mean "whatever button is first", which
   on a diff card is "take the new wording" — a single keypress silently
   rewriting confirmed truth. A letter means the action the label says. */
const KEYS = {
  a: ['approve', 'remember', 'confirm'],
  d: ['deny', 'dismiss'],
  x: ['dismiss'],
  l: ['later'],
  k: ['keep_both'],
  o: ['take_old'],
  m: ['merge'],
};

const KEY_HINTS = [
  ['a', 'remember / approve'], ['d', 'not true / deny'], ['l', 'later'],
];

let _cardKeyHandler = null;

function bindCardKeys() {
  const cards = Array.from(document.querySelectorAll('[data-card]'));
  // Each render used to add another listener without removing the old one, so
  // a single keypress eventually fired the action several times.
  if (_cardKeyHandler) {
    document.removeEventListener('keydown', _cardKeyHandler);
    _cardKeyHandler = null;
  }
  if (!cards.length) return;
  let idx = 0;
  const select = (i) => {
    idx = Math.max(0, Math.min(i, cards.length - 1));
    cards.forEach((c, n) => c.classList.toggle('selected', n === idx));
    cards[idx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    state.selectedCard = cards[idx].getAttribute('data-card');
  };
  select(0);
  _cardKeyHandler = (e) => {
    if (state.tab !== 'review' && state.tab !== 'inbox') return;
    const tag = (document.activeElement || {}).tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.key === 'j') { e.preventDefault(); select(idx + 1); }
    else if (e.key === 'k') { e.preventDefault(); select(idx - 1); }
    else if (KEYS[e.key]) {
      const card = cards[idx];
      if (!card) return;
      for (const act of KEYS[e.key]) {
        const btn = card.querySelector(`[data-act="${act}"]`);
        // Truth-changing actions go through the editor now, so a keypress
        // opens it rather than signing outright.
        if (btn) { e.preventDefault(); btn.click(); return; }
      }
    }
  };
  document.addEventListener('keydown', _cardKeyHandler);
}

/* ---- views -------------------------------------------------------------- */

async function viewReview() {
  const cards = await api('/api/cards?status=pending');
  let autonomous = false;
  try { autonomous = !!(await api('/api/app-settings')).autonomous; } catch (e) {}
  // In autonomous mode the AI handles the clear cases itself; this screen is
  // only for the doubts it flags (ask cards) — not a review queue.
  const visible = autonomous ? cards.filter(c => c.type === 'ask') : cards;
  state.cards = visible;
  state.data.reviewCount = visible.length;
  const title = autonomous ? 'Doubts' : 'Review';
  const sub = autonomous

    : 'The AI proposes; you sign.';
  if (!visible.length) {
    return `<h2>${title}</h2><div class="sub">${sub}</div>`
      + empty('Nothing waiting', autonomous ? 'The AI is handling memory on its own.' : 'New proposals will appear here.');
  }
  let html = `<h2>${title}</h2><div class="sub">${visible.length} item(s). ${sub}</div>`;
  for (const c of visible) {
    html += `<div class="card" data-card="${c.id}">

        ${pill(c.type, c.type)}
        <b>${esc(c.title)}</b>

      </div>`;
    if (c.body) html += `<div class="muted" style="margin:6px 0">${esc(c.body)}</div>`;
    if (c.type === 'diff' && c.old && c.new) {
      html += renderDiff(c);
    }
    if (c.speakers && c.speakers.length) {
      html += `<div class="dim" style="font-size:12px">speakers: ${c.speakers.map(esc).join(', ')}</div>`;
    }
    html += `<div class="toolbar" style="margin-top:10px">`;
    if (c.type === 'diff') {
      html += `<button class="act primary" data-act="approve">take new</button>
               <button class="act" data-act="keep_both">keep both</button>
               <button class="act" data-act="take_old">take old</button>`;
    } else if (c.type === 'proposal') {
      html += `<button class="act primary" data-act="approve">approve</button>
               <button class="act danger" data-act="deny">deny</button>`;
    } else if (c.type === 'ask') {
      html += `<button class="act primary" data-act="confirm">confirm</button>
               <button class="act" data-act="dismiss">dismiss</button>`;
    } else if (c.type === 'merge') {
      html += `<button class="act primary" data-act="merge">merge</button>
               <button class="act" data-act="dismiss">dismiss</button>`;
    }
    html += `<button class="act" data-act="later">later</button></div></div>`;
  }
  html += `<div class="hint-bar">
      <span><kbd>j</kbd>/<kbd>k</kbd> move</span>
      <span><kbd>a</kbd> approve</span>
      <span><kbd>d</kbd> deny</span>
      <span><kbd>l</kbd> later</span>
    </div>`;
  setTimeout(bindCardButtons, 0);
  setTimeout(bindCardKeys, 0);
  return html;
}

/* A word-level diff. Raw JSON told the owner nothing about what would
   actually change; this shows the removed words and the added ones. */
function wordDiff(before, after) {
  const a = String(before || '').split(/\s+/).filter(Boolean);
  const b = String(after || '').split(/\s+/).filter(Boolean);
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1
                                 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const out = [];
  let i = 0, j = 0;
  const flush = (kind, items) => {
    if (!items.length) return;
    out.push(`<span class="${kind}">${esc(items.join(' '))}</span>`);
  };
  while (i < n && j < m) {
    if (a[i] === b[j]) { flush('same', [a[i]]); i++; j++; }
    else {
      const del = [], ins = [];
      while (i < n && j < m && a[i] !== b[j]) {
        if (dp[i + 1][j] >= dp[i][j + 1]) { del.push(a[i]); i++; }
        else { ins.push(b[j]); j++; }
      }
      flush('del', del); flush('ins', ins);
    }
  }
  flush('del', a.slice(i)); flush('ins', b.slice(j));
  return out.join(' ');
}

/* The field a diff card actually changes. */
function diffField(card) {
  if (!card.old || !card.new) return 'value';
  const keys = Object.keys(card.new);
  const pick = ['title', 'body', 'text', 'value', 'statement', 'fact', 'summary'].find(
    (k) => k in card.new && k in card.old && card.new[k] !== card.old[k]
  );
  return pick || keys[0] || 'value';
}

/* Actions that overwrite or create confirmed truth. They get a second click:
   one keypress must never rewrite what the owner already signed. */
const TRUTH_CHANGES = new Set(['approve', 'take_new', 'keep_both', 'remember']);

function renderDiff(card) {
  if (card.type !== 'diff' || !card.old || !card.new) return '';
  const f = diffField(card);
  const before = card.old[f] ?? JSON.stringify(card.old);
  const after = card.new[f] ?? JSON.stringify(card.new);
  return `<div class="diffbox">
    <div class="diffline"><span class="tag del">was</span> ${wordDiff(before, after).replace(/<span class="ins">.*?<\/span>/g, '')}</div>
    <div class="diffline"><span class="tag ins">becomes</span> ${wordDiff(before, after).replace(/<span class="del">.*?<\/span>/g, '')}</div>
    <div class="dim" style="font-size:12px;margin-top:6px">field: ${esc(f)}</div>
  </div>`;
}

/* Inline editor: the owner fixes the wording and the kind before signing. */
function editPanel(card, action) {
  const f = card.type === 'diff' ? diffField(card) : 'title';
  const current = card.type === 'diff'
    ? (card.new?.[f] ?? card.new?.title ?? card.new?.body ?? card.title)
    : (card.new?.title ?? card.new?.body ?? card.title ?? card.body);
  const kind = card.new?.kind || 'note';
  return `<div class="editbox">
    <textarea id="editText" rows="3">${esc(current)}</textarea>
    <div class="toolbar" style="margin-top:6px">
      <label class="dim">kind
        <select id="editKind">
          ${['profile', 'journal', 'story', 'capsule', 'learning', 'note'].map(
            (k) => `<option value="${k}"${k === kind ? ' selected' : ''}>${k}</option>`
          ).join('')}
        </select>
      </label>
    </div>
    <div class="toolbar" style="margin-top:8px">
      <button class="act primary" data-edit-save="${action}" data-field="${esc(f)}">sign this</button>
      <button class="act" data-edit-cancel>cancel</button>
    </div>
  </div>`;
}

function bindCardButtons() {
  document.querySelectorAll('[data-card]').forEach(cardEl => {
    const id = cardEl.getAttribute('data-card');
    const card = (state.cards || []).find((c) => c.id === id);
    cardEl.querySelectorAll('button.act').forEach(btn => {
      btn.onclick = async () => {
        const act = btn.getAttribute('data-act');
        if (!act) return;
        // Truth-changing actions go through the editor: the owner reads the
        // wording, fixes it if needed, picks the kind, and only then signs.
        // One click, or one keypress, never rewrites a confirmed memory.
        if (TRUTH_CHANGES.has(act) && card) {
          const existing = cardEl.querySelector('.editbox');
          if (existing) { existing.remove(); return; }
          const box = document.createElement('div');
          box.innerHTML = editPanel(card, act);
          const panel = box.firstChild;
          cardEl.appendChild(panel);
          const save = panel.querySelector('[data-edit-save]');
          const cancel = panel.querySelector('[data-edit-cancel]');
          if (cancel) cancel.onclick = () => panel.remove();
          if (save) save.onclick = async () => {
            save.disabled = true;
            try {
              await api(`/api/cards/${id}/${act}`, {
                method: 'POST',
                body: JSON.stringify({
                  edit: {
                    field: save.getAttribute('data-field') || 'title',
                    text: panel.querySelector('#editText').value,
                    kind: panel.querySelector('#editKind').value,
                  },
                }),
              });
              toast('Signed. Press Undo if that was wrong.', 'ok', 8000, [
                { label: 'Undo', run: async () => {
                    await api(`/api/cards/${id}/undo`, { method: 'POST' });
                    toast('Restored the previous version.', 'ok', 3200);
                    render();
                } },
              ]);
              render();
            } catch (e) {
              toast(e.message, 'err');
              save.disabled = false;
            }
          };
          return;
        }
        btn.disabled = true;
        try {
          await api(`/api/cards/${id}/${act}`, { method: 'POST' });
          toast('Done.', 'ok', 1800);
          render();
        } catch (e) {
          toast(e.message, 'err');
          btn.disabled = false;
        }
      };
    });
  });
}

async function viewInbox() {
  const data = await api(`/api/candidates?limit=${inboxShown}`);
  const cands = data.candidates || [];
  const total = data.total ?? cands.length;
  if (!cands.length && !total) {
    return '<h2>Inbox</h2><div class="sub">Everything the assistant captured, waiting for you.</div>'
      + empty('Nothing waiting', 'Capture something and it lands here. Nothing becomes true until you say so.');
  }
  // The list is a page; the total is the truth. Saying one as the other is
  // what made a thousand captured things look like two hundred.
  const shown = cands.length;
  const hidden = Math.max(0, total - (data.offset || 0) - shown);
  const origins = [...new Set(cands.map(c => (c.source && c.source.origin) || 'capture'))];
  let html = `<h2>Inbox</h2><div class="sub">${total} captured thing(s) waiting. `
    + (hidden > 0
        ? `Showing ${shown} of them — <b>${hidden} more</b> are further down the list. `
        : `Showing all of them. `)
    + `None of it is true yet — you decide.</div>`;
  if (total > 0) {
    html += `<div class="toolbar" style="margin-bottom:12px">`;
    for (const o of origins) {
      html += `<button class="act danger" data-dismiss-origin="${esc(o)}">Dismiss all from ${esc(o)}</button>`;
    }
    html += `<button class="act danger" data-dismiss-all>Dismiss everything</button>`;
    html += `<span class="spacer"></span>`;
    html += `<button class="act" data-bulk-select-all>select all</button>`;
    html += `<button class="act danger" data-bulk-dismiss disabled>not true (0)</button>`;
    html += `<button class="act primary" data-bulk-remember disabled>remember (0)</button>`;
    html += `</div>`;
  }
  for (const c of cands) {
    const origin = (c.source && c.source.origin) || 'capture';
    html += `<div class="card" data-card="${c.id}">
      <div class="row" style="align-items:flex-start">
        <input type="checkbox" data-bulk-check="${c.id}" style="margin-top:3px">
        <div class="muted">${esc(c.text)}</div>
      </div>
      <div class="dim" style="font-size:12px;margin:4px 0 8px">
        score ${Number(c.trust).toFixed(2)} · ${esc(origin)}${c.corroborated ? ` · repeated ×${c.corroborated}` : ''}
      </div>
      ${(() => { try { const m = typeof c.meta === 'string' ? JSON.parse(c.meta || '{}') : (c.meta || {});
          const bits = [];
          if (m.context) bits.push('context: ' + m.context);
          if (m.sentiment) bits.push('tone: ' + m.sentiment);
          if (m.people && m.people.length) bits.push('people: ' + m.people.join(', '));
          return bits.length ? `<div class="dim" style="font-size:11px;margin:2px 0 6px">${bits.map(esc).join(' · ')}</div>` : '';
        } catch (e) { return ''; } })()}
      <div class="toolbar">
        <button class="act primary" data-act="remember">remember</button>
        <button class="act danger" data-act="dismiss">not true</button>
        <button class="act" data-act="later">later</button>
      </div>
    </div>`;
  }
  if (hidden > 0) {
    html += `<div class="toolbar" style="justify-content:center;margin-top:12px">
      <button class="act" data-inbox-more>show more (${hidden} left)</button>
    </div>`;
  }
  html += `<div class="hint-bar">
      <span><kbd>j</kbd>/<kbd>k</kbd> move</span>
      <span><kbd>a</kbd> remember</span>
      <span><kbd>d</kbd> not true</span>
      <span><kbd>l</kbd> later</span>
    </div>`;
  setTimeout(bindInboxButtons, 0);
  setTimeout(bindCardKeys, 0);
  setTimeout(bindInboxMore, 0);
  return html;
}

/* "Show more" grows the page in place rather than making the owner lose
   their place on a second screen. */
let inboxShown = 200;
function bindInboxMore() {
  const btn = document.querySelector('[data-inbox-more]');
  if (!btn) return;
  btn.onclick = async () => {
    btn.disabled = true;
    const savedScroll = window.scrollY;
    inboxShown += 200;
    await go('inbox');
    window.scrollTo(0, savedScroll);
  };
}

/* Reset the page size whenever the owner leaves the Inbox, so a later visit
   does not silently start from wherever the last one stopped. */

function bindInboxButtons() {
  document.querySelectorAll('[data-card]').forEach(cardEl => {
    const id = cardEl.getAttribute('data-card');
    const act = async (action) => {
      try {
        if (action === 'remember') {
          await api(`/api/candidates/${id}/remember`, { method: 'POST' });
          toast('Remembered. It is true now.', 'ok');
        } else if (action === 'dismiss') {
          await api(`/api/candidates/${id}/dismiss`, { method: 'POST' });
          toast('Noted as not true.', 'ok');
        } else {
          return;
        }
        render();
      } catch (e) { toast(e.message, 'err'); }
    };
    for (const btn of cardEl.querySelectorAll('button.act')) {
      btn.onclick = () => { btn.disabled = true; act(btn.getAttribute('data-act')); };
    }
  });
  document.querySelectorAll('[data-dismiss-origin]').forEach(btn => {
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        const r = await api(`/api/candidates/dismiss-all?origin=${encodeURIComponent(btn.getAttribute('data-dismiss-origin'))}`, { method: 'POST' });
        toast(`Dismissed ${r.dismissed} candidate(s).`, 'ok');
        render();
      } catch (e) { toast(e.message, 'err'); btn.disabled = false; }
    };
  });
  const all = document.querySelector('[data-dismiss-all]');
  if (all) all.onclick = async () => {
    all.disabled = true;
    try {
      const r = await api('/api/candidates/dismiss-all', { method: 'POST' });
      toast(`Dismissed ${r.dismissed} candidate(s).`, 'ok');
      render();
    } catch (e) { toast(e.message, 'err'); all.disabled = false; }
  };
  const updateBulk = () => {
    const n = document.querySelectorAll('[data-bulk-check]:checked').length;
    const d = document.querySelector('[data-bulk-dismiss]');
    const r = document.querySelector('[data-bulk-remember]');
    if (d) { d.disabled = n === 0; d.textContent = `not true (${n})`; }
    if (r) { r.disabled = n === 0; r.textContent = `remember (${n})`; }
  };
  document.querySelectorAll('[data-bulk-check]').forEach(cb => {
    cb.onchange = updateBulk;
  });
  const selAll = document.querySelector('[data-bulk-select-all]');
  if (selAll) selAll.onclick = () => {
    const cbs = document.querySelectorAll('[data-bulk-check]');
    const anyUnchecked = [...cbs].some(c => !c.checked);
    cbs.forEach(c => { c.checked = anyUnchecked; });
    updateBulk();
  };
  const runBulk = async (action) => {
    const ids = [...document.querySelectorAll('[data-bulk-check]:checked')].map(c => c.getAttribute('data-bulk-check'));
    if (!ids.length) return;
    try {
      const r = await api('/api/candidates/bulk', { method: 'POST', body: JSON.stringify({ ids, action }) });
      toast(`${r.done} resolved${r.errors && r.errors.length ? ` — ${r.errors.length} error(s)` : ''}.`, 'ok');
      render();
    } catch (e) { toast(e.message, 'err'); }
  };
  const bd = document.querySelector('[data-bulk-dismiss]');
  if (bd) bd.onclick = () => runBulk('dismiss');
  const br = document.querySelector('[data-bulk-remember]');
  if (br) br.onclick = () => runBulk('remember');
}

async function openRecord(id) {
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = `
    <div class="scrim" id="drawerScrim" role="dialog" aria-modal="true" aria-label="Record">
      <div class="drawer"><div class="loading">Loading…</div></div>
    </div>`;
  const lastFocus = document.activeElement;

  function close() {
    overlay.innerHTML = '';
    document.removeEventListener('keydown', onKey, true);
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); close(); } }
  document.addEventListener('keydown', onKey, true);
  overlay.querySelector('.scrim').onclick = (e) => { if (e.target.id === 'drawerScrim') close(); };

  try {
    const [rec, hist] = await Promise.all([
      api('/api/records/' + encodeURIComponent(id)),
      api('/api/records/' + encodeURIComponent(id) + '/history'),
    ]);
    const tags = (rec.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
    const versions = (hist.versions || []).map(v => {
      const body = v.data && v.data.body;
      const before = (body === undefined || body === rec.body)
        ? ''
        : `<div class="diff-old">was: ${esc(String(body))}</div>`;
      return `<div class="ver">
        <div class="meta">v${v.version} · ${fmtDate(v.changed_at)} · ${esc(v.changed_by || '—')} ${esc(v.reason || '')}</div>
        ${before}
      </div>`;
    }).join('');
    overlay.querySelector('.drawer').innerHTML = `
      <button class="act close" id="drawerClose">close</button>
      <h2>${esc(rec.title || '(untitled)')}</h2>
      <div class="sub">${pill(rec.kind, '')} ${trustLabel(rec)} ${rec.never_send ? pill('neverSend', 'ask') : ''} ${esc(rec.id)}</div>
      <div class="kv">
        <span>status</span><span>${esc(rec.status)}</span>
        <span>confidence</span><span>${Number(rec.trust).toFixed(2)}</span>
        <span>who said it</span><span>${esc(rec.speaker)}</span>
        <span>captured</span><span>${fmtDate(rec.created)}</span>
        <span>last changed</span><span>${fmtDate(rec.modified)}</span>
        ${tags ? `<span>tags</span><span>${tags}</span>` : ''}
      </div>
      ${rec.body ? `<div class="body">${md(rec.body)}</div>` : ''}
      <h3>History</h3>
      ${versions || '<div class="dim">One version.</div>'}
    `;
    overlay.querySelector('#drawerClose').onclick = close;
  } catch (e) {
    overlay.querySelector('.drawer').innerHTML = `<div class="err">${esc(errText(e))}</div>`;
  }
}

async function viewGraph() {
  const data = await api('/api/graph');
  const nodes = data.nodes || [];
  const edges = data.edges || [];
  const f = state.graphFilter || (state.graphFilter = { subject: '', tag: '', kind: '', trust: '' });
  const t = parseFloat(f.trust);
  const visible = nodes.filter(n =>
    (!f.subject || (n.subject || '').includes(f.subject)) &&
    (!f.tag || (n.tags || []).some(x => x.includes(f.tag))) &&
    (!f.kind || n.kind === f.kind) &&
    (isNaN(t) || n.trust >= t));
  const ids = new Set(visible.map(n => n.id));
  const shownEdges = edges.filter(e => ids.has(e.src) && ids.has(e.dst));

  const kinds = [...new Set(nodes.map(n => n.kind))].sort();
  const sel = (id, val, opts) => `<select id="${id}"><option value="">all</option>` +
    opts.map(o => `<option value="${esc(o)}" ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('') + '</select>';

  if (!nodes.length) {
    return `<h2>Graph</h2><div class="sub">No connections yet.</div>`
      + empty('Nothing to draw', 'Records with links, supersedes, contradicts or supports will appear here.')
      + `<div class="card">${linkForm()}</div>`;
  }

  const cx = 450, cy = 210, R = 150;
  const pos = visible.map((n, i) => {
    const a = (2 * Math.PI * i) / visible.length;
    return { id: n.id, x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) };
  });
  const byId = Object.fromEntries(pos.map(p => [p.id, p]));
  const title = Object.fromEntries(nodes.map(n => [n.id, n.title || n.id]));
  const edgeColor = l => l === 'contradicts' ? 'var(--bad)'
    : l === 'supports' ? 'var(--ok)'
    : l === 'supersedes' ? 'var(--warn)'
    : l === 'shares_tag' ? 'var(--text-4)' : 'var(--info)';
  let svg = `<svg class="graph" viewBox="0 0 900 420">`;
  for (const e of shownEdges) {
    const a = byId[e.src], b = byId[e.dst];
    if (!a || !b) continue;
    const color = edgeColor(e.label);
    const dash = e.label === 'shares_tag' ? ' stroke-dasharray="3 3"' : '';
    svg += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="1.5" opacity="0.75"${dash}/>`;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    svg += `<text x="${mx}" y="${my}" fill="${color}" font-size="10" text-anchor="middle">${esc(e.label)}</text>`;
  }
  for (const p of pos) {
    svg += `<circle cx="${p.x}" cy="${p.y}" r="14" fill="var(--bg-3)" stroke="var(--accent)"/>`;
    svg += `<text x="${p.x}" y="${p.y + 26}" fill="var(--text-3)" font-size="9" text-anchor="middle">${esc((title[p.id] || p.id).slice(0, 14))}</text>`;
  }
  svg += `</svg>`;

  return `<h2>Graph</h2><div class="sub">${visible.length} of ${nodes.length} nodes · ${shownEdges.length} of ${edges.length} edges. Dashed grey is the machine's shared-tag layer; solid colours are curated links.</div>
    <div class="card"><div class="toolbar">
      <input id="gfSubject" placeholder="person" value="${esc(f.subject)}">
      ${sel('gfKind', f.kind, kinds)}
      <input id="gfTag" placeholder="tag" value="${esc(f.tag)}">
      <input id="gfTrust" placeholder="min trust" value="${esc(f.trust)}" style="width:80px">
      <button class="act" id="gfApply">Filter</button>
      <button class="act" id="gfRebuild" title="Rebuild the shared-tag layer">Rebuild shared edges</button>
    </div></div>
    ${svg}
    <div class="card" style="margin-top:10px">${linkForm()}
      <div id="linkOut"></div>
    </div>`;
}

async function viewChanges() {
  const data = await api('/api/changes?limit=100');
  const changes = data.changes || [];
  if (!changes.length) {
    return '<h2>Changes</h2><div class="sub">Every edit the engine makes, with the before and after.</div>'
      + empty('No changes yet', 'When the AI adds or edits memory, the diff lands here.');
  }
  let html = `<h2>Changes</h2><div class="sub">${changes.length} change(s). Before → after, so you can see exactly what moved.</div>`;
  for (const ch of changes) {
    html += `<div class="card">
      <div class="row"><span class="pill">${esc(ch.entity)}</span><b>${esc(ch.action)}</b>
        <span class="dim">${esc(ch.actor || '')} · ${fmtDate(ch.at)}</span></div>
      <div style="margin-top:6px">${renderChangeDiff(ch)}</div>
    </div>`;
  }
  return html;
}

function renderChangeDiff(ch) {
  const before = ch.before || {};
  const after = ch.after || {};
  const keys = [...new Set([...Object.keys(before), ...Object.keys(after)])];
  const rows = [];
  for (const k of keys) {
    const b = JSON.stringify(before[k] ?? '');
    const a = JSON.stringify(after[k] ?? '');
    if (b === a) continue;
    rows.push(`<div class="kv"><span>${esc(k)}</span>
      <span class="dim">${esc(b || '(none)')}</span>→
      <span class="ok">${esc(a || '(none)')}</span></div>`);
  }
  return rows.length ? rows.join('') : `<div class="dim">${esc(ch.reason || 'no field changes')}</div>`;
}

  try { insight = (await api('/api/insights')).insight || ''; } catch (e) {}
  const list = changes.changes || [];

      <div class="row"><span class="pill ask">the AI asks</span>
        <span class="dim">${pending.length} doubt(s)</span></div>

    html += empty('Nothing yet', 'When the AI remembers something, it appears here with a before → after diff.');

      const title = (ch.after && ch.after.title) || (ch.before && ch.before.title) || ch.entity;
      html += `<div class="card">
        <div class="row"><span class="pill">${esc(ch.entity)}</span><b>${esc(ch.action)}</b>
          <span class="dim">${esc(ch.actor || '')} · ${fmtDate(ch.at)}</span></div>

  if (people.people && people.people.length) {
    html += `<div class="card" style="margin-top:12px">
      <div class="row"><b>People</b><span class="dim">${people.people.length} profile(s)</span></div>
      <div class="dim" style="font-size:12px;margin-top:4px">${people.people.map(p => esc(p.name)).join(' · ')}</div>
    </div>`;
  }
  // Bind the inline confirmation buttons.
  setTimeout(() => {
    document.querySelectorAll('[data-conf-yes]').forEach(b => {
      b.onclick = async () => {
        await api('/api/confirmations/' + encodeURIComponent(b.getAttribute('data-conf-yes')) + '/answer',
          { method: 'POST', body: JSON.stringify({ answer: 'yes' }) });
        toast('Noted.', 'ok'); render();

    document.querySelectorAll('[data-conf-no]').forEach(b => {
      b.onclick = async () => {

          { method: 'POST', body: JSON.stringify({ answer: 'no' }) });
        toast('Skipped.', 'ok'); render();
      };
    });
  }, 0);
  return html;
}

/* ---- late bindings ------------------------------------------------------
   Views render buttons after innerHTML, so anything that needs a node is
   wired here rather than with inline handlers. */
async function bindLate() {
  if (state.tab === 'health') {
    const b = document.getElementById('runSweep');
    if (b) b.onclick = async () => {
      b.disabled = true;
      try {
        const r = await api('/api/sweep', { method: 'POST' });
        document.getElementById('sweepOut').innerHTML =
          `<div class="card"><pre>${esc(JSON.stringify(r, null, 2))}</pre></div>`;
        toast('Sweep complete.', 'ok', 2000);
      } catch (e) { toast(e.message, 'err'); }
      b.disabled = false;
    };
  }
  if (state.tab === 'graph') {
    const apply = document.getElementById('gfApply');
    if (apply) apply.onclick = () => {
      const f = state.graphFilter || (state.graphFilter = {});
      for (const [id, key] of [['gfSubject', 'subject'], ['gfKind', 'kind'], ['gfTag', 'tag'], ['gfTrust', 'trust']]) {
        const el = document.getElementById(id);
        if (el) f[key] = el.value.trim();
      }
      render();
    };
    const rebuild = document.getElementById('gfRebuild');
    if (rebuild) rebuild.onclick = async () => {
      rebuild.disabled = true;
      try {
        const r = await api('/api/graph/rebuild', { method: 'POST', body: {} });
        rebuild.textContent = `${r.rebuilt} shared edge(s)`;
      } catch (e) { toast(e.message, 'err'); }
      setTimeout(() => { rebuild.textContent = 'Rebuild shared edges'; rebuild.disabled = false; }, 1500);
    };
    const link = document.getElementById('doLink');
    if (link) link.onclick = async () => {
      const src = document.getElementById('linkSrc').value.trim();
      const dst = document.getElementById('linkDst').value.trim();
      const label = document.getElementById('linkLabel').value;
      const out = document.getElementById('linkOut');
      try {
        await api('/api/graph/link', { method: 'POST', body: { src, dst, label } });
        out.innerHTML = '<span class="ok">Linked.</span>';
        render();
      } catch (e) { out.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
  }
  if (state.tab === 'conversations') {
    document.querySelectorAll('[data-conv-open]').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.getAttribute('data-conv-open');
        try {
          const c = await api('/api/conversations/' + encodeURIComponent(id));
          const overlay = document.getElementById('overlay');
          overlay.innerHTML = `
            <div class="scrim" id="convScrim" role="dialog" aria-modal="true" aria-label="Conversation">
              <div class="drawer">
                <h3 style="margin-top:0">${esc(c.origin || 'capture')} · ${esc(c.speaker || 'user')}</h3>
                <div class="dim" style="margin-bottom:8px">${fmtDate(c.created)}</div>
                <pre style="white-space:pre-wrap;font-family:inherit">${esc(c.text)}</pre>
                <div class="toolbar"><button class="act" id="convClose">close</button></div>
              </div>
            </div>`;
          const close = () => { overlay.innerHTML = ''; };
          overlay.querySelector('#convScrim').onclick = (e) => { if (e.target.id === 'convScrim') close(); };
          document.getElementById('convClose').onclick = close;
          document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
        } catch (e) { toast(e.message, 'err'); }
      };
    });
  }
  if (state.tab === 'settings') {
    const save = document.getElementById('saveModels');
    if (save) save.onclick = async () => {
      const out = { main: { provider: 'auto', model: '', base_url: '' }, auxiliary: {} };
      document.querySelectorAll('[data-slot]').forEach(inp => {
        const slot = inp.getAttribute('data-slot');
        const k = inp.getAttribute('data-k');
        out.auxiliary[slot] = out.auxiliary[slot] || {};
        out.auxiliary[slot][k] = inp.value;
      });
      try {
        await api('/api/settings', { method: 'POST', body: out });
        document.getElementById('modelMsg').innerHTML = '<span class="ok">Saved.</span>';
      } catch (e) { document.getElementById('modelMsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
    const appBtn = document.getElementById('saveAppearance');
    if (appBtn) appBtn.onclick = async () => {
      const out = {
        theme: document.getElementById('appTheme').value,
        accent: document.getElementById('appAccent').value,
        font_size: Number(document.getElementById('appFontSize').value),
        density: document.getElementById('appDensity').value,
      };
      const msg = document.getElementById('appearanceMsg');
      try {
        const saved = await api('/api/appearance', { method: 'POST', body: out });
        window.__MEMORY_OB_APPEARANCE__ = saved;
        applyTheme();
        msg.innerHTML = '<span class="ok">Applied.</span>';
      } catch (e) { msg.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };

    /* --- memory proxy --- */
    const drawProxy = (st) => {
      const stateEl = document.getElementById('proxyState');
      if (!stateEl) return;
      stateEl.textContent = st.running ? 'running' : 'stopped';
      stateEl.className = st.running ? 'ok' : 'accent';
      document.getElementById('proxyUrl').textContent = st.url;
      const ask = document.getElementById('proxyAsk');
      const rem = document.getElementById('proxyRemember');
      if (ask) ask.checked = !!st.ask_at_startup;
      if (rem) rem.checked = !!st.remember;
      const msg = document.getElementById('proxyMsg');
      if (msg) msg.innerHTML = st.running
        ? '<span class="ok">The memory judge is awake.</span>'
        : '<span class="err">The judge is asleep — everything will be captured unfiltered.</span>';
    };
    const proxyGet = async () => {
      try { drawProxy(await api('/api/proxy')); }
      catch (e) { const m = document.getElementById('proxyMsg'); if (m) m.innerHTML = `<span class="err">${esc(errText(e))}</span>`; }
    };
    document.getElementById('proxyStart')?.addEventListener('click', async () => {
      try { drawProxy(await api('/api/proxy/start', { method: 'POST' })); }
      catch (e) { toast(e.message, 'err'); }
    });
    document.getElementById('proxyStop')?.addEventListener('click', async () => {
      try { drawProxy(await api('/api/proxy/stop', { method: 'POST' })); }
      catch (e) { toast(e.message, 'err'); }
    });
    document.getElementById('proxyAsk')?.addEventListener('change', async (e) => {
      try {
        drawProxy(await api('/api/proxy/pref', {
          method: 'POST',
          body: { ask_at_startup: e.target.checked,
                  remember: (document.getElementById('proxyRemember') || {}).checked },
        }));
      } catch (err) { toast(err.message, 'err'); }
    });
    document.getElementById('proxyRemember')?.addEventListener('change', async (e) => {
      try {
        drawProxy(await api('/api/proxy/pref', {
          method: 'POST',
          body: { remember: e.target.checked,
                  ask_at_startup: (document.getElementById('proxyAsk') || {}).checked },
        }));
      } catch (err) { toast(err.message, 'err'); }
    });
    proxyGet();
    const exp = document.getElementById('doExport');
    if (exp) exp.onclick = async () => {
      try { await api('/api/export', { method: 'POST' }); document.getElementById('vaultMsg').innerHTML = '<span class="ok">Vault exported.</span>'; }
      catch (e) { document.getElementById('vaultMsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
    const emb = document.getElementById('doEmbed');
    if (emb) emb.onclick = async () => {
      try { const r = await api('/api/embed', { method: 'POST', body: {} }); document.getElementById('vaultMsg').innerHTML = `<span class="ok">${r.computed} computed, ${r.cached} cached.</span>`; }
      catch (e) { document.getElementById('vaultMsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
    const backup = document.getElementById('doBackup');
    if (backup) backup.onclick = async () => {
      try { const r = await api('/api/backup', { method: 'POST', body: {} }); document.getElementById('vaultMsg').innerHTML = `<span class="ok">Backed up: ${esc(r.backup)}</span>`; }
      catch (e) { document.getElementById('vaultMsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
    const flip = async (key) => {
      try {
        const cur = await api('/api/app-settings');
        await api('/api/app-settings', { method: 'POST', body: { [key]: !(cur[key]) } });
        document.getElementById('appSettingsMsg').innerHTML = '<span class="ok">Saved.</span>';
        render();
      } catch (e) { document.getElementById('appSettingsMsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
    for (const [id, key] of [['toggleSemantic', 'semantic'], ['toggleCheckpoint', 'checkpoint_required'], ['toggleDemo', 'demo_visible'], ['toggleLocalOnly', 'local_only'], ['toggleAutonomous', 'autonomous']]) {
      const b = document.getElementById(id);
      if (b) b.onclick = () => flip(key);
    }
    document.querySelectorAll('[data-clear-ns]').forEach(b => {
      b.onclick = async () => {
        try {
          await api('/api/neversend/' + encodeURIComponent(b.getAttribute('data-clear-ns')), { method: 'POST' });
          render();
        } catch (e) { toast(e.message, 'err'); }
      };
    });
  }
  if (state.tab === 'intake') {
    const up = document.getElementById('doIntake');
    if (up) up.onclick = async () => {
      const file = document.getElementById('intakeFile').files[0];
      const out = document.getElementById('intakeOut');
      if (!file) { out.innerHTML = '<span class="err">Choose a file first.</span>'; return; }
      const data = await file.arrayBuffer();
      const b64 = btoa(String.fromCharCode(...new Uint8Array(data)));
      try {
        const r = await api('/api/intake/data', { method: 'POST', body: { name: file.name, data_b64: b64 } });
        out.innerHTML = `<span class="ok">${r.bytes} bytes copied — sha256 ${esc(r.sha256.slice(0, 16))}…</span>`;
      } catch (e) { out.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
    const cap = document.getElementById('doCapture');
    if (cap) cap.onclick = async () => {
      const text = document.getElementById('capText').value.trim();
      if (!text) return;
      cap.disabled = true;
      try {
        const r = await api('/api/capture', { method: 'POST', body: { text } });
        document.getElementById('capOut').innerHTML =
          `<div class="card"><b>${r.candidates} candidate(s)</b><pre>${esc(JSON.stringify(r.facts, null, 2))}</pre></div>`;
      } catch (e) { toast(e.message, 'err'); }
      cap.disabled = false;
    };
    const dream = document.getElementById('doDream');
    if (dream) dream.onclick = async () => {
      dream.disabled = true;
      try { const r = await api('/api/dream', { method: 'POST' }); document.getElementById('capOut').innerHTML = `<div class="card"><pre>${esc(JSON.stringify(r, null, 2))}</pre></div>`; }
      catch (e) { toast(e.message, 'err'); }
      dream.disabled = false;
    };
    const ch = document.getElementById('doChapter');
    if (ch) ch.onclick = async () => {
      ch.disabled = true;
      try { const r = await api('/api/chapter', { method: 'POST', body: {} }); document.getElementById('capOut').innerHTML = `<div class="card"><pre>${esc(JSON.stringify(r, null, 2))}</pre></div>`; }
      catch (e) { toast(e.message, 'err'); }
      ch.disabled = false;
    };
  }
}

async function runSweep() {
  try {
    await api('/api/sweep', { method: 'POST' });
    toast('Sweep complete.', 'ok', 2000);
    go('health');
  } catch (e) { toast(e.message, 'err'); }
}

/* ---- boot --------------------------------------------------------------- */

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openPalette();
  }
});

applyTheme();
setInterval(applyTheme, 1000);
render();
</script>
</body>
</html>
