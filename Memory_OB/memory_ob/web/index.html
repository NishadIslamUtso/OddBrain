<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory_OB</title>
<style>
  /* Theme variables. When embedded in Hermes these come from the host;
     standalone, the fallbacks below apply. */
  :root {
    --ui-accent: var(--ui-accent, #d4a74a);
    --ui-bg: var(--ui-background, var(--ui-background-secondary, #1a1a1a));
    --ui-bg-2: var(--ui-background-secondary, #222222);
    --ui-stroke: var(--ui-stroke-secondary, #333333);
    --ui-text: var(--ui-text-primary, #e8e8e8);
    --ui-text-2: var(--ui-text-secondary, #b0b0b0);
    --ui-text-3: var(--ui-text-tertiary, #888888);
    --ui-text-4: var(--ui-text-quaternary, #666666);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--ui-font, system-ui, -apple-system, "Segoe UI", sans-serif);
    background: var(--ui-bg);
    color: var(--ui-text);
    font-size: 14px;
  }
  #app { display: flex; height: 100vh; }
  /* sidebar */
  nav {
    width: 200px; flex: 0 0 200px;
    background: var(--ui-bg-2);
    border-right: 1px solid var(--ui-stroke);
    padding: 12px 8px;
    overflow-y: auto;
  }
  nav h1 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--ui-text-3); margin: 4px 8px 12px;
  }
  nav button {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; color: var(--ui-text-2);
    padding: 8px 10px; border-radius: 6px; cursor: pointer;
    font-size: 14px; margin-bottom: 2px;
  }
  nav button:hover { background: var(--ui-stroke); color: var(--ui-text); }
  nav button.active { background: var(--ui-stroke); color: var(--ui-accent); }
  nav .badge {
    float: right; background: var(--ui-accent); color: #000;
    border-radius: 10px; padding: 0 6px; font-size: 11px; font-weight: 600;
  }
  /* main */
  main { flex: 1; overflow-y: auto; padding: 20px 24px; }
  h2 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--ui-text-3); font-size: 13px; margin-bottom: 16px; }
  .card {
    background: var(--ui-bg-2); border: 1px solid var(--ui-stroke);
    border-radius: 8px; padding: 14px 16px; margin-bottom: 10px;
  }
  .card:hover { border-color: var(--ui-text-4); }
  .row { display: flex; align-items: baseline; gap: 8px; }
  .muted { color: var(--ui-text-3); }
  .dim { color: var(--ui-text-4); }
  .accent { color: var(--ui-accent); }
  .pill {
    display: inline-block; padding: 1px 7px; border-radius: 10px;
    font-size: 11px; border: 1px solid var(--ui-stroke); color: var(--ui-text-3);
  }
  .pill.diff { color: #e0a060; border-color: #e0a06055; }
  .pill.proposal { color: #6ec1ff; border-color: #6ec1ff55; }
  .pill.ask { color: #ff8f8f; border-color: #ff8f8f55; }
  .pill.merge { color: #b98fff; border-color: #b98fff55; }
  .pill.confirmed { color: #7fd98f; border-color: #7fd98f55; }
  .pill.unverified { color: #e0c060; border-color: #e0c06055; }
  button.act {
    background: var(--ui-stroke); color: var(--ui-text);
    border: 1px solid var(--ui-stroke); border-radius: 6px;
    padding: 5px 10px; cursor: pointer; font-size: 13px; margin-right: 6px;
  }
  button.act:hover { border-color: var(--ui-accent); color: var(--ui-accent); }
  button.act.primary { background: var(--ui-accent); color: #000; border-color: var(--ui-accent); font-weight: 600; }
  button.act.danger:hover { border-color: #ff8f8f; color: #ff8f8f; }
  input, select, textarea {
    background: var(--ui-bg); color: var(--ui-text);
    border: 1px solid var(--ui-stroke); border-radius: 6px;
    padding: 7px 10px; font-size: 14px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ui-accent); }
  textarea { width: 100%; min-height: 90px; resize: vertical; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .toolbar input[type=search] { flex: 1; min-width: 200px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  table.models { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  table.models th, table.models td { padding: 4px 6px; }
  table.models th { text-align: left; color: var(--ui-text-3); font-weight: 500; }
  table.models td:first-child { color: var(--ui-text-2); width: 70px; }
  table.models input { width: 100%; padding: 4px 6px; font-size: 12px; word-break: break-all; }
  .md h2, .md h3, .md h4 { margin: 10px 0 4px; color: var(--ui-text); }
  .md h2 { font-size: 16px; }
  .md h3 { font-size: 15px; }
  .md h4 { font-size: 14px; }
  .md p { margin: 6px 0; }
  .md code { background: var(--ui-bg); border: 1px solid var(--ui-stroke); border-radius: 4px; padding: 0 4px; font-size: 12px; }
  .md b { color: var(--ui-text); }
  pre {
    background: var(--ui-bg); border: 1px solid var(--ui-stroke);
    border-radius: 6px; padding: 10px; overflow-x: auto; font-size: 12px;
    color: var(--ui-text-2);
  }
  .diff-old { color: #ff8f8f; text-decoration: line-through; }
  .diff-new { color: #7fd98f; }
  .empty { color: var(--ui-text-4); padding: 30px; text-align: center; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat b { font-size: 22px; color: var(--ui-accent); }
  .stats { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 18px; }
  svg.graph { width: 100%; height: 420px; background: var(--ui-bg); border: 1px solid var(--ui-stroke); border-radius: 8px; }
  .err { color: #ff8f8f; font-size: 13px; }
  .ok { color: #7fd98f; font-size: 13px; }
  label.f { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 13px; color: var(--ui-text-2); }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; font-size: 13px; }
  .kv span:nth-child(odd) { color: var(--ui-text-3); }
</style>
</head>
<body>
<div id="app">
  <nav id="nav">
    <h1>Memory_OB</h1>
  </nav>
  <main id="main"></main>
</div>
<script>
  /* The host injects the API base here when this page is served from a
     plugin backend. Standalone, it stays empty (same origin). */
  window.__MEMORY_OB_BASE__ = "";
  /* Theme hand-off: the host passes its --ui-* values as query params so the
     screens match the app. Standalone, the CSS fallbacks apply. */
  (function () {
    var names = ['accent', 'background', 'background-secondary', 'stroke-secondary',
                 'text-primary', 'text-secondary', 'text-tertiary', 'text-quaternary'];
    var params = new URLSearchParams(location.search);
    var root = document.documentElement;
    for (var i = 0; i < names.length; i++) {
      var value = params.get(names[i]);
      if (value) root.style.setProperty('--ui-' + names[i], value);
    }
  })();
</script>
<script>
const API = window.__MEMORY_OB_BASE__ || '';
const state = { tab: 'review', data: {}, loading: false, error: '' };

const TABS = [
  ['review', 'Review'],
  ['vault', 'Vault'],
  ['search', 'Search'],
  ['graph', 'Graph'],
  ['journal', 'Journal'],
  ['notes', 'Notes'],
  ['health', 'Health'],
  ['settings', 'Settings'],
  ['intake', 'Intake'],
];

async function api(path, opts) {
  const method = (opts && opts.method) || 'GET';
  const body = opts && opts.body ? JSON.stringify(opts.body) : undefined;

  /* Inside the Hermes host shell a plain fetch carries no dashboard session
     token, so the app's authenticated bridge does the calling instead. The
     bridge is reached through the parent window because this document lives
     in a srcdoc iframe. Standalone (or a plain browser tab) falls through to
     fetch against the same origin. */
  const bridge = window.parent && window.parent.hermesDesktop && window.parent.hermesDesktop.api;
  if (typeof bridge === 'function') {
    try {
      return await bridge({ path: API + path, method, body });
    } catch (e) {
      throw new Error((e && e.message) || 'request failed');
    }
  }

  const res = await fetch(API + path, opts ? {
    method: method,
    headers: { 'Content-Type': 'application/json' },
    body: body,
  } : undefined);
  if (!res.ok) {
    let msg = res.status + ' ' + res.statusText;
    try { msg = (await res.json()).detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
  }[c]));
}

function pill(text, cls) { return `<span class="pill ${cls || ''}">${esc(text)}</span>`; }

/* Minimal markdown: headings, bold, italic, code, paragraphs. Enough for
   record bodies without pulling in a renderer. */
function md(s) {
  let h = esc(s);
  h = h.replace(/^###### (.*)$/gm, '<h4>$1</h4>')
       .replace(/^### (.*)$/gm, '<h4>$1</h4>')
       .replace(/^## (.*)$/gm, '<h3>$1</h3>')
       .replace(/^# (.*)$/gm, '<h2>$1</h2>')
       .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
       .replace(/\*(.+?)\*/g, '<i>$1</i>')
       .replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
  return `<div class="md">${h}</div>`;
}

function trustLabel(r) {
  if (r.trust >= 0.8) return pill('confirmed', 'confirmed');
  if (r.trust >= 0.3) return pill('unverified', 'unverified');
  return pill('raw', '');
}

async function render() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '<h1>Memory_OB</h1>';
  for (const [id, label] of TABS) {
    const b = document.createElement('button');
    b.textContent = label;
    b.className = state.tab === id ? 'active' : '';
    if (id === 'review' && state.data.reviewCount) {
      const s = document.createElement('span');
      s.className = 'badge';
      s.textContent = state.data.reviewCount;
      b.appendChild(s);
    }
    b.onclick = () => { state.tab = id; render(); };
    nav.appendChild(b);
  }

  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const fn = VIEWS[state.tab];
    main.innerHTML = await fn(state.data);
  } catch (e) {
    main.innerHTML = `<div class="empty"><span class="err">${esc(e.message)}</span></div>`;
  }
}

/* ---------- views ---------- */

async function viewReview() {
  const cards = await api('/api/cards?status=pending');
  state.data.reviewCount = cards.length;
  if (!cards.length) return '<h2>Review</h2><div class="sub">Nothing waiting.</div><div class="empty">No pending cards.</div>';
  let html = `<h2>Review</h2><div class="sub">${cards.length} card(s) waiting. The AI proposes; you sign.</div>`;
  for (const c of cards) {
    html += `<div class="card" data-card="${c.id}">
      <div class="row">
        ${pill(c.type, c.type)}
        <b>${esc(c.title)}</b>
        <span class="muted">·</span>
        <span class="dim">${esc(c.id)}</span>
      </div>`;
    if (c.body) html += `<div class="muted" style="margin:6px 0">${esc(c.body)}</div>`;
    if (c.type === 'diff' && c.old && c.new) {
      html += `<pre>${esc(JSON.stringify(c.old, null, 2))} → ${esc(JSON.stringify(c.new, null, 2))}</pre>`;
    }
    if (c.speakers && c.speakers.length) {
      html += `<div class="dim" style="font-size:12px">speakers: ${c.speakers.map(esc).join(', ')}</div>`;
    }
    html += `<div class="toolbar" style="margin-top:10px">`;
    if (c.type === 'diff') {
      html += `<button class="act primary" data-act="approve">take new</button>
               <button class="act" data-act="keep_both">keep both</button>
               <button class="act" data-act="take_old">take old</button>`;
    } else if (c.type === 'proposal') {
      html += `<button class="act primary" data-act="approve">approve</button>
               <button class="act danger" data-act="deny">deny</button>`;
    } else if (c.type === 'ask') {
      html += `<button class="act primary" data-act="confirm">confirm</button>
               <button class="act" data-act="dismiss">dismiss</button>`;
    } else if (c.type === 'merge') {
      html += `<button class="act primary" data-act="merge">merge</button>
               <button class="act" data-act="dismiss">dismiss</button>`;
    }
    html += `<button class="act" data-act="later">later</button></div></div>`;
  }
  setTimeout(bindCardButtons, 0);
  return html;
}

function bindCardButtons() {
  document.querySelectorAll('[data-card]').forEach(cardEl => {
    const id = cardEl.getAttribute('data-card');
    cardEl.querySelectorAll('button.act').forEach(btn => {
      btn.onclick = async () => {
        btn.disabled = true;
        try {
          await api(`/api/cards/${id}/${btn.getAttribute('data-act')}`, { method: 'POST' });
          render();
        } catch (e) {
          alert(e.message);
          btn.disabled = false;
        }
      };
    });
  });
}

async function viewVault() {
  const kind = state.data.vaultKind || '';
  const q = kind ? `?kind=${encodeURIComponent(kind)}` : '';
  const recs = await api('/api/records' + q);
  const kinds = ['profile', 'journal', 'story', 'capsule', 'learning', 'note'];
  let html = `<h2>Vault</h2><div class="sub">${recs.length} record(s). Human view of the ledger.</div>
    <div class="toolbar"><select id="kind">
      <option value="">all kinds</option>
      ${kinds.map(k => `<option ${k === kind ? 'selected' : ''}>${k}</option>`).join('')}
    </select></div>`;
  if (!recs.length) return html + '<div class="empty">No records.</div>';
  for (const r of recs) {
    html += `<div class="card">
      <div class="row">
        ${pill(r.kind, '')}
        ${trustLabel(r)}
        ${r.never_send ? pill('neverSend', 'ask') : ''}
        <b>${esc(r.title || '(untitled)')}</b>
      </div>
      ${r.body ? `<div class="muted" style="margin-top:4px">${md(r.body.slice(0, 600))}</div>` : ''}
      <div class="dim" style="font-size:12px;margin-top:6px">
        ${esc(r.id)} · ${esc(r.speaker)} · ${esc(r.status)}
      </div>
    </div>`;
  }
  setTimeout(() => {
    const sel = document.getElementById('kind');
    if (sel) sel.onchange = () => { state.data.vaultKind = sel.value; viewVault().then(h => { document.getElementById('main').innerHTML = h; }); };
  }, 0);
  return html;
}

async function viewSearch() {
  const q = state.data.query || '';
  let html = `<h2>Search</h2><div class="sub">Three legs: words · meaning · entities.</div>
    <div class="toolbar"><input type="search" id="q" placeholder="Search memory…" value="${esc(q)}"></div>
    <div id="results"><div class="empty">Type to search.</div></div>`;
  setTimeout(() => {
    const inp = document.getElementById('q');
    if (inp) inp.onkeydown = (e) => { if (e.key === 'Enter') doSearch(inp.value); };
  }, 0);
  if (q) {
    setTimeout(() => doSearch(q), 0);
  }
  return html;
}

async function doSearch(q) {
  state.data.query = q;
  const box = document.getElementById('results');
  if (!box) return;
  if (!q.trim()) { box.innerHTML = '<div class="empty">Type to search.</div>'; return; }
  try {
    const data = await api('/api/search?q=' + encodeURIComponent(q));
    let html = '';
    if (data.results && data.results.length) {
      html += `<div class="sub">${data.results.length} record(s)</div>`;
      for (const r of data.results) {
        html += `<div class="card">
          <div class="row">${pill(r.kind, '')}${trustLabel(r)}<b>${esc(r.title || '')}</b></div>
          ${r.body ? `<div class="muted">${md(r.body.slice(0, 400))}</div>` : ''}
          <div class="dim" style="font-size:12px">${esc(r.id)} · ${esc(r.speaker)}</div>
        </div>`;
      }
    }
    if (data.candidates && data.candidates.length) {
      html += `<div class="sub">${data.candidates.length} candidate fact(s) — UNVERIFIED</div>`;
      for (const f of data.candidates) {
        html += `<div class="card"><div class="row">${pill('candidate', 'unverified')}<span>${esc(f.text)}</span></div></div>`;
      }
    }
    if (!html) html = '<div class="empty">No matches.</div>';
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

async function viewGraph() {
  const data = await api('/api/graph');
  const edges = data.edges || [];
  if (!edges.length) return '<h2>Graph</h2><div class="sub">No connections yet.</div><div class="empty">Records with links, supersedes, contradicts or supports will appear here.</div>';
  // simple circular layout
  const nodes = [];
  const seen = new Set();
  for (const e of edges) {
    for (const id of [e.src, e.dst]) {
      if (!seen.has(id)) { seen.add(id); nodes.push(id); }
    }
  }
  const cx = 450, cy = 210, R = 150;
  const pos = nodes.map((id, i) => {
    const a = (2 * Math.PI * i) / nodes.length;
    return { id, x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) };
  });
  const byId = Object.fromEntries(pos.map(p => [p.id, p]));
  let svg = `<svg class="graph" viewBox="0 0 900 420">`;
  for (const e of edges) {
    const a = byId[e.src], b = byId[e.dst];
    if (!a || !b) continue;
    const color = e.label === 'contradicts' ? '#ff8f8f' : e.label === 'supports' ? '#7fd98f' : e.label === 'supersedes' ? '#e0a060' : '#888';
    svg += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="1.5" opacity="0.7"/>`;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    svg += `<text x="${mx}" y="${my}" fill="${color}" font-size="10" text-anchor="middle">${esc(e.label)}</text>`;
  }
  for (const p of pos) {
    svg += `<circle cx="${p.x}" cy="${p.y}" r="14" fill="var(--ui-stroke)" stroke="var(--ui-accent)"/>`;
    svg += `<text x="${p.x}" y="${p.y + 26}" fill="var(--ui-text-3)" font-size="9" text-anchor="middle">${esc(p.id.slice(0, 10))}</text>`;
  }
  svg += `</svg>`;
  return `<h2>Graph</h2><div class="sub">${nodes.length} nodes · ${edges.length} edges. Edge labels: supports, contradicts, supersedes, merged, owner links.</div>${svg}
    <div class="card" style="margin-top:10px"><pre>${esc(JSON.stringify(edges, null, 2))}</pre></div>`;
}

async function viewJournal() {
  const entries = await api('/api/journal');
  let html = `<h2>Journal &amp; Life Story</h2><div class="sub">${entries.length} journal entry(ies), newest first.</div>`;
  if (!entries.length) return html + '<div class="empty">No journal entries yet.</div>';
  for (const e of entries) {
    html += `<div class="card">
      <div class="row">${pill(e.kind, 'proposal')}<b>${esc(e.title || '')}</b></div>
      <div class="dim" style="font-size:12px">${esc(e.event_time || e.created || '')}</div>
      ${e.body ? `<div class="muted" style="margin-top:6px">${md(e.body.slice(0, 800))}</div>` : ''}
    </div>`;
  }
  return html;
}

async function viewNotes() {
  const recs = await api('/api/records?kind=note');
  let html = `<h2>Notes</h2><div class="sub">Direct scratch writes — no proposal needed.</div>
    <div class="card">
      <label class="f">New note
        <textarea id="noteBody" placeholder="A decision, a preference, an open item…"></textarea>
      </label>
      <button class="act primary" id="addNote">Add note</button>
    </div>`;
  if (!recs.length) html += '<div class="empty">No notes yet.</div>';
  for (const r of recs) {
    html += `<div class="card">
      <div class="row"><b>${esc(r.title || '(untitled)')}</b></div>
      <div class="muted">${esc(r.body)}</div>
      <div class="dim" style="font-size:12px;margin-top:6px">${esc(r.id)} · ${esc(r.created || '')}</div>
    </div>`;
  }
  setTimeout(() => {
    const btn = document.getElementById('addNote');
    if (btn) btn.onclick = async () => {
      const body = document.getElementById('noteBody').value.trim();
      if (!body) return;
      btn.disabled = true;
      try {
        await api('/api/records', { method: 'POST', body: { kind: 'note', title: body.slice(0, 60), body, speaker: 'user', trust: 0.5 } });
        render();
      } catch (e) { alert(e.message); btn.disabled = false; }
    };
  }, 0);
  return html;
}

async function viewHealth() {
  const health = await api('/api/health');
  const audit = await api('/api/audit');
  const s = health.stats;
  const td = audit.trust_distribution || {};
  return `<h2>Health</h2><div class="sub">Store statistics and the monthly audit.</div>
    <div class="stats">
      <div class="stat"><b>${s.records}</b><span class="muted">records</span></div>
      <div class="stat"><b>${s.confirmed}</b><span class="muted">confirmed</span></div>
      <div class="stat"><b>${s.active}</b><span class="muted">active</span></div>
      <div class="stat"><b>${s.trash}</b><span class="muted">trashed</span></div>
      <div class="stat"><b>${s.retracted}</b><span class="muted">retracted</span></div>
      <div class="stat"><b>${s.facts}</b><span class="muted">candidates</span></div>
      <div class="stat"><b>${s.edges}</b><span class="muted">edges</span></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Monthly audit</h3>
      <div class="kv">
        <span>links checked</span><span>${audit.links_checked}</span>
        <span>dead links</span><span>${audit.dead_links}</span>
        <span>contradictions</span><span>${audit.contradictions}</span>
        <span>orphans</span><span>${audit.orphans}</span>
        <span>merge candidates</span><span>${audit.merge_candidates}</span>
        <span>raw / candidate / confirmed</span>
        <span>${td.raw || 0} / ${td.candidate || 0} / ${td.confirmed || 0}</span>
      </div>
    </div>
    <div class="toolbar"><button class="act" id="runSweep">Run consistency sweep now</button></div>
    <div id="sweepOut"></div>`;
}

async function viewSettings() {
  const data = await api('/api/models');
  const cfg = data.config;
  const slotRows = ['extract', 'dream', 'embed', 'rerank', 'chapter'].map(name => {
    const s = (cfg.auxiliary || {})[name] || {};
    return `<tr>
      <td>${name}</td>
      <td><input data-slot="${name}" data-k="provider" value="${esc(s.provider || 'auto')}"></td>
      <td><input data-slot="${name}" data-k="model" value="${esc(s.model || '')}" placeholder="(default)"></td>
      <td><input data-slot="${name}" data-k="base_url" value="${esc(s.base_url || '')}" placeholder="http://127.0.0.1:11434"></td>
    </tr>`;
  }).join('');
  return `<h2>Settings</h2><div class="sub">Model selector — the app's aux-model pattern. <code>auto</code> follows main (Hermes when hosted).</div>
    <div class="card">
      <div class="kv" style="margin-bottom:12px">
        <span>backend</span><span class="accent">${esc(data.backend)}</span>
      </div>
      <table class="models">
        <colgroup>
          <col style="width:64px"><col style="width:78px"><col style="width:110px"><col>
        </colgroup>
        <thead><tr>
          <th style="padding:4px">slot</th><th>provider</th><th>model</th><th>base_url</th>
        </tr></thead>
        <tbody>${slotRows}</tbody>
      </table>
      <div class="toolbar" style="margin-top:12px">
        <button class="act primary" id="saveModels">Save</button>
        <button class="act" id="refreshModels">Refresh</button>
      </div>
      <div id="modelMsg"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Vault</h3>
      <div class="kv">
        <span>vault path</span><span>${esc(location.pathname.replace('/ui', '') || '(default)')}</span>
      </div>
      <div class="toolbar" style="margin-top:10px">
        <button class="act" id="doExport">Export vault</button>
        <button class="act" id="doEmbed">Compute embeddings</button>
      </div>
      <div id="vaultMsg"></div>
    </div>`;
}

async function viewIntake() {
  return `<h2>Intake</h2><div class="sub">Capture anything. It lands as candidate facts — truth needs a card.</div>
    <div class="card">
      <label class="f">Capture text
        <textarea id="capText" placeholder="Paste a session, a note, a thought…"></textarea>
      </label>
      <div class="toolbar">
        <button class="act primary" id="doCapture">Capture</button>
        <button class="act" id="doDream">Run nightly dream</button>
        <button class="act" id="doChapter">Draft a Life Story chapter</button>
      </div>
      <div id="capOut"></div>
    </div>
    <div class="card">
      <div class="kv">
        <span>note</span><span>Candidates land below the truth line with a score. Nothing becomes truth without a Review card.</span>
      </div>
    </div>`;
}

const VIEWS = {
  review: viewReview,
  vault: viewVault,
  search: viewSearch,
  graph: viewGraph,
  journal: viewJournal,
  notes: viewNotes,
  health: viewHealth,
  settings: viewSettings,
  intake: viewIntake,
};

/* deferred bindings for views that render buttons after innerHTML */
async function bindLate() {
  if (state.tab === 'health') {
    const b = document.getElementById('runSweep');
    if (b) b.onclick = async () => {
      b.disabled = true;
      try {
        const r = await api('/api/sweep', { method: 'POST' });
        document.getElementById('sweepOut').innerHTML =
          `<div class="card"><pre>${esc(JSON.stringify(r, null, 2))}</pre></div>`;
      } catch (e) { alert(e.message); }
      b.disabled = false;
    };
  }
  if (state.tab === 'settings') {
    const save = document.getElementById('saveModels');
    if (save) save.onclick = async () => {
      const out = { main: { provider: 'auto', model: '', base_url: '' }, auxiliary: {} };
      document.querySelectorAll('[data-slot]').forEach(inp => {
        const slot = inp.getAttribute('data-slot');
        const k = inp.getAttribute('data-k');
        out.auxiliary[slot] = out.auxiliary[slot] || {};
        out.auxiliary[slot][k] = inp.value;
      });
      try {
        await api('/api/settings', { method: 'POST', body: out });
        document.getElementById('modelMsg').innerHTML = '<span class="ok">Saved.</span>';
      } catch (e) { document.getElementById('modelMsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
    const exp = document.getElementById('doExport');
    if (exp) exp.onclick = async () => {
      try { await api('/api/export', { method: 'POST' }); document.getElementById('vaultMsg').innerHTML = '<span class="ok">Vault exported.</span>'; }
      catch (e) { document.getElementById('vaultMsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
    const emb = document.getElementById('doEmbed');
    if (emb) emb.onclick = async () => {
      try { const r = await api('/api/embed', { method: 'POST', body: {} }); document.getElementById('vaultMsg').innerHTML = `<span class="ok">${r.computed} computed, ${r.cached} cached.</span>`; }
      catch (e) { document.getElementById('vaultMsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    };
  }
  if (state.tab === 'intake') {
    const cap = document.getElementById('doCapture');
    if (cap) cap.onclick = async () => {
      const text = document.getElementById('capText').value.trim();
      if (!text) return;
      cap.disabled = true;
      try {
        const r = await api('/api/capture', { method: 'POST', body: { text } });
        document.getElementById('capOut').innerHTML =
          `<div class="card"><b>${r.candidates} candidate(s)</b><pre>${esc(JSON.stringify(r.facts, null, 2))}</pre></div>`;
      } catch (e) { alert(e.message); }
      cap.disabled = false;
    };
    const dream = document.getElementById('doDream');
    if (dream) dream.onclick = async () => {
      dream.disabled = true;
      try { const r = await api('/api/dream', { method: 'POST' }); document.getElementById('capOut').innerHTML = `<div class="card"><pre>${esc(JSON.stringify(r, null, 2))}</pre></div>`; }
      catch (e) { alert(e.message); }
      dream.disabled = false;
    };
    const ch = document.getElementById('doChapter');
    if (ch) ch.onclick = async () => {
      ch.disabled = true;
      try { const r = await api('/api/chapter', { method: 'POST', body: {} }); document.getElementById('capOut').innerHTML = `<div class="card"><pre>${esc(JSON.stringify(r, null, 2))}</pre></div>`; }
      catch (e) { alert(e.message); }
      ch.disabled = false;
    };
  }
}

const _render = render;
render = async function () { await _render(); await bindLate(); };
render();
</script>
