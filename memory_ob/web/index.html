<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory_OB</title>
<style>
/* ---------------------------------------------------------------------------
   Colours.
   Every colour on this page is OPAQUE. The values below are only what shows for
   a split second before the script runs; the script then reads the host app's
   colours (or the system light/dark setting), turns them into solid colours,
   and nudges text, borders and buttons until they can be read comfortably.
   The host can inject its own values for --bg, --text, etc. after this block.
   --------------------------------------------------------------------------- */
:root {
  color-scheme: dark;
  --bg: #17181c; --bg-2: #1f2127; --bg-3: #292c34;
  --stroke: #3a3e48; --stroke-2: #4b505c; --edge: #59606e;
  --text: #f1f2f5; --text-2: #c9ccd4; --text-3: #a4a9b5;
  --accent: #8fa3ff; --accent-text: #a9b8ff; --on-accent: #10131f;
  --danger: #ff8f8f; --danger-bg: #3a2326;
  --ok: #6fd39a; --ok-bg: #1f3329;
  --warn: #f0c46a; --warn-bg: #38301d;
  --c0: #8fa3ff; --c1: #6fd39a; --c2: #f0c46a; --c3: #ff9d7a;
  --c4: #d79bff; --c5: #6fd0e0; --c6: #f08fc0; --c7: #b4c66a;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f7f7f9; --bg-2: #ffffff; --bg-3: #eceef2;
    --stroke: #cdd1d9; --stroke-2: #aeb4c0; --edge: #8b93a3;
    --text: #15171c; --text-2: #3b404b; --text-3: #565c69;
    --accent: #3a56d4; --accent-text: #2c45b8; --on-accent: #ffffff;
    --danger: #b3261e; --danger-bg: #fbe9e7;
    --ok: #1d7a46; --ok-bg: #e4f4ea;
    --warn: #8a5a00; --warn-bg: #fbf0d6;
    --c0: #3a56d4; --c1: #1d7a46; --c2: #8a5a00; --c3: #b4491f;
    --c4: #7a3fb0; --c5: #0b7285; --c6: #a8286b; --c7: #5c6b13;
  }
}

* { box-sizing: border-box; }
html { font-size: 14px; background: var(--bg); }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 1rem; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; font-weight: 650; line-height: 1.25; color: var(--text); }
h1 { font-size: 1.4rem; } h2 { font-size: 1.12rem; } h3 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--accent-text); }
button, input, select, textarea { font: inherit; color: inherit; }
::placeholder { color: var(--text-3); opacity: 1; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); font-size: .86rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
[hidden] { display: none !important; }

/* ---- layout ------------------------------------------------------------- */
#app { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  padding: 12px 0 0; border-bottom: 1px solid var(--stroke);
}
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  appearance: none; background: none; border: 0; cursor: pointer; white-space: nowrap;
  padding: 9px 14px; color: var(--text-2); font-weight: 560;
  border-bottom: 3px solid transparent; margin-bottom: -1px; border-radius: 8px 8px 0 0;
}
.tab:hover { color: var(--text); background: var(--bg-2); }
.tab[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); }
.tab .badge {
  display: inline-block; min-width: 1.3em; margin-left: 6px; padding: 0 6px; border-radius: 99px;
  background: var(--accent); color: var(--on-accent); font-size: .78rem; font-weight: 700; text-align: center;
}
main { padding-top: 20px; }
.screen > * + *, .gap > * + * { margin-top: 18px; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head p { color: var(--text-2); }
.sec { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.sec h2 { display: flex; align-items: center; gap: 8px; }
.count { background: var(--bg-3); color: var(--text); border-radius: 99px; padding: 0 8px; font-size: .82rem; font-weight: 600; }

/* ---- banners ------------------------------------------------------------ */
.banner {
  display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--stroke);
  background: var(--bg-2); color: var(--text);
}
.banner.warn { background: var(--warn-bg); border-color: var(--warn); }
.banner.danger { background: var(--danger-bg); border-color: var(--danger); }
.banner.ok { background: var(--ok-bg); border-color: var(--ok); }
#banners > * + * { margin-top: 8px; }

/* ---- cards & rows ------------------------------------------------------- */
.card { background: var(--bg-2); border: 1px solid var(--stroke); border-radius: var(--radius); padding: 16px; }
.card > * + * { margin-top: 10px; }
.card.pad0 { padding: 0; }
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent-text); }
.stack > * + * { margin-top: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }
.list { list-style: none; margin: 0; padding: 0; }
.list > li + li { border-top: 1px solid var(--stroke); }

.chip {
  display: inline-block; padding: 1px 9px; border-radius: 99px; font-size: .8rem; font-weight: 560;
  background: var(--bg-3); color: var(--text); border: 1px solid var(--stroke); white-space: nowrap;
}
.chip.accent { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.chip.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--stroke-2); }
button.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* ---- buttons ------------------------------------------------------------ */
.btn {
  appearance: none; cursor: pointer; border-radius: 8px; padding: 7px 14px; font-weight: 600;
  background: var(--bg-3); color: var(--text); border: 1px solid var(--stroke-2);
}
.btn:hover { border-color: var(--text-3); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--bg-2); color: var(--danger); border-color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent-text); padding: 5px 8px; }
.btn.ghost:hover { background: var(--bg-3); }
.btn.sm { padding: 3px 10px; font-size: .88rem; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }

/* ---- forms -------------------------------------------------------------- */
.field > label, .lbl { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 4px; color: var(--text); }
.field .hint { color: var(--text-2); font-size: .86rem; margin-top: 4px; }
input[type=text], input[type=search], input[type=date], input[type=url], select, textarea {
  width: 100%; padding: 8px 10px; border-radius: 8px;
  background: var(--bg); color: var(--text); border: 1px solid var(--stroke-2);
}
textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 0; }
select { appearance: auto; }
.switch { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch .track {
  flex: none; width: 40px; height: 22px; margin-top: 2px; border-radius: 99px; position: relative;
  background: var(--bg-3); border: 1px solid var(--stroke-2); transition: background .15s;
}
.switch .track::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--text-2); transition: transform .15s, background .15s;
}
.switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .track::after { transform: translateX(18px); background: var(--on-accent); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch input:disabled + .track { opacity: .5; }
.switch .txt b { display: block; font-weight: 600; }
.switch .txt span { color: var(--text-2); font-size: .88rem; }
.radio { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 10px 12px; border: 1px solid var(--stroke); border-radius: 8px; }
.radio input { margin-top: 4px; accent-color: var(--accent); }
.radio.on { border-color: var(--accent); background: var(--bg); }
.radio b { display: block; font-weight: 600; }
.radio span { color: var(--text-2); font-size: .88rem; }

/* ---- the compare card ---------------------------------------------------- */
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.compare > div { background: var(--bg); border: 1px solid var(--stroke); border-radius: 8px; padding: 10px 12px; }
.compare .lbl { color: var(--text-2); font-weight: 600; margin-bottom: 2px; font-size: .82rem; }
.compare .new { border-color: var(--accent); }
@media (max-width: 560px) { .compare { grid-template-columns: 1fr; } }

/* ---- feed --------------------------------------------------------------- */
.feed-item { padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.feed-item.undone .text { text-decoration: line-through; color: var(--text-3); }
.feed-item .top { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.feed-item .verb { font-weight: 700; }
.feed-item .when { color: var(--text-2); font-size: .85rem; margin-left: auto; }
.feed-item .was { color: var(--text-2); font-size: .9rem; }
.feed-item .was s { color: var(--text-3); }

/* ---- memories ----------------------------------------------------------- */
.mem { padding: 11px 16px; }
.mem .t { overflow-wrap: anywhere; }
.mem .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; color: var(--text-2); font-size: .85rem; }
.mem .acts { margin-top: 6px; display: flex; gap: 4px; }
.mem .editor { display: grid; gap: 8px; }

/* ---- vault -------------------------------------------------------------- */
.vault { display: grid; grid-template-columns: 230px 1fr; gap: 18px; align-items: start; }
.v-side { position: sticky; top: 64px; max-height: calc(100vh - 90px); overflow: auto; padding-right: 4px; }
.v-side h4 { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); margin: 14px 0 6px; }
.v-side h4:first-child { margin-top: 0; }
.tree button {
  display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left;
  background: none; border: 0; padding: 4px 8px; border-radius: 6px; cursor: pointer; color: var(--text);
}
.tree button:hover { background: var(--bg-3); }
.tree button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.tree .n { color: var(--text-2); font-size: .82rem; }
.tree button[aria-pressed="true"] .n { color: var(--on-accent); }
.seg { display: inline-flex; border: 1px solid var(--stroke-2); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--bg-2); border: 0; padding: 6px 14px; cursor: pointer; font-weight: 600; color: var(--text-2); }
.seg button + button { border-left: 1px solid var(--stroke-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.notes li { padding: 10px 14px; cursor: pointer; }
.notes li:hover { background: var(--bg-3); }
.notes .title { font-weight: 600; }
.notes .snip { color: var(--text-2); font-size: .9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.notes .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; align-items: center; color: var(--text-2); font-size: .82rem; }
svg.graph { width: 100%; height: min(70vh, 640px); min-height: 360px; background: var(--bg-2); border: 1px solid var(--stroke); border-radius: var(--radius); cursor: grab; display: block; touch-action: none; }
svg.graph:active { cursor: grabbing; }
svg.graph text { fill: var(--text); font-size: 11px; paint-order: stroke; stroke: var(--bg-2); stroke-width: 3px; pointer-events: none; }
svg.graph .node { cursor: pointer; }
svg.graph .node circle { stroke: var(--bg-2); stroke-width: 1.5px; }
svg.graph .node:hover circle { stroke: var(--text); stroke-width: 2px; }
svg.graph line { stroke: var(--edge); stroke-width: 1px; }
svg.graph line.dim, svg.graph .node.dim { opacity: .18; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--text-2); font-size: .85rem; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
.drawer-back { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: min(560px, 100%);
  background: var(--bg); border-left: 1px solid var(--stroke-2); overflow: auto; padding: 18px 18px 40px;
  box-shadow: -8px 0 24px rgba(0,0,0,.3);
}
.drawer > * + * { margin-top: 14px; }
.md h1, .md h2, .md h3 { margin: 14px 0 6px; } .md h1 { font-size: 1.2rem; } .md h2 { font-size: 1.08rem; } .md h3 { font-size: 1rem; }
.md p + p, .md ul + p, .md p + ul { margin-top: 8px; }
.md ul { margin: 6px 0 0; padding-left: 1.2em; } .md li + li { margin-top: 3px; }
.md code { background: var(--bg-3); border-radius: 4px; padding: 0 4px; }
.md .wl { color: var(--accent-text); text-decoration: underline; cursor: pointer; }
.md .wl.dead { color: var(--text-2); text-decoration: none; cursor: default; }
@media (max-width: 760px) {
  .vault { grid-template-columns: 1fr; }
  .v-side { position: static; max-height: none; }
  .v-side details { margin-bottom: 8px; }
}

/* ---- people ------------------------------------------------------------- */
.split { display: grid; grid-template-columns: minmax(220px, 310px) 1fr; gap: 18px; align-items: start; }
.split .back { display: none; }
.person-row { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--text); }
.person-row:hover { background: var(--bg-3); }
.person-row[aria-current="true"] { background: var(--bg-3); box-shadow: inset 3px 0 0 var(--accent); }
.person-row .name { font-weight: 600; }
.person-row .sub { color: var(--text-2); font-size: .86rem; }
.chat { background: var(--bg); border: 1px solid var(--stroke); border-radius: 8px; padding: 10px 12px; max-height: 340px; overflow: auto; }
.chat p { padding: 4px 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.chat b { color: var(--accent-text); }
@media (max-width: 760px) {
  .split { grid-template-columns: 1fr; }
  .split.sel .plist { display: none; }
  .split:not(.sel) .pdetail { display: none; }
  .split .back { display: inline-block; }
}

/* ---- misc ---------------------------------------------------------------- */
.empty { text-align: center; padding: 28px 16px; color: var(--text-2); }
.empty b { display: block; color: var(--text); font-size: 1.05rem; margin-bottom: 4px; }
.msg { color: var(--text-2); font-size: .9rem; }
.msg.err { color: var(--danger); } .msg.good { color: var(--ok); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
.kv dt { color: var(--text-2); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.skeleton { color: var(--text-2); padding: 24px 0; }
.sect-title { font-size: .8rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-2); margin: 4px 0 6px; }
hr { border: 0; border-top: 1px solid var(--stroke); margin: 14px 0; }

#toasts { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 90; display: grid; gap: 8px; width: min(440px, calc(100% - 24px)); }
.toast { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-weight: 560; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
.toast.err { background: var(--danger); color: var(--bg); }
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--bg-2); color: var(--text); border: 1px solid var(--stroke-2); border-radius: 14px; padding: 20px; width: min(460px, 100%); box-shadow: 0 12px 40px rgba(0,0,0,.45); }
.modal > * + * { margin-top: 12px; }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <nav class="tabs" id="tabs" aria-label="Memory_OB"></nav>
  </header>
  <div id="banners" style="margin-top:14px"></div>
  <main id="main"><p class="skeleton">Loading…</p></main>
</div>
<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script>
  /* The host injects the API base here when this page is served from a
     plugin backend. Standalone, it stays empty (same origin). */
  window.__MEMORY_OB_BASE__ = "";
  /* The write token. The backend injects it here, and every write echoes it
     back — the pages authenticate by shape, not by a hand-typed header. */
  window.__MEMORY_OB_TOKEN__ = "";
</script>
<script>
'use strict';

const API = window.__MEMORY_OB_BASE__ || '';
const TOKEN = window.__MEMORY_OB_TOKEN__ || '';
const TOKEN_HEADER = 'X-Memory-OB-Token';

/* ==========================================================================
   Look: follow the host app, but never trust it to be readable.
   1. Read the host's colours (live from the parent window when it can be
      reached, otherwise the values the backend wrote into this page).
   2. Turn each into a SOLID colour (a see-through background is blended onto
      the base colour, so nothing on this page is ever see-through).
   3. Nudge text, borders and buttons until they pass a readability check.
   4. Follow the host's font and text size.
   The result is exposed as window.__memoryObTheme so it can be checked.
   ========================================================================== */
const Theme = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 1;
  const cx = cv.getContext('2d', { willReadFrequently: true });

  /* Any CSS colour the browser understands -> [r,g,b,a] (a in 0..1), or null. */
  function parse(value) {
    if (!value || typeof value !== 'string') return null;
    const v = value.trim();
    if (!v || /^(inherit|initial|unset|none|transparent)$/i.test(v) && !/^transparent$/i.test(v)) return null;
    try {
      cx.fillStyle = '#010203'; cx.fillStyle = v;
      const a1 = cx.fillStyle;
      cx.fillStyle = '#fdfcfb'; cx.fillStyle = v;
      if (a1 === '#010203' && cx.fillStyle === '#fdfcfb') return null;      /* not a colour */
      cx.clearRect(0, 0, 1, 1); cx.fillRect(0, 0, 1, 1);
      const d = cx.getImageData(0, 0, 1, 1).data;
      return [d[0], d[1], d[2], d[3] / 255];
    } catch (e) { return null; }
  }
  const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
  const hex = (c) => '#' + c.slice(0, 3).map(x => clamp(Math.round(x), 0, 255).toString(16).padStart(2, '0')).join('');
  function over(c, base) {            /* blend c onto an opaque base */
    const a = c[3] === undefined ? 1 : c[3];
    return [c[0] * a + base[0] * (1 - a), c[1] * a + base[1] * (1 - a), c[2] * a + base[2] * (1 - a), 1];
  }
  const lin = (x) => { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); };
  const lum = (c) => 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]);
  function ratio(a, b) { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, 1];
  const WHITE = [255, 255, 255, 1], BLACK = [0, 0, 0, 1];

  /* Move fg toward black or white (whichever helps) until it reads on every
     surface in `on` at the given ratio. */
  function ensure(fg, on, min) {
    const worst = (c) => Math.min(...on.map(s => ratio(c, s)));
    if (worst(fg) >= min) return fg;
    const avg = on.reduce((s, c) => s + lum(c), 0) / on.length;
    const towards = ratio(WHITE, on[0]) >= ratio(BLACK, on[0]) && avg < 0.5 ? WHITE : BLACK;
    for (let t = 0.08; t <= 1.0001; t += 0.06) {
      const c = mix(fg, towards, t);
      if (worst(c) >= min) return c;
    }
    return towards;
  }
  function hsl(h, s, l) {
    s /= 100; l /= 100;
    const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [255 * f(0), 255 * f(8), 255 * f(4), 1];
  }

  const FROM_HOST = {   /* host variable -> role */
    bg: ['--ui-bg-chrome', '--ui-bg-sidebar', '--ui-bg-primary', '--ui-background'],
    bg2: ['--ui-bg-secondary'],
    bg3: ['--ui-bg-elevated'],
    stroke: ['--ui-stroke-secondary'],
    stroke2: ['--ui-stroke-tertiary'],
    text: ['--ui-text-primary'],

    try { return await bridge({ path: API + path, method, body: payload, headers }); }
    catch (e) { throw new Error(plainError(e && e.message)); }

      method, headers, body: payload === undefined ? undefined : JSON.stringify(payload),

function qTokens(q) { const t = []; const re = /-?[^\s"]*"[^"]*"|\S+/g; let m; while ((m = re.exec(q || ''))) t.push(m[0]); return t; }
function tokOn(tok) { return qTokens(state.vq).includes(tok); }
function setQ(q) { state.vq = q.trim(); const el = $('#v-q'); if (el) el.value = state.vq; return loadVault(); }
function toggleTok(tok, exclusivePrefix) {
  let t = qTokens(state.vq); const had = t.includes(tok);
  if (exclusivePrefix) t = t.filter(x => !x.startsWith(exclusivePrefix));
  else t = t.filter(x => x !== tok);
  if (!had) t.push(tok);
  return setQ(t.join(' '));
}
function isoAgo(days) { const d = new Date(Date.now() - days * 864e5); return d.toISOString().slice(0, 10); }
function noteChips(n) {
  const typ = { person: 'Person', source: 'Conversation', summary: 'Summary' }[n.type];
  return (typ ? `<span class="chip">${typ}</span>` : '') +
    (n.type === 'memory' ? `<span class="chip" style="border-color:${catColor(n.category)}">${esc(n.category)}</span>` : '');
}

async function renderGraphView() {
  const g = state.vg; const el = $('#v-content');
  const sw = (key, label) => `<label class="switch" style="align-items:center"><input type="checkbox" data-graph="${key}"${g[key] ? ' checked' : ''}><span class="track"></span><span class="txt"><b>${label}</b></span></label>`;

    <div id="g-wrap"><p class="skeleton">Drawing…</p></div>`;
  const r = await api(`/api/vault/graph?q=${enc(state.vq)}&tags=${g.tags}&people=${g.people}&sources=${g.sources}&orphans=${g.orphans}`);
  if (!r.nodes.length) { $('#g-wrap').innerHTML = emptyBox('Nothing to draw', 'No notes match. Clear a filter or add more memories.'); return; }
  const used = [...new Set(r.nodes.filter(n => n.type === 'memory').map(n => n.category))];
  const legend = used.map(c => `<span><i style="background:${catColor(c)}"></i>${esc(c)}</span>`).join('') +
    (r.nodes.some(n => n.type === 'person') ? '<span><i style="background:var(--accent)"></i>Person</span>' : '') +
    (r.nodes.some(n => n.type === 'source') ? '<span><i style="background:var(--text-3)"></i>Conversation</span>' : '') +
    (r.nodes.some(n => n.type === 'tag') ? '<span><i style="background:var(--warn)"></i>Tag</span>' : '');
  $('#g-wrap').innerHTML = `<svg class="graph" id="g-svg" role="img" aria-label="Graph of your notes and how they connect"></svg>
    <p class="faint" style="margin-top:6px">Scroll to zoom, drag to move, click a dot to open it. ${plural(r.nodes.length, 'note')}, ${plural(r.edges.length, 'link')}.</p>
    <div class="legend" style="margin-top:6px">${legend}</div>`;
  drawGraph(r);
}
function drawGraph(r) {
  const svg = $('#g-svg'); const W = svg.clientWidth || 800, H = svg.clientHeight || 520;
  const nodes = r.nodes.map(n => Object.assign({}, n)); const byId = new Map(nodes.map(n => [n.id, n]));
  const links = r.edges.map(e => ({ a: byId.get(e.source), b: byId.get(e.target) })).filter(l => l.a && l.b);
  nodes.forEach((n, i) => { const a = i * 2.399963, rad = 26 * Math.sqrt(i + 1); n.x = W / 2 + rad * Math.cos(a); n.y = H / 2 + rad * Math.sin(a); n.vx = 0; n.vy = 0; });
  const N = nodes.length, iters = Math.max(30, Math.min(240, Math.floor(3e7 / (N * N + 1))));
  for (let t = 0; t < iters; t++) {
    const cool = 1 - t / iters;
    for (let i = 0; i < N; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < N; j++) {
        const b = nodes[j]; let dx = a.x - b.x, dy = a.y - b.y; let d2 = dx * dx + dy * dy;
        if (d2 > 90000) continue;
        if (d2 < 0.01) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = dx * dx + dy * dy + .01; }
        const f = 1800 / d2, d = Math.sqrt(d2);
        a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f;
      }
    }
    for (const l of links) {
      const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y, d = Math.sqrt(dx * dx + dy * dy) || 1, f = (d - 70) * 0.02;
      l.a.vx += dx / d * f; l.a.vy += dy / d * f; l.b.vx -= dx / d * f; l.b.vy -= dy / d * f;
    }
    for (const n of nodes) {
      n.vx += (W / 2 - n.x) * 0.004; n.vy += (H / 2 - n.y) * 0.004;
      n.x += Math.max(-12, Math.min(12, n.vx)) * cool; n.y += Math.max(-12, Math.min(12, n.vy)) * cool; n.vx *= 0.6; n.vy *= 0.6;
    }
  }
  const minX = Math.min(...nodes.map(n => n.x)), maxX = Math.max(...nodes.map(n => n.x));
  const minY = Math.min(...nodes.map(n => n.y)), maxY = Math.max(...nodes.map(n => n.y));
  const pad = 40, k0 = Math.min(2, (W - pad * 2) / Math.max(1, maxX - minX), (H - pad * 2) / Math.max(1, maxY - minY));
  const view = { k: k0, x: W / 2 - k0 * (minX + maxX) / 2, y: H / 2 - k0 * (minY + maxY) / 2 };
  const color = (n) => n.type === 'person' ? 'var(--accent)' : n.type === 'source' ? 'var(--text-3)' : n.type === 'tag' ? 'var(--warn)' : n.type === 'summary' ? 'var(--text-2)' : catColor(n.category);
  const labelAll = N <= 45;
  svg.innerHTML = `<g id="g-root"><g>${links.map((l, i) => `<line data-i="${i}" x1="${l.a.x.toFixed(1)}" y1="${l.a.y.toFixed(1)}" x2="${l.b.x.toFixed(1)}" y2="${l.b.y.toFixed(1)}"/>`).join('')}</g>
    <g>${nodes.map((n, i) => `<g class="node" data-i="${i}" data-id="${esc(n.id)}" data-type="${n.type}"><title>${esc(n.label)}</title>
      <circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${(5 + Math.min(8, Math.sqrt(n.degree || 0) * 2)).toFixed(1)}" fill="${color(n)}"/>
      ${labelAll || (n.degree || 0) >= 3 ? `<text x="${(n.x + 9).toFixed(1)}" y="${(n.y + 4).toFixed(1)}">${esc(n.label.slice(0, 30))}</text>` : ''}</g>`).join('')}</g></g>`;
  const root = $('#g-root', svg);
  const apply = () => root.setAttribute('transform', `translate(${view.x.toFixed(1)} ${view.y.toFixed(1)}) scale(${view.k.toFixed(3)})`);
  apply();
  const neighbours = nodes.map(() => new Set());
  links.forEach((l, i) => { const a = nodes.indexOf(l.a), b = nodes.indexOf(l.b); neighbours[a].add(b); neighbours[b].add(a); l.ia = a; l.ib = b; });
  const nodeEls = $$('.node', svg), lineEls = $$('line', svg);
  svg.onmouseover = (e) => {
    const g = e.target.closest('.node'); if (!g) return; const i = +g.dataset.i;
    nodeEls.forEach((el, j) => el.classList.toggle('dim', j !== i && !neighbours[i].has(j)));
    lineEls.forEach((el, j) => el.classList.toggle('dim', links[j].ia !== i && links[j].ib !== i));
  };
  svg.onmouseout = () => { nodeEls.forEach(el => el.classList.remove('dim')); lineEls.forEach(el => el.classList.remove('dim')); };
  let drag = null;
  svg.onpointerdown = (e) => { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: 0 }; svg.setPointerCapture(e.pointerId); };
  svg.onpointermove = (e) => {
    if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
    view.x = drag.vx + dx; view.y = drag.vy + dy; apply();
  };
  svg.onpointerup = (e) => {
    const was = drag; drag = null;
    if (!was || was.moved > 5) return;
    const g = document.elementFromPoint(e.clientX, e.clientY); const el = g && g.closest && g.closest('.node'); if (!el) return;
    const n = nodes[+el.dataset.i];
    if (n.type === 'tag') toggleTok('tag:' + n.id.slice(1)); else openNote(n.id);
  };
  svg.onwheel = (e) => {
    e.preventDefault(); const rect = svg.getBoundingClientRect(); const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const f = e.deltaY < 0 ? 1.15 : 1 / 1.15, nk = Math.max(0.2, Math.min(6, view.k * f)), r2 = nk / view.k;
    view.x = mx - (mx - view.x) * r2; view.y = my - (my - view.y) * r2; view.k = nk; apply();
  };
}

function promptForm({ title, fields, yes }) {
  return new Promise(resolve => {
    const root = $('#modal-root');
    root.innerHTML = `<div class="modal-back"><form class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>
      ${fields.map(f => `<div class="field"><label for="pf-${f.id}">${esc(f.label)}</label>${f.area
        ? `<textarea id="pf-${f.id}" rows="3" placeholder="${esc(f.ph || '')}">${esc(f.value || '')}</textarea>`
        : `<input type="text" id="pf-${f.id}" value="${esc(f.value || '')}" placeholder="${esc(f.ph || '')}">`}</div>`).join('')}
      <div class="row end"><button type="button" class="btn" data-no>Cancel</button><button type="submit" class="btn primary">${esc(yes)}</button></div></form></div>`;
    const done = (v) => { root.innerHTML = ''; resolve(v); };
    $('form', root).onsubmit = (e) => { e.preventDefault(); const out = {}; fields.forEach(f => out[f.id] = $('#pf-' + f.id, root).value.trim()); done(out); };
    $('[data-no]', root).onclick = () => done(null);
    $('input,textarea', root).focus();
  });
}
function convRaw(c) {
  const parts = Array.isArray(c.parts) && c.parts.length ? c.parts : null;
  if (!parts) return `<div class="chat"><p>${esc(c.text)}</p></div>`;
  const who = (r) => r === 'user' ? 'You' : r === 'assistant' ? 'AI' : r;
  return `<div class="chat">${parts.map(p => `<p><b>${esc(who(p.role))}:</b> ${esc(p.content)}</p>`).join('')}</div>`;
}

SCREENS.people = async function (soft) {
  const r = await api('/api/people'); state.people = r.people;
  if (!soft || !$('#pl')) {
    $('#main').innerHTML = `<div class="screen"><div class="head"><h1>People</h1><p>Everyone you have talked about or talked with, on any app.</p></div>
      <div class="split${state.personId ? ' sel' : ''}" id="split"><div class="plist card pad0">
        <div class="row" style="padding:12px 14px 8px"><input type="search" id="pl-q" class="grow" placeholder="Find a person" aria-label="Find a person" value="${esc(state.peopleQ)}">
          <button class="btn sm" data-act="add-person">Add</button></div><div id="pl"></div></div>
        <div class="pdetail" id="pd"></div></div></div>`;
  }
  renderPeopleList();
  if (state.personId && state.people.some(p => p.id === state.personId)) await showPerson(state.personId);
  else { state.personId = null; $('#split').classList.remove('sel'); $('#pd').innerHTML = state.people.length ? emptyBox('Pick someone', 'Choose a person on the left to see everything I know about them.') : emptyBox('No one yet', 'People appear here when you talk about them, or you can add someone yourself.'); }
};
function renderPeopleList() {
  const q = state.peopleQ.toLowerCase();
  const list = state.people.filter(p => !q || p.name.toLowerCase().includes(q) || p.aliases.some(a => a.toLowerCase().includes(q)));
  $('#pl').innerHTML = list.length ? `<ul class="list">${list.map(p => `<li><button class="person-row" data-act="pick-person" data-id="${esc(p.id)}"${p.id === state.personId ? ' aria-current="true"' : ''}>
    <div class="name">${esc(p.name)}</div><div class="sub">${esc([p.relation, plural(p.conversations, 'conversation'), p.platforms.join(', ')].filter(Boolean).join(' · '))}</div></button></li>`).join('')}</ul>`
    : `<p class="faint" style="padding:0 14px 14px">${state.people.length ? 'No one matches.' : 'No one yet.'}</p>`;
}
async function showPerson(id, editing) {
  state.personId = id; $('#split').classList.add('sel'); renderPeopleList();
  const pd = $('#pd'); pd.innerHTML = '<p class="skeleton">Loading…</p>';
  let p;
  try { p = await api('/api/people/' + enc(id)); } catch (e) { pd.innerHTML = `<div class="card"><p class="muted">${esc(e.message)}</p></div>`; return; }
  state.person = p;
  const head = editing ? `<div class="stack"><div class="field"><label for="pe-name">Name</label><input type="text" id="pe-name" value="${esc(p.name)}"></div>
      <div class="field"><label for="pe-rel">Who they are to you</label><input type="text" id="pe-rel" value="${esc(p.relation)}" placeholder="sister, friend, colleague…"></div>
      <div class="field"><label for="pe-alias">Also known as</label><input type="text" id="pe-alias" value="${esc(p.aliases.join(', '))}" placeholder="other names or nicknames, separated by commas"></div>
      <div class="field"><label for="pe-notes">Notes</label><textarea id="pe-notes" rows="4">${esc(p.notes)}</textarea></div>
      <div class="row end"><button class="btn" data-act="cancel-person">Cancel</button><button class="btn primary" data-act="save-person">Save</button></div></div>`
    : `<div class="row between"><div><h2>${esc(p.name)}</h2><p class="muted">${esc(p.relation || 'No relationship noted')}${p.aliases.length ? ' · also known as ' + esc(p.aliases.join(', ')) : ''}</p></div>
      <button class="btn sm" data-act="edit-person">Edit</button></div>
      <div class="row">${p.platforms.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>
      ${p.notes ? `<p>${esc(p.notes)}</p>` : '<p class="faint">No notes yet. Use Edit to add what matters about them.</p>'}`;
  const mems = p.memory_list.map(m => memRow({ id: m.id, text: m.text, category: m.category, when: when(m.created) })).join('');
  const convs = p.conversation_list.map(c => `<li class="mem" data-conv="${esc(c.id)}"><div class="row between"><div><span class="chip">${esc(c.platform)}</span> <span class="faint">${esc(day(c.created))}</span></div>
    <button class="btn ghost sm" data-act="read-conv" data-id="${esc(c.id)}">Read it</button></div><div class="t muted" style="margin-top:4px">${esc(c.preview)}${c.preview.length >= 160 ? '…' : ''}</div><div class="conv-raw"></div></li>`).join('');
  const others = p.others.map(o => `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('');
  $('#pd').innerHTML = `<div class="stack"><button class="btn ghost back" data-act="back-people">← All people</button>
    <div class="card">${head}</div>
    <div class="card pad0"><div class="sec" style="padding:14px 16px 0"><h3>What I remember about ${esc(p.name)}</h3><span class="count">${p.memory_list.length}</span></div>
      ${mems ? `<ul class="list">${mems}</ul>` : '<p class="faint" style="padding:0 16px 14px">Nothing yet. When you tell me about them, it shows up here.</p>'}</div>
    <div class="card pad0"><div class="sec" style="padding:14px 16px 0"><h3>Conversations</h3><span class="count">${p.conversation_list.length}</span></div>
      ${convs ? `<ul class="list">${convs}</ul>` : '<p class="faint" style="padding:0 16px 14px">No saved conversations with or about them yet.</p>'}</div>
    ${others ? `<div class="card"><h3>Is this the same person as someone else?</h3>
      <p class="muted">If ${esc(p.name)} also appears under another name, join the two profiles. Their notes and conversations are brought together. You can undo it from Review.</p>
      <div class="row"><select id="merge-with" style="flex:1 1 200px" aria-label="Same person as">${others}</select>
      <button class="btn" data-act="merge-person">Yes, same person</button></div></div>` : ''}
    <div class="card"><h3>Remove this profile</h3><p class="muted">Takes ${esc(p.name)} out of your people. I will not make a profile for that name again. You can undo it from Review.</p>
      <div class="row"><button class="btn danger" data-act="delete-person">Remove profile</button></div></div></div>`;
  if (editing) $('#pe-name').focus();
}

      <div id="entries"></div></div>`;
  }

};
function renderBio(editing) {
  const b = state.journal.biography; const el = $('#bio'); if (!el) return;
  const how = b.how === 'helper' ? `Written by AI from your memories · ${esc(when(b.updated))}`
    : b.how === 'you' ? `Edited by you · ${esc(when(b.updated))}. I will not change it unless you ask.`
    : b.how === 'outline' ? 'A plain outline for now. It becomes a proper biography as soon as an AI helper is available.' : '';
  let body;
  if (editing) {
    body = `<textarea id="bio-text" rows="14" aria-label="Biography">${esc(b.text)}</textarea>
      <div class="row end"><button class="btn" data-act="bio-cancel">Cancel</button><button class="btn primary" data-act="bio-save">Save</button></div>`;
  } else if (!b.text) {
    body = b.memories ? `<p class="muted">Nothing is written yet.</p><div class="row"><button class="btn primary" data-act="bio-rewrite">Write it now</button></div>`
      : `<p class="muted">Nothing to write about yet. Tell me about yourself and I will write your biography.</p>`;
  } else {
    body = `<div class="md">${md(b.text)}</div>
      <div class="row">${b.locked ? '<button class="btn" data-act="bio-unlock">Let AI update it again</button>' : ''}
      <button class="btn" data-act="bio-rewrite">${b.locked ? 'Rewrite it from scratch' : 'Rewrite now'}</button><button class="btn" data-act="bio-edit">Edit</button></div>`;
  }
  el.innerHTML = `<div class="row between"><h2>Your biography</h2></div><p class="faint">${how}</p>${body}
    ${!b.sensitive ? '<p class="faint">Health and money details are left out of this. You can include them in Settings.</p>' : ''}`;
}
function renderEntries() {
  const list = state.journal.entries; const el = $('#entries'); if (!el) return;
  list.forEach(e => { state.mem[e.id] = { id: e.id, text: e.text, noCat: true }; });
  el.innerHTML = list.length ? `<section><div class="sec"><h2>Entries <span class="count">${list.length}</span></h2></div><div class="card pad0"><ul class="list">${list.map(e =>
    `<li class="mem" data-mem="${esc(e.id)}"><div class="meta" style="margin:0 0 2px"><b>${esc(day(e.day))}</b>${e.by === 'AI' ? '<span>· written by AI</span>' : ''}</div><div class="t">${esc(e.text)}</div>
    <div class="acts"><button class="btn ghost sm" data-act="mem-edit" data-id="${esc(e.id)}">Edit</button><button class="btn ghost sm" data-act="mem-forget" data-id="${esc(e.id)}">Remove</button></div></li>`).join('')}</ul></div></section>`
    : emptyBox('No entries yet', 'Write about your day above. Entries are kept by date.');
}

SCREENS.me = async function () {
  const m = await api('/api/me');
  const secs = m.sections.map(s => {
    const rows = s.items.map(i => memRow({
      id: i.id, text: i.text, category: i.category, when: when(i.updated), by: i.by,
      extra: i.revisit_at ? `<span class="chip warn">${i.revisit_at <= localDay() ? 'Due ' : 'Come back '}${esc(day(i.revisit_at))}</span>` : '',
    })).join('');
    const inner = `<div class="card pad0"><ul class="list">${rows}</ul></div>`;
    return s.sensitive
      ? `<details class="card pad0"><summary class="sec" style="padding:14px 16px;cursor:pointer"><h2>${esc(s.title)} <span class="count">${s.items.length}</span> <span class="chip">Private, tap to show</span></h2></summary><ul class="list">${rows}</ul></details>`
      : section(s.title, s.items.length, inner);
  }).join('');
  $('#main').innerHTML = `<div class="screen"><div class="head"><h1>Me</h1><p>What matters about your life right now: what you are doing, planning and trying.</p></div>
    ${secs || emptyBox('Nothing here yet', 'As you talk to me, this fills up on its own.')}</div>`;
};

/* ==========================================================================
   Clicks and typing
   ========================================================================== */
const MSG = { new: 'Saved the new answer.', old: 'Kept what I had.', both: 'Kept both.', yes: 'Done.', no: 'Okay, kept them separate.', merge: 'Joined.', dismiss: 'Dismissed.', approve: 'Added.', deny: 'Skipped.', ok: 'Done.' };

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (el.tagName === 'A') e.preventDefault();
  switch (act) {
    case 'tab': return go(el.dataset.tab);
    case 'resume': return busy(el, async () => { await api('/api/anonymous', { method: 'POST', body: { anonymous: false } }); toast('Memory is back on.'); await refreshStatus(); refreshHere(); });
    case 'close-drawer': return closeDrawer();
    case 'open-note': return openNote(el.dataset.path);
    case 'note-edit': return openNote(state.note.path, true);
    case 'note-view': return openNote(state.note.path);
    case 'drawer-tag': closeDrawer(); if (state.tab !== 'vault') { await go('vault'); } return toggleTok('tag:' + el.dataset.tag);
    case 'note-save': return busy(el, async () => {
      const n = state.note; const body = { path: n.path };
      if (n.type === 'memory') { body.body = $('#ne-body').value; body.category = $('#ne-cat').value; }
      else { body.name = $('#ne-name').value; body.notes = $('#ne-notes').value; }
      const fresh = await api('/api/vault/note', { method: 'PUT', body });
      toast('Saved.'); await openNote(fresh.path || n.path); refreshHere();
    });
    case 'note-forget': {
      const n = state.note;
      if (!(await ask({ title: 'Forget this?', body: `“${esc(n.body)}”<br>I will stop using it. You can put it back from Review.`, yes: 'Forget it', danger: true }))) return;
      return busy(el, async () => { await api('/api/records/' + enc(n.id), { method: 'DELETE' }); toast('Forgotten.'); closeDrawer(); refreshHere(); });
    }
    case 'goto-person': closeDrawer(); state.personId = id; return go('people');
    case 'tell': return busy(el, async () => {
      const t = $('#tell').value.trim(); if (!t) { toast('Type something first.', true); return; }
      const r = await api('/api/tell', { method: 'POST', body: { text: t } });
      const m = $('#tell-msg'); m.textContent = r.message; m.className = 'msg ' + (r.ok ? 'good' : 'err');
      if (r.ok) $('#tell').value = '';
      await refreshStatus(); await SCREENS.review(true);
    });
    case 'doubt': return busy(el, async () => {
      await api(`/api/doubts/${enc(id)}/answer`, { method: 'POST', body: { answer: el.dataset.choice } });
      toast(MSG[el.dataset.choice] || 'Done.'); await SCREENS.review(true);
    });
    case 'unsure-keep': return busy(el, async () => { await api(`/api/unsure/${enc(id)}/keep`, { method: 'POST' }); toast('Kept.'); await SCREENS.review(true); });
    case 'unsure-skip': return busy(el, async () => { await api(`/api/unsure/${enc(id)}/skip`, { method: 'POST' }); toast('Dropped.'); await SCREENS.review(true); });
    case 'undo': return busy(el, async () => { await api('/api/undo/' + enc(el.dataset.seq), { method: 'POST' }); toast('Put back.'); await SCREENS.review(true); });

    case 'mem-edit': { const li = el.closest('[data-mem]'); return memEditor(li, state.mem[id]); }
    case 'mem-cancel': return refreshHere();
    case 'mem-save': return busy(el, async () => {
      const li = el.closest('[data-mem]'); const text = $('textarea', li).value.trim(); const sel = $('select', li);
      if (!text) { toast('A memory cannot be empty. Use Forget to remove it.', true); return; }
      const body = { body: text }; if (sel) body.category = sel.value;
      await api('/api/records/' + enc(id), { method: 'PUT', body });
      toast('Saved.');
      if (state.tab === 'journal') { await SCREENS.journal(true); } else { await refreshHere(); }
    });
    case 'mem-forget': {
      const m = state.mem[id] || {};
      if (!(await ask({ title: 'Forget this?', body: `“${esc(m.text || '')}”<br>I will stop using it. You can put it back from Review.`, yes: 'Forget it', danger: true }))) return;
      return busy(el, async () => {
        await api('/api/records/' + enc(id), { method: 'DELETE' }); toast('Forgotten.');
        if (state.tab === 'journal') { await SCREENS.journal(true); } else { await refreshHere(); }
      });
    }

    case 'tok': return toggleTok(el.dataset.tok, el.dataset.ex);
    case 'set-view': state.vview = el.dataset.view; return loadVault();
    case 'more-notes': state.vShow = (state.vShow || 200) + 200; return renderNoteList();

    case 'pick-person': return showPerson(id);
    case 'back-people': state.personId = null; return SCREENS.people(true);
    case 'add-person': {
      const v = await promptForm({ title: 'Add a person', yes: 'Add', fields: [{ id: 'name', label: 'Name' }, { id: 'relation', label: 'Who they are to you (optional)', ph: 'sister, friend, colleague…' }] });
      if (!v) return; if (!v.name) { toast('A person needs a name.', true); return; }
      try { const p = await api('/api/people', { method: 'POST', body: v }); state.personId = p.id; toast('Added.'); await SCREENS.people(true); } catch (err) { toast(err.message, true); }
      return;
    }
    case 'edit-person': return showPerson(state.personId, true);
    case 'cancel-person': return showPerson(state.personId);
    case 'save-person': return busy(el, async () => {
      const body = { name: $('#pe-name').value.trim(), relation: $('#pe-rel').value.trim(), notes: $('#pe-notes').value.trim(), aliases: $('#pe-alias').value.split(',').map(x => x.trim()).filter(Boolean) };
      if (!body.name) { toast('A person needs a name.', true); return; }
      await api('/api/people/' + enc(state.personId), { method: 'PUT', body }); toast('Saved.'); await SCREENS.people(true);
    });
    case 'read-conv': {
      const li = el.closest('[data-conv]'); const box = $('.conv-raw', li);
      if (box.innerHTML) { box.innerHTML = ''; el.textContent = 'Read it'; return; }
      return busy(el, async () => { const c = await api('/api/conversations/' + enc(id)); box.innerHTML = '<div style="margin-top:8px">' + convRaw(c) + '</div>'; el.textContent = 'Hide'; });
    }
    case 'merge-person': {
      const p = state.person; const other = $('#merge-with'); const o = p.others.find(x => x.id === other.value); if (!o) return;
      if (!(await ask({ title: 'Join these two profiles?', body: `<b>${esc(o.name)}</b> and <b>${esc(p.name)}</b> will become one profile, <b>${esc(p.name)}</b>. Their notes and conversations come together. You can undo this from Review.`, yes: 'Yes, same person' }))) return;
      return busy(el, async () => { await api('/api/people/merge', { method: 'POST', body: { keep_id: p.id, other_id: o.id } }); toast('Joined into one profile.'); await SCREENS.people(true); });
    }
    case 'delete-person': {
      const p = state.person;
      if (!(await ask({ title: `Remove ${p.name}?`, body: 'Their profile goes away and I will not make one for that name again. You can undo this from Review.', yes: 'Remove profile', danger: true }))) return;
      return busy(el, async () => { await api('/api/people/' + enc(p.id), { method: 'DELETE' }); toast('Removed.'); state.personId = null; await SCREENS.people(true); });
    }

    case 'bio-rewrite': {
      if (state.journal.biography.locked && !(await ask({ title: 'Rewrite your biography?', body: 'This replaces the version you edited.', yes: 'Rewrite it' }))) return;
      return busy(el, async () => { toast('Writing…'); state.journal.biography = await api('/api/journal/biography', { method: 'POST', body: { action: 'rewrite' } }); renderBio(); });
    }
    case 'bio-edit': return renderBio(true);
    case 'bio-cancel': return renderBio();
    case 'bio-save': return busy(el, async () => { state.journal.biography = await api('/api/journal/biography', { method: 'POST', body: { action: 'save', text: $('#bio-text').value } }); toast('Saved. I will not change it unless you ask.'); renderBio(); });
    case 'bio-unlock': return busy(el, async () => { state.journal.biography = await api('/api/journal/biography', { method: 'POST', body: { action: 'unlock' } }); toast('I can update it again.'); renderBio(); });
    case 'entry-add': return busy(el, async () => {
      const text = $('#j-text').value.trim(); if (!text) { toast('Write something first.', true); return; }
      const r = await api('/api/journal/entry', { method: 'POST', body: { text, day: $('#j-day').value || null } });
      state.journal.entries = r.entries; $('#j-text').value = ''; toast('Added.'); renderEntries();
    });

    case 'check-models': return busy(el, async () => {
      const r = await api('/api/settings/ai/models?address=' + enc($('#ai-addr').value.trim()));
      $('#ollama-models').innerHTML = r.models.map(m => `<option value="${esc(m)}">`).join('');
      $('#ai-models-msg').textContent = r.reachable ? `Found ${plural(r.models.length, 'model')}. Pick one from the list.` : 'I could not reach Ollama there. Check that it is running and the address is right.';
    });
    case 'save-ai': return busy(el, async () => {
      const mode = ($('input[name=aimode]:checked') || {}).value || 'auto';
      const body = { mode, meaning_model: $('#ai-embed').value.trim() };
      if (mode === 'custom') { body.address = $('#ai-addr').value.trim(); body.reading_model = $('#ai-model').value.trim(); }
      await api('/api/settings/ai', { method: 'POST', body }); toast('Saved.'); await SCREENS.settings();
    });
    case 'prepare-embed': return busy(el, async () => { $('#embed-msg').textContent = 'Working…'; const r = await api('/api/embed', { method: 'POST', body: {} }); $('#embed-msg').textContent = r.message; await refreshStatus(); });
    case 'save-never': return busy(el, async () => {
      const words = $('#never').value.split('\n').map(x => x.trim()).filter(Boolean);
      await api('/api/settings', { method: 'POST', body: { never_remember: words } }); toast('Saved.');
    });
    case 'bridge-start': case 'bridge-stop': return busy(el, async () => { await api('/api/proxy/' + act.slice(7), { method: 'POST' }); await SCREENS.settings(); });
    case 'import': return busy(el, doImport);
    case 'accept-originals': return busy(el, async () => { await api('/api/manifest', { method: 'POST' }); toast('Recorded again.'); await SCREENS.settings(); });
    case 'backup': return busy(el, async () => { const r = await api('/api/backup', { method: 'POST' }); $('#bk-msg').textContent = 'Saved: ' + r.name; });
    case 'tidy': return busy(el, async () => {
      $('#bk-msg').textContent = 'Working…'; const r = await api('/api/tidy', { method: 'POST' });
      const bad = r.steps.filter(s => s.ok === 'no').length;
      $('#bk-msg').textContent = bad ? 'Done, but a part did not finish. I will try again tonight.' : 'All tidy.'; await refreshStatus();
    });
  }
});

async function doImport() {
  const msg = $('#imp-msg'); const file = $('#imp-file').files[0]; const text = $('#imp-text').value.trim();
  if (!file && !text) { msg.textContent = 'Choose a file or paste some notes first.'; msg.className = 'msg err'; return; }
  msg.className = 'msg'; msg.textContent = 'Reading…';
  const body = {};
  if (file) {
    if (file.size > 100 * 1024 * 1024) { msg.textContent = 'That file is too big to bring in from here (over 100 MB).'; msg.className = 'msg err'; return; }
    body.name = file.name; body.data_b64 = b64(await file.arrayBuffer()); body.me = $('#imp-me').value.trim();
  } else { body.name = 'pasted notes'; body.text = text; }
  try {
    const r = await api('/api/import', { method: 'POST', body });
    msg.textContent = r.message || 'Done.'; msg.className = 'msg good';
    $('#imp-file').value = ''; $('#imp-text').value = ''; refreshStatus();
  } catch (e) { msg.textContent = e.message; msg.className = 'msg err'; }
}

document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.name === 'aimode') { $('#ai-custom').hidden = t.value !== 'custom'; $$('label.radio').forEach(l => l.classList.toggle('on', $('input', l).checked)); return; }
  if (t.dataset.graph) { state.vg[t.dataset.graph] = t.checked; return renderGraphView(); }
  if (t.dataset.opt) {
    const key = t.dataset.opt; t.disabled = true;
    try {
      if (key === 'paused') await api('/api/anonymous', { method: 'POST', body: { anonymous: t.checked } });
      else await api('/api/settings', { method: 'POST', body: { [key]: t.checked } });
      toast('Saved.'); await keepFields(() => SCREENS.settings());
    } catch (err) { t.checked = !t.checked; toast(err.message, true); }
    finally { t.disabled = false; }
  }
});
const onType = debounce((e) => {
  const t = e.target;
  if (t.id === 'rv-q') { state.rq = t.value; runSearch(); }
  else if (t.id === 'v-q') { state.vq = t.value.trim(); state.vShow = 200; loadVault(); }
  else if (t.id === 'pl-q') { state.peopleQ = t.value; renderPeopleList(); }
}, 280);
document.addEventListener('input', onType);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'tell') { e.preventDefault(); const b = $('[data-act=tell]'); if (b) b.click(); }
});

/* ---- start ---- */
(async function start() {
  renderTabs();
  try { await refreshStatus(); } catch (e) {}
  await go('review');
})();
</script>
</body>
</html>
