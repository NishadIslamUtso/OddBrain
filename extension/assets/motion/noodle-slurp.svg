<title id="ob-noodle-slurp-title">Oddbrain — One very long thought</title><desc id="ob-noodle-slurp-desc">Slurps one impossibly long noodle from a little bowl while trying to maintain its distinguished expression. Editable vector animation on a transparent background. Loops. Respects reduced motion.</desc>
