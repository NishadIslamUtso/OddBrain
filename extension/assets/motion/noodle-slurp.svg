#ob-noodle-slurp .rig-root,#ob-noodle-slurp .rig-head,#ob-noodle-slurp .rig-left-arm,#ob-noodle-slurp .rig-right-arm,#ob-noodle-slurp .rig-left-leg,#ob-noodle-slurp .rig-right-leg,#ob-noodle-slurp .rig-shoe-left,#ob-noodle-slurp .rig-shoe-right,#ob-noodle-slurp .rig-glasses,#ob-noodle-slurp .rig-mouth,#ob-noodle-slurp .lobe-left,#ob-noodle-slurp .lobe-right,#ob-noodle-slurp [class^="fx-"],#ob-noodle-slurp [class^="prop-"],#ob-noodle-slurp [class^="steam-"],#ob-noodle-slurp [class^="note-"],#ob-noodle-slurp .pupil-left,#ob-noodle-slurp .pupil-right {transform-box:view-box;}
#ob-noodle-slurp .rig-root {transform-origin:356px 640px;}
#ob-noodle-slurp .rig-head {transform-origin:356px 445px;}
#ob-noodle-slurp .rig-left-arm {transform-origin:151px 358px;}
#ob-noodle-slurp .rig-right-arm {transform-origin:580px 358px;}
#ob-noodle-slurp .rig-left-leg {transform-origin:259px 486px;}
#ob-noodle-slurp .rig-right-leg {transform-origin:418px 486px;}
#ob-noodle-slurp .rig-shoe-left {transform-origin:258px 610px;}
#ob-noodle-slurp .rig-shoe-right {transform-origin:423px 610px;}
#ob-noodle-slurp .rig-glasses {transform-origin:379px 267px;}
#ob-noodle-slurp .rig-mouth {transform-origin:379px 342px;}
#ob-noodle-slurp .lobe-left {transform-origin:208px 320px;}
#ob-noodle-slurp .lobe-right {transform-origin:489px 320px;}
#ob-noodle-slurp .pupil-left {transform-origin:294px 274px;}
#ob-noodle-slurp .pupil-right {transform-origin:470px 274px;}
#ob-noodle-slurp .rig-left-arm{transform:rotate(-76deg);}#ob-noodle-slurp .rig-right-arm{transform:rotate(86deg);}#ob-noodle-slurp .rig-right-arm{animation:ob-noodle-slurp-k1 calc(3.2s * var(--duration-scale,1)) cubic-bezier(.45,0,.55,1) calc(0s * var(--duration-scale,1)) infinite both;}#ob-noodle-slurp .rig-head{transform:translateY(0);}#ob-noodle-slurp .rig-head{animation:ob-noodle-slurp-k2 calc(3.2s * var(--duration-scale,1)) cubic-bezier(.45,0,.55,1) calc(0s * var(--duration-scale,1)) infinite both;}#ob-noodle-slurp .prop-noodle{stroke-dashoffset:0;opacity:1;}#ob-noodle-slurp .prop-noodle{animation:ob-noodle-slurp-k3 calc(3.2s * var(--duration-scale,1)) linear calc(0s * var(--duration-scale,1)) infinite both;}#ob-noodle-slurp .prop-chopsticks{transform:translateY(0);}#ob-noodle-slurp .prop-chopsticks{animation:ob-noodle-slurp-k4 calc(3.2s * var(--duration-scale,1)) cubic-bezier(.45,0,.55,1) calc(0s * var(--duration-scale,1)) infinite both;}#ob-noodle-slurp .rig-mouth{transform:scale(.7,1);}#ob-noodle-slurp .rig-mouth{animation:ob-noodle-slurp-k5 calc(0.8s * var(--duration-scale,1)) cubic-bezier(.45,0,.55,1) calc(0s * var(--duration-scale,1)) infinite both;}@keyframes ob-noodle-slurp-k1{0%,100%{transform:rotate(86deg);}65%{transform:rotate(103deg);}}@keyframes ob-noodle-slurp-k2{0%,100%{transform:translateY(0);}65%{transform:translateY(8px) rotate(2deg);}}@keyframes ob-noodle-slurp-k3{0%,100%{stroke-dashoffset:0;opacity:1;}75%{stroke-dashoffset:95;opacity:1;}85%,95%{stroke-dashoffset:100;opacity:0;}99%{stroke-dashoffset:0;opacity:0;}}@keyframes ob-noodle-slurp-k4{0%,100%{transform:translateY(0);}65%{transform:translate(-5px,-17px);}}@keyframes ob-noodle-slurp-k5{0%,100%{transform:scale(.7,1);}50%{transform:scale(1,.7);}}#ob-noodle-slurp *{animation-play-state:var(--play-state,running)!important;}@media(prefers-reduced-motion:reduce){#ob-noodle-slurp *{animation:none!important;}#ob-noodle-slurp .fx-flash{opacity:0;}}</style>
