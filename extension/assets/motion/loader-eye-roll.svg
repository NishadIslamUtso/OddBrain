<svg xmlns="http://www.w3.org/2000/svg" id="ob-loader" viewBox="0 0 96 96" width="96" height="96" fill="none" role="img" aria-labelledby="ob-loader-title ob-loader-desc"><title id="ob-loader-title">Oddbrain eye-roll loader</title><desc id="ob-loader-desc">A small pink brain with raised glasses and two orbiting pupils. Transparent, looping, and reduced-motion aware.</desc><style>#ob-loader .pupil-a,#ob-loader .pupil-b{transform-box:view-box;animation:ob-loader-orbit calc(1.2s * var(--duration-scale,1)) linear infinite;animation-play-state:var(--play-state,running)}#ob-loader .pupil-a{transform-origin:34px 54px}#ob-loader .pupil-b{transform-origin:62px 54px}@keyframes ob-loader-orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#ob-loader *{animation:none!important}}</style><path d="M48 21 C39 9 24 13 16 23 C4 38 5 65 18 77 C27 86 41 85 48 75 C55 85 69 86 78 77 C91 65 92 38 80 23 C72 13 57 9 48 21Z" fill="#FFAFB8"/><path d="M48 21q-6 8-3 16m4 29q3 8-1 13M22 31q-8 4-6 13m63-13q6 5 4 14M17 61q-5 9 4 11m58-11q5 9-4 11" stroke="#EE818D" stroke-width="3" stroke-linecap="round"/><g transform="rotate(-6 48 30)"><path d="M22 26h21l-2 11H26Zm31 0h21l-4 11H55Z" fill="#263039" stroke="#222625" stroke-width="4" stroke-linejoin="round"/><path d="M43 28h10m-31-1-5 1m57-1 5 2" stroke="#222625" stroke-width="4" stroke-linecap="round"/></g><circle cx="34" cy="54" r="10" fill="#FFF9F1" stroke="#393A35" stroke-width="2.5"/><circle cx="62" cy="54" r="10" fill="#FFF9F1" stroke="#393A35" stroke-width="2.5"/><g class="pupil-a"><circle cx="34" cy="50" r="4" fill="#393A35"/></g><g class="pupil-b"><circle cx="62" cy="50" r="4" fill="#393A35"/></g><path d="M43 69q7 4 13-2" stroke="#393A35" stroke-width="2.5" stroke-linecap="round"/></svg>