# electron-builder.yml — how OddBrain becomes something a person can install.
#
# Deliberately small, and every line here is a decision rather than a default:
#
# - The app payload is `out/` plus only production runtime dependencies. React
#   is bundled into the renderer; document/media readers used by the main process
#   remain runtime packages. Source maps and TypeScript sources are explicitly
#   excluded from both the app and dependency payload.
# - `asar` on, so the app's own files are not laid out loose in the install
#   directory where a stray edit by hand would change behaviour silently.
# - One target: NSIS. Per-user, not per-machine, so installing does not ask for
#   administrator rights; and it lets the person choose the folder, because an app
#   that writes notes into a vault is an app whose owner will have opinions about
#   where it lives.
# - The protected release job supplies CSC_LINK and CSC_KEY_PASSWORD and blocks
#   public/tagged output unless Authenticode verifies. Ordinary branch builds may
#   remain unsigned test artifacts; they are never published as releases.
appId: com.oddbrain.desktop
productName: OddBrain
copyright: Copyright © 2026 NishadIslamUtso

directories:
  output: dist
  # `resources/` holds the app's own mark — `icon.png` and a seven-size
  # `icon.ico` — rendered from the BrainMark component the app already draws (see
  # shot-tools/render-mark.cjs). Nothing about the artwork is authored for the
  # installer, and no second logo exists.
  #
  # It is `resources/` and not `build/` on purpose: `build/` is this project's
  # build-output name, and the workspace snapshots exclude any directory with that
  # name, which quietly deleted the icon twice. An icon is source.
  buildResources: resources

# What goes in: the built app, and the package file Electron reads for its name,
# version and entry point.
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'
  - '!**/*.tsx'
  - '!**/test/**'
  - '!**/tests/**'
# Native bindings must remain real files for Windows to load. This is explicit
# rather than relying on electron-builder's smart-unpack heuristic.
asarUnpack:
  - node_modules/**/*.node

# The browser extension ships with the app: it lands in the install folder as
# `resources/extension` so "Load unpacked" at chrome://extensions has a folder to
# point at. It is not packed into the asar — Chrome needs real files on disk.
extraResources:
  - from: ../../THIRD_PARTY_NOTICES
    to: THIRD_PARTY_NOTICES
  - from: resources/oddbrain-preview.html
    to: oddbrain-preview.html
  - from: ../../extension
    to: extension
    filter:
      - manifest.json
      - background.js
      - content-scripts/**
      - lib/**
      - popup/**
      - icons/**
      - assets/**
  # The community store ships with the app too: a real folder index at
  # resources/store, so the Plugins pane offers packs that exist on the
  # person's disk from the first run — offline, no account, no network.
  - from: store
    to: store

# The app is written in English, so the other 54 Chromium locale files (46 MB
# unpacked) are not shipped. A person who needs another language is better served
# by a real translation than by Chromium's menus.
electronLanguages:
  - en-US

# Maximum, because an installer is downloaded: this is the difference between a
# 92 MB file and a smaller one, at the cost of a slower build.
compression: maximum

# Nothing to rebuild: the app has no native modules. Saying so skips a step that
# would otherwise run for every build and fail on a machine without toolchains.
npmRebuild: false

# The interface is served from the app's own process over http, so the packaged
# build must not be sandboxed away from loopback.
asar: true
# Fuses are flipped on the packaged binary by @electron/fuses (scripts/apply-fuses.cjs):
# no ELECTRON_RUN_AS_NODE, NODE_OPTIONS or --inspect in production; only app.asar
# can load, with embedded ASAR integrity enabled on platforms that support it.
afterPack: scripts/apply-fuses.cjs

win:
  target:
    - target: nsis
      arch:
        - x64
  # The .ico carries every size Windows asks for (16 → 256) instead of one big
  # PNG it has to scale, which is how a taskbar icon goes blurry.
  icon: resources/icon.ico
  # electron-builder signs whenever the protected job supplies CSC_LINK and
  # CSC_KEY_PASSWORD. The release job separately refuses an absent/invalid
  # Authenticode signature before uploading anything publicly.
  signAndEditExecutable: true
  signtoolOptions:
    signingHashAlgorithms:
      - sha256

nsis:
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  # ONE CLICK, as the owner ordered 2026-10-15: double-click the file, it
  # installs without a single question and opens the app when done. The folder
  # choice was dropped for this — the owner's words outrank the old comment.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OddBrain
  artifactName: OddBrain-Setup-${version}.exe
  # Uninstall leaves the person's own data alone. The vault lives where they chose
  # it, and the app's settings live in the user's app-data folder — neither is the
  # installer's business to remove.
  deleteAppDataOnUninstall: false
