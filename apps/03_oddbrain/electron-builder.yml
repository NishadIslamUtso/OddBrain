# UI-first desktop package. Only the compiled app ships; no engine or extension is bundled.
appId: com.oddbrain.desktop
productName: OddBrain
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
electronLanguages:
  - en-US
compression: maximum
afterPack: scripts/apply-fuses.cjs
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: OddBrain-Setup-${version}.${ext}
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
