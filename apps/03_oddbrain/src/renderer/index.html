<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      A Content-Security-Policy is set deliberately: no remote scripts, no remote
      fonts, no eval. This app is local-first, so 'self' plus inline styles (which
      Tailwind and React need) is the whole allowlist it should ever want.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <!-- Inline artwork, no network request: the app has to open with no connection. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>OddBrain</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
