# Validate the UI-first desktop rebuild on Linux and Windows. A green browser build
# alone is not evidence that Electron's preload and the packaged renderer work.
name: checks
on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/03_oddbrain/package-lock.json
      - name: Install
        working-directory: apps/03_oddbrain
        run: npm ci --no-audit --no-fund
      - name: Types and formatting
        working-directory: apps/03_oddbrain
        run: npm run typecheck && npm run format:check
      - name: Tests
        working-directory: apps/03_oddbrain
        run: npm test
      - name: Build desktop and browser preview
        working-directory: apps/03_oddbrain
        run: npm run build && npm run build:web
      - name: Native window smoke
        working-directory: apps/03_oddbrain
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libnss3 libnspr4 libasound2t64
          xvfb-run -a npm run smoke

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/03_oddbrain/package-lock.json
      - name: Install
        working-directory: apps/03_oddbrain
        run: npm ci --no-audit --no-fund
      - name: Types and formatting
        working-directory: apps/03_oddbrain
        run: npm run typecheck && npm run format:check
      - name: Tests
        working-directory: apps/03_oddbrain
        run: npm test
      - name: Build desktop and browser preview
        working-directory: apps/03_oddbrain
        run: npm run build && npm run build:web
      - name: Native window smoke
        working-directory: apps/03_oddbrain
        timeout-minutes: 5
        run: npm run smoke
