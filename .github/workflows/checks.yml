# The gate, on every push, on both operating systems. Linux always ran it;
# Windows (the target OS) joined 2026-10-17 as allow-failure until it ran
# green once — and when it did, the training wheels came off the same day.
# A red X here fails the push now. It earned that.
name: checks
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: apps/03_oddbrain
        run: npm install --no-audit --no-fund
      - name: Types
        working-directory: apps/03_oddbrain
        run: npx tsc --noEmit -p tsconfig.json
      # Installed before the suite runs, so the browser-only test is a real test
      # here instead of a permanent skip. It reads a page through the real
      # content reader into a real temporary vault.
      - name: Browser for the browser-only tests
        working-directory: apps/03_oddbrain
        run: |
          npx playwright-core install --with-deps chromium
          printf '{"headless":true}\n' > browser-options.json
      - name: Tests
        working-directory: apps/03_oddbrain
        env:
          ODDBRAIN_BROWSER_OPTIONS: browser-options.json
        run: npx vitest run --reporter=default --reporter=junit --outputFile=junit-linux.xml
      # A skipped test passes the step it is in. This makes "green" mean every
      # test that exists on this OS actually ran.
      - name: No test may quietly skip, and the browser suite must exist
        working-directory: apps/03_oddbrain
        run: |
          node -e '
            const xml = require("fs").readFileSync("junit-linux.xml", "utf8");
            const skipped = [...xml.matchAll(/skipped="(\d+)"/g)].reduce((n, m) => n + Number(m[1]), 0);
            if (skipped) { console.error("skipped tests: " + skipped); process.exit(1); }
            const suite = xml.match(/<testsuite name="tests\/conversation-runner\.test\.ts"[^>]*>/);
            if (!suite) { console.error("the browser-only reader suite did not run"); process.exit(1); }
            if (/tests="0"/.test(suite[0])) { console.error("the browser-only reader suite ran no test"); process.exit(1); }
            console.log("no skipped tests; " + suite[0].match(/tests="\d+"/)[0] + " in the browser suite");
          '
      - name: Linux speaks
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = 'apps/03_oddbrain/junit-linux.xml';
            if (fs.existsSync(p)) {
              const raw = fs.readFileSync(p, 'utf8');
              const lines = [];
              for (const suite of raw.split(/(?=<testsuite )/)) {
                const head = suite.match(/<testsuite name="([^"]+)"[^>]*failures="(\d+)" errors="(\d+)"/);
                if (!head || (head[2] === '0' && head[3] === '0')) continue;
                lines.push('FAILED SUITE ' + head[1] + ' (' + head[2] + ' failures, ' + head[3] + ' errors)');
                for (const m of suite.matchAll(/<testcase classname="[^"]*" name="([^"]*)"[^>]*>\s*<failure message="([^"]*)"/g)) {
                  lines.push('  - ' + m[1] + ' — ' + m[2].slice(0, 800));
                }
              }
              if (lines.length) {
                let body = lines.join('\n');
                if (body.length > 40000) body = body.slice(0, 40000) + '\n...truncated';
                await github.rest.repos.createCommitComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  commit_sha: context.sha,
                  body: 'linux failures, in its own words:\n\n' + body
                });
              }
            }
      # The extension's popup and companion, against the preview server that
      # serves the real files. Browser-only, so it never ran on a push before.
      - name: The extension companion, in a real browser
        working-directory: extension
        env:
          ODDBRAIN_BROWSER_OPTIONS: ${{ github.workspace }}/apps/03_oddbrain/browser-options.json
        run: |
          node scripts/preview-server.cjs & server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5175/ >/dev/null && break; sleep 0.5; done
          node scripts/check-browser.cjs
      - name: Build
        working-directory: apps/03_oddbrain
        run: npm run build
      - name: Browser preview build
        working-directory: apps/03_oddbrain
        run: npm run build:web
      - name: Smoke — the window opens and the console is clean
        working-directory: apps/03_oddbrain
        timeout-minutes: 5
        env:
          ELECTRON_DISABLE_SANDBOX: 1
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libnss3 libnspr4 libasound2t64
          xvfb-run -a npx electron . --smoke

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: apps/03_oddbrain
        run: npm ci --no-audit --no-fund
      - name: Types
        working-directory: apps/03_oddbrain
        run: npx tsc --noEmit -p tsconfig.json
      - name: Tests
        working-directory: apps/03_oddbrain
        run: npx vitest run --reporter=default --reporter=junit --outputFile=junit-windows.xml
      # Windows has no Chromium here, so exactly one test may skip: the browser
      # fixture. Anything else that starts skipping is a change nobody asked
      # for, and would otherwise pass as green.
      - name: Exactly one permitted skip
        working-directory: apps/03_oddbrain
        run: |
          node -e '
            const xml = require("fs").readFileSync("junit-windows.xml", "utf8");
            const suites = [...xml.matchAll(/<testsuite name="([^"]+)"[^>]*skipped="(\d+)"/g)].filter(m => Number(m[2]));
            const total = suites.reduce((n, m) => n + Number(m[2]), 0);
            if (total !== 1 || suites.length !== 1 || !suites[0][1].endsWith("conversation-runner.test.ts")) {
              console.error("unexpected skips: " + JSON.stringify(suites.map(m => [m[1], m[2]])));
              process.exit(1);
            }
            console.log("one skip, and it is the browser fixture");
          '
      - name: Windows speaks
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = 'apps/03_oddbrain/junit-windows.xml';
            if (fs.existsSync(p)) {
              const raw = fs.readFileSync(p, 'utf8');
              const lines = [];
              for (const suite of raw.split(/(?=<testsuite )/)) {
                const head = suite.match(/<testsuite name="([^"]+)"[^>]*failures="(\d+)" errors="(\d+)"/);
                if (!head || (head[2] === '0' && head[3] === '0')) continue;
                lines.push('FAILED SUITE ' + head[1] + ' (' + head[2] + ' failures, ' + head[3] + ' errors)');
                for (const m of suite.matchAll(/<testcase classname="[^"]*" name="([^"]*)"[^>]*>\s*<failure message="([^"]*)"/g)) {
                  lines.push('  - ' + m[1] + ' — ' + m[2].slice(0, 800));
                }
              }
              if (lines.length) {
                let body = lines.join('\n');
                if (body.length > 40000) body = body.slice(0, 40000) + '\n...truncated';
                await github.rest.repos.createCommitComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  commit_sha: context.sha,
                  body: 'windows failures, in its own words:\n\n' + body
                });
              }
            }
      - name: Build
        working-directory: apps/03_oddbrain
        run: npm run build
      - name: Smoke — the window opens and the console is clean
        working-directory: apps/03_oddbrain
        timeout-minutes: 5
        shell: pwsh
        run: npx electron . --smoke
