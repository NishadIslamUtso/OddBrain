# Non-test validation only. The previous automated test suite was removed on
# 2026-10-21 because its results were not trusted; replacement tests must be
# designed after the connected product is confirmed.
name: checks
on:
  push:
    branches: [main, v3]
  pull_request:
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Install
        working-directory: apps/03_oddbrain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Electron runtime explicitly
        working-directory: apps/03_oddbrain
        run: node node_modules/electron/install.js
      - name: Types
        working-directory: apps/03_oddbrain
        run: npm run typecheck
      - name: Security policy invariants
        working-directory: apps/03_oddbrain
        run: npm run security:policy
      - name: Build
        working-directory: apps/03_oddbrain
        run: npm run build
      - name: Browser preview build
        working-directory: apps/03_oddbrain
        run: npm run build:web
      - name: Inspect release build output
        working-directory: apps/03_oddbrain
        run: npm run security:release

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Install
        working-directory: apps/03_oddbrain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Electron runtime explicitly
        working-directory: apps/03_oddbrain
        run: node node_modules/electron/install.js
      - name: Types
        working-directory: apps/03_oddbrain
        run: npm run typecheck
      - name: Security policy invariants
        working-directory: apps/03_oddbrain
        run: npm run security:policy
      - name: Build
        working-directory: apps/03_oddbrain
        run: npm run build
      - name: Browser preview build
        working-directory: apps/03_oddbrain
        run: npm run build:web
      - name: Inspect Windows release build output
        working-directory: apps/03_oddbrain
        run: npm run security:release
