name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Electron and Xvfb system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libnss3 libnspr4 libasound2t64 libatk-bridge2.0-0 libgtk-3-0
      - name: Exact ordered gate and real scrolling smoke
        run: xvfb-run -a node scripts/verify-gate.cjs
      - name: Gate contract tests
        run: node --test tests/verification-gate.test.cjs
      - name: Actual offline decoder workers
        working-directory: apps/03_oddbrain
        run: node scripts/check-media-native.cjs
      - name: Install matching test browser
        working-directory: apps/03_oddbrain
        run: npx playwright-core install --with-deps chromium
      - name: Actual renderer checks (fixture limitations recorded)
        run: node scripts/verify-renderer.cjs
      - name: Built Electron automation with local CLI and HTTP fixtures
        run: xvfb-run -a node scripts/verify-electron.cjs
      - name: Verification evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-linux-${{ github.sha }}
          path: |
            ${{ runner.temp }}/oddbrain-verification/*.json
            ${{ runner.temp }}/oddbrain-verification/*.log
            ${{ runner.temp }}/oddbrain-verification/*.png
            ${{ runner.temp }}/oddbrain-verification/renderer
          if-no-files-found: warn
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact ordered gate and real scrolling smoke
        run: node scripts/verify-gate.cjs
      - name: Gate contract tests
        run: node --test tests/verification-gate.test.cjs
      - name: Actual offline decoder workers
        working-directory: apps/03_oddbrain
        run: node scripts/check-media-native.cjs
      - name: Install matching test browser
        working-directory: apps/03_oddbrain
        run: npx playwright-core install chromium
      - name: Actual renderer checks (fixture limitations recorded)
        run: node scripts/verify-renderer.cjs
      - name: Verification evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-windows-${{ github.sha }}
          path: |
            ${{ runner.temp }}/oddbrain-verification/*.json
            ${{ runner.temp }}/oddbrain-verification/*.log
            ${{ runner.temp }}/oddbrain-verification/*.png
            ${{ runner.temp }}/oddbrain-verification/renderer
          if-no-files-found: warn
          retention-days: 14
