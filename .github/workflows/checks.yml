name: checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        timeout-minutes: 8
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Repository and application regressions
        timeout-minutes: 6
        run: npm test
      - name: Production builds
        timeout-minutes: 5
        run: npm run build && npm run build:web
      - name: Install browser and Linux display dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: timeout --kill-after=10s 240s npx playwright-core install --with-deps chromium
      - name: Full browser acceptance including isolated engine and graph fixtures
        if: runner.os == 'Linux'
        timeout-minutes: 6
        shell: bash
        env:
          ODDBRAIN_UI_URL: http://127.0.0.1:5174/
          ODDBRAIN_QA_DIR: qa-ui/development
        run: |
          set -euo pipefail
          npm run dev:web > browser-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          timeout 45s bash -c 'until curl --connect-timeout 2 --max-time 3 -fsS http://127.0.0.1:5174/ >/dev/null; do sleep 1; done'
          timeout --kill-after=10s 300s npm run test:ui
      - name: Production browser acceptance without source-module injection
        if: runner.os == 'Linux'
        timeout-minutes: 6
        shell: bash
        env:
          ODDBRAIN_UI_URL: http://127.0.0.1:4174/
          ODDBRAIN_QA_DIR: qa-ui/production
        run: |
          set -euo pipefail
          npm run preview:web --workspace apps/desktop > production-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          timeout 45s bash -c 'until curl --connect-timeout 2 --max-time 3 -fsS http://127.0.0.1:4174/ >/dev/null; do sleep 1; done'
          timeout --kill-after=10s 300s npm run test:ui:production
      - name: Linux desktop smoke
        if: runner.os == 'Linux'
        timeout-minutes: 3
        env:
          ELECTRON_DISABLE_SANDBOX: 1
        run: xvfb-run -a npm run smoke
      - name: Windows desktop smoke
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: npm run smoke
      - name: Browser evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: |
            apps/desktop/qa-ui
            browser-server.log
            production-server.log
          if-no-files-found: ignore
