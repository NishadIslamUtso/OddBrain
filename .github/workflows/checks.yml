# NOTE (2026-10-21): the automated test steps (vitest, browser/UI suites, the
# extension Chromium check and the junit coverage gate) were removed on purpose on
# this branch because the old suite was largely broken; tests are to be rebuilt.
# Until they return this gate is: types, security policy, build, release-output
# inspection and the native launch smoke. It is NOT a behavioural test gate.
# The gate, once per pull request (and on long-lived branch pushes), on both
# operating systems. Linux always ran it; Windows (the target OS) joined
# 2026-10-17 as allow-failure until it ran green once — and when it did, the
# training wheels came off the same day. A red X fails the gate now.
name: checks
on:
  # Pull requests get one check set. Push runs are only for long-lived branches;
  # running both events for the same PR head left cancelled duplicate jobs on the
  # commit and made GitHub's Branches page report a misleading red 6/9.
  push:
    branches: [main, v3]
  pull_request:
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Install
        working-directory: apps/03_oddbrain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Electron runtime explicitly
        working-directory: apps/03_oddbrain
        run: node node_modules/electron/install.js
      - name: Types
        working-directory: apps/03_oddbrain
        run: npx tsc --noEmit -p tsconfig.json
      - name: Security policy invariants
        working-directory: apps/03_oddbrain
        run: npm run security:policy
      - name: Build
        working-directory: apps/03_oddbrain
        run: npm run build
      - name: Browser preview build
        working-directory: apps/03_oddbrain
        run: npm run build:web
      - name: Inspect release build output
        working-directory: apps/03_oddbrain
        run: npm run security:release
      - name: Smoke — the window opens and the console is clean
        id: native-smoke
        working-directory: apps/03_oddbrain
        timeout-minutes: 5
        env:
          ELECTRON_DISABLE_SANDBOX: 1
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libnss3 libnspr4 libasound2t64
          started=$(date +%s%3N)
          xvfb-run -a npx electron . --smoke 2>&1 | tee native-smoke.log
          elapsed=$(($(date +%s%3N)-started))
          ready=$(grep -o '\[startup\] first window ready in [0-9]* ms' native-smoke.log | tail -1 || true)
          echo "Linux ${ready:-startup-ready marker missing}; smoke process duration: ${elapsed} ms" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-smoke-linux
          path: apps/03_oddbrain/native-smoke.log
          if-no-files-found: warn


  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Install
        working-directory: apps/03_oddbrain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Electron runtime explicitly
        working-directory: apps/03_oddbrain
        run: node node_modules/electron/install.js
      - name: Types
        working-directory: apps/03_oddbrain
        run: npx tsc --noEmit -p tsconfig.json
      - name: Security policy invariants
        working-directory: apps/03_oddbrain
        run: npm run security:policy
      - name: Build
        working-directory: apps/03_oddbrain
        run: npm run build
      - name: Browser preview build
        working-directory: apps/03_oddbrain
        run: npm run build:web
      - name: Inspect Windows release build output
        working-directory: apps/03_oddbrain
        run: npm run security:release
      - name: Smoke — the window opens and the console is clean
        working-directory: apps/03_oddbrain
        timeout-minutes: 5
        shell: pwsh
        run: |
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          npx electron . --smoke 2>&1 | Tee-Object -FilePath native-smoke.log
          $code = $LASTEXITCODE
          $watch.Stop()
          $ready = Select-String -Path native-smoke.log -Pattern '\[startup\] first window ready in [0-9]+ ms' | Select-Object -Last 1
          $readyText = if ($ready) { $ready.Matches[0].Value } else { 'startup-ready marker missing' }
          "Windows $readyText; smoke process duration: $($watch.ElapsedMilliseconds) ms" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $code
      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-smoke-windows
          path: apps/03_oddbrain/native-smoke.log
          if-no-files-found: warn
