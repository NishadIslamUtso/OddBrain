name: security
on:
  pull_request:
  push:
    branches: [main, v3]

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Review dependency changes when the repository dependency graph is enabled
        id: dependency-review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
      - name: Report unavailable or failed dependency review
        if: steps.dependency-review.outcome == 'failure'
        shell: bash
        run: |
          echo '::warning::Dependency review could not enforce this change. Enable the repository dependency graph, then inspect the dependency-review action result before merging.'
          echo '## Dependency review needs repository attention' >> "$GITHUB_STEP_SUMMARY"
          echo 'The pinned review action could not enforce this change. Enable the repository dependency graph and inspect dependency changes before merging.' >> "$GITHUB_STEP_SUMMARY"

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
