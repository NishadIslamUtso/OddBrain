# Manual alpha package only. Do not auto-publish an installer until this rebuild
# has passed a real Windows acceptance run on the owner's machine.
name: Windows alpha package
on:
  workflow_dispatch:

jobs:
  windows-package:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/03_oddbrain/package-lock.json
      - name: Install
        working-directory: apps/03_oddbrain
        run: npm ci --no-audit --no-fund
      - name: Test
        working-directory: apps/03_oddbrain
        run: npm run typecheck && npm test
      - name: Build unsigned Windows installer
        working-directory: apps/03_oddbrain
        run: npm run dist:win
      - name: Write installer SHA-256
        working-directory: apps/03_oddbrain
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter 'OddBrain-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No installer was built.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Out-File -Encoding ascii "$($installer.FullName).sha256"
          Add-Content $env:GITHUB_STEP_SUMMARY "Unsigned alpha package: $($installer.Name)"
          Add-Content $env:GITHUB_STEP_SUMMARY "SHA-256: $hash"
      - name: Upload alpha installer (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: OddBrain-alpha-${{ github.sha }}
          path: |
            apps/03_oddbrain/dist/OddBrain-Setup-*.exe
            apps/03_oddbrain/dist/OddBrain-Setup-*.exe.sha256
          retention-days: 30
          if-no-files-found: error
