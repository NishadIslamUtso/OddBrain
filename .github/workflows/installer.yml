# The installer, made by machines: every push to v3 or main packages the
# Windows exe on a real Windows runner and uploads it as an artifact anyone
# (the owner, a judge) can download from the run page - no local build needed.
# Push a tag v* and the exe + its sha256 attach to a GitHub Release.
name: installer
on:
  push:
    branches: [v3, main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact ordered install, types, unit, build and scroll gate
        env:
          ODDBRAIN_VERIFY_DIR: ${{ runner.temp }}/oddbrain-verification
        run: node scripts/verify-gate.cjs
      - name: Build UNSIGNED installer (unknown publisher) and verify actual packaged executable
        env:
          ODDBRAIN_VERIFY_DIR: ${{ runner.temp }}/oddbrain-verification
        run: node scripts/verify-package.cjs
      - name: Verification evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/oddbrain-verification/*.json
            ${{ runner.temp }}/oddbrain-verification/*.log
          retention-days: 30
          if-no-files-found: warn
      - name: Upload UNSIGNED installer — unknown publisher (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: OddBrain-Setup-${{ github.sha }}
          path: |
            apps/03_oddbrain/dist/OddBrain-Setup-0.9.0.exe
            apps/03_oddbrain/dist/OddBrain-Setup-0.9.0.exe.sha256
          retention-days: 30
          if-no-files-found: error
      - name: Attach to the release (on a version tag only)
        working-directory: apps/03_oddbrain
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" --generate-notes --title "OddBrain $env:GITHUB_REF_NAME" dist/OddBrain-Setup-0.9.0.exe dist/OddBrain-Setup-0.9.0.exe.sha256
