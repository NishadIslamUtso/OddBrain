# The installer, made by machines: every push to v3 or main packages the
# Windows exe on a real Windows runner and uploads it as an artifact anyone
# (the owner, a judge) can download from the run page - no local build needed.
# Push a tag v* and the exe + its sha256 attach to a GitHub Release.
name: installer
on:
  push:
    branches: [v3, main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Install
        working-directory: apps/03_oddbrain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Electron runtime explicitly
        working-directory: apps/03_oddbrain
        run: node node_modules/electron/install.js
      - name: Security policy invariants
        working-directory: apps/03_oddbrain
        run: npm run security:policy
      - name: Build and package the installer
        working-directory: apps/03_oddbrain
        run: npm run dist:win
      - name: Generate dependency SBOM
        working-directory: apps/03_oddbrain
        shell: pwsh
        run: npm sbom --sbom-format cyclonedx | Out-File -Encoding utf8 dist/oddbrain-sbom.cdx.json
      - name: Prove it - sha256 into the summary
        working-directory: apps/03_oddbrain
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/OddBrain-Setup-0.9.0.exe -Algorithm SHA256).Hash.ToLower()
          "$h  OddBrain-Setup-0.9.0.exe" | Out-File -Encoding ascii dist/OddBrain-Setup-0.9.0.exe.sha256
          Add-Content $env:GITHUB_STEP_SUMMARY "## Installer built"
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          Add-Content $env:GITHUB_STEP_SUMMARY "sha256: $h"
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
      - name: Verify packaged Electron fuses
        working-directory: apps/03_oddbrain
        run: npm run security:fuses
      - name: Inspect final packaged release output
        working-directory: apps/03_oddbrain
        run: npm run security:installer
      - name: Attest installer build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: apps/03_oddbrain/dist/OddBrain-Setup-0.9.0.exe
      - name: Upload the artifact (30 days)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: OddBrain-Setup-${{ github.sha }}
          path: |
            apps/03_oddbrain/dist/OddBrain-Setup-0.9.0.exe
            apps/03_oddbrain/dist/OddBrain-Setup-0.9.0.exe.sha256
            apps/03_oddbrain/dist/oddbrain-sbom.cdx.json
          retention-days: 30
          if-no-files-found: error
      - name: Attach to the release (on a version tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" --generate-notes --title "OddBrain $env:GITHUB_REF_NAME" dist/OddBrain-Setup-0.9.0.exe dist/OddBrain-Setup-0.9.0.exe.sha256 dist/oddbrain-sbom.cdx.json
