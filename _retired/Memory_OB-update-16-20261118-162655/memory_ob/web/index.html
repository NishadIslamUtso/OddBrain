<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory_OB</title>
<style>
/* ---------------------------------------------------------------------------
   Colours.
   Every colour on this page is OPAQUE. The values below are only what shows for
   a split second before the script runs; the script then reads the host app's
   colours (or the system light/dark setting), turns them into solid colours,
   and nudges text, borders and buttons until they can be read comfortably.
   The host can inject its own values for --bg, --text, etc. after this block.
   --------------------------------------------------------------------------- */
:root {
  color-scheme: dark;
  --bg: #17181c; --bg-2: #1f2127; --bg-3: #292c34;
  --stroke: #3a3e48; --stroke-2: #4b505c; --edge: #59606e;
  --text: #f1f2f5; --text-2: #c9ccd4; --text-3: #a4a9b5;
  --accent: #8fa3ff; --accent-text: #a9b8ff; --on-accent: #10131f;
  --danger: #ff8f8f; --danger-bg: #3a2326;
  --ok: #6fd39a; --ok-bg: #1f3329;
  --warn: #f0c46a; --warn-bg: #38301d;
  --c0: #8fa3ff; --c1: #6fd39a; --c2: #f0c46a; --c3: #ff9d7a;
  --c4: #d79bff; --c5: #6fd0e0; --c6: #f08fc0; --c7: #b4c66a;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f7f7f9; --bg-2: #ffffff; --bg-3: #eceef2;
    --stroke: #cdd1d9; --stroke-2: #aeb4c0; --edge: #8b93a3;
    --text: #15171c; --text-2: #3b404b; --text-3: #565c69;
    --accent: #3a56d4; --accent-text: #2c45b8; --on-accent: #ffffff;
    --danger: #b3261e; --danger-bg: #fbe9e7;
    --ok: #1d7a46; --ok-bg: #e4f4ea;
    --warn: #8a5a00; --warn-bg: #fbf0d6;
    --c0: #3a56d4; --c1: #1d7a46; --c2: #8a5a00; --c3: #b4491f;
    --c4: #7a3fb0; --c5: #0b7285; --c6: #a8286b; --c7: #5c6b13;
  }
}

* { box-sizing: border-box; }
html { font-size: 14px; background: var(--bg); }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 1rem; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; font-weight: 650; line-height: 1.25; color: var(--text); }
h1 { font-size: 1.4rem; } h2 { font-size: 1.12rem; } h3 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--accent-text); }
button, input, select, textarea { font: inherit; color: inherit; }
::placeholder { color: var(--text-3); opacity: 1; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); font-size: .86rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
[hidden] { display: none !important; }

/* ---- layout ------------------------------------------------------------- */
#app { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  padding: 12px 0 0; border-bottom: 1px solid var(--stroke);
}
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  appearance: none; background: none; border: 0; cursor: pointer; white-space: nowrap;
  padding: 9px 14px; color: var(--text-2); font-weight: 560;
  border-bottom: 3px solid transparent; margin-bottom: -1px; border-radius: 8px 8px 0 0;
}
.tab:hover { color: var(--text); background: var(--bg-2); }
.tab[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); }
.tab .badge {
  display: inline-block; min-width: 1.3em; margin-left: 6px; padding: 0 6px; border-radius: 99px;
  background: var(--accent); color: var(--on-accent); font-size: .78rem; font-weight: 700; text-align: center;
}
@media (max-width: 480px) {
  .tabs { gap: 0; }
  .tab { padding: 9px 8px; font-size: .92rem; }
  .tab .badge { margin-left: 4px; padding: 0 5px; font-size: .72rem; }
}
@media (max-width: 380px) {
  .tab { padding: 9px 5px; font-size: .88rem; }
  .tab .badge { margin-left: 3px; padding: 0 4px; }
}
main { padding-top: 20px; }
.screen > * + *, .gap > * + * { margin-top: 18px; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head p { color: var(--text-2); }
.sec { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.sec h2 { display: flex; align-items: center; gap: 8px; }
.count { background: var(--bg-3); color: var(--text); border-radius: 99px; padding: 0 8px; font-size: .82rem; font-weight: 600; }

/* ---- banners ------------------------------------------------------------ */
.banner {
  display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--stroke);
  background: var(--bg-2); color: var(--text);
}
.banner.warn { background: var(--warn-bg); border-color: var(--warn); }
.banner.danger { background: var(--danger-bg); border-color: var(--danger); }
.banner.ok { background: var(--ok-bg); border-color: var(--ok); }
#banners > * + * { margin-top: 8px; }

/* ---- cards & rows ------------------------------------------------------- */
.card { background: var(--bg-2); border: 1px solid var(--stroke); border-radius: var(--radius); padding: 16px; }
.card > * + * { margin-top: 10px; }
.card.pad0 { padding: 0; }
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent-text); }
.stack > * + * { margin-top: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }
.list { list-style: none; margin: 0; padding: 0; }
.list > li + li { border-top: 1px solid var(--stroke); }

.chip {
  display: inline-block; padding: 1px 9px; border-radius: 99px; font-size: .8rem; font-weight: 560;
  background: var(--bg-3); color: var(--text); border: 1px solid var(--stroke); white-space: nowrap;
}
.chip.accent { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.chip.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--stroke-2); }
button.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* ---- buttons ------------------------------------------------------------ */
.btn {
  appearance: none; cursor: pointer; border-radius: 8px; padding: 7px 14px; font-weight: 600;
  background: var(--bg-3); color: var(--text); border: 1px solid var(--stroke-2);
}
.btn:hover { border-color: var(--text-3); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--bg-2); color: var(--danger); border-color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent-text); padding: 5px 8px; }
.btn.ghost:hover { background: var(--bg-3); }
.btn.sm { padding: 3px 10px; font-size: .88rem; white-space: nowrap; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }

/* ---- forms -------------------------------------------------------------- */
input[type=file] { color: var(--text-2); max-width: 100%; }
input[type=file]::file-selector-button {
  appearance: none; cursor: pointer; border-radius: 8px; padding: 7px 14px; margin-right: 10px; font: inherit; font-weight: 600;
  background: var(--bg-3); color: var(--text); border: 1px solid var(--stroke-2);
}
input[type=file]::file-selector-button:hover { border-color: var(--text-3); }
.field > label, .lbl { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 4px; color: var(--text); }
.field .hint { color: var(--text-2); font-size: .86rem; margin-top: 4px; }
input[type=text], input[type=search], input[type=date], input[type=url], select, textarea {
  width: 100%; padding: 8px 10px; border-radius: 8px;
  background: var(--bg); color: var(--text); border: 1px solid var(--stroke-2);
}
textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 0; }
select { appearance: auto; }
.switch { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch .track {
  flex: none; width: 40px; height: 22px; margin-top: 2px; border-radius: 99px; position: relative;
  background: var(--bg-3); border: 1px solid var(--stroke-2); transition: background .15s;
}
.switch .track::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--text-2); transition: transform .15s, background .15s;
}
.switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .track::after { transform: translateX(18px); background: var(--on-accent); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch input:disabled + .track { opacity: .5; }
.switch .txt b { display: block; font-weight: 600; }
.switch .txt span { color: var(--text-2); font-size: .88rem; }
.radio { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 10px 12px; border: 1px solid var(--stroke); border-radius: 8px; }
.radio input { margin-top: 4px; accent-color: var(--accent); }
.radio.on { border-color: var(--accent); background: var(--bg); }
.radio b { display: block; font-weight: 600; }
.radio span { color: var(--text-2); font-size: .88rem; }

/* ---- the compare card ---------------------------------------------------- */
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.compare > div { background: var(--bg); border: 1px solid var(--stroke); border-radius: 8px; padding: 10px 12px; }
.compare .lbl { color: var(--text-2); font-weight: 600; margin-bottom: 2px; font-size: .82rem; }
.compare .new { border-color: var(--accent); }
@media (max-width: 560px) { .compare { grid-template-columns: 1fr; } }

/* ---- feed --------------------------------------------------------------- */
.feed-item { padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.feed-item.undone .text { text-decoration: line-through; color: var(--text-3); }
.feed-item .top { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.feed-item .verb { font-weight: 700; }
.feed-item .when { color: var(--text-2); font-size: .85rem; margin-left: auto; }
.feed-item .was { color: var(--text-2); font-size: .9rem; }
.feed-item .was s { color: var(--text-3); }
.feed-group { display: block; padding: 0; }
.feed-group .grp-head { padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.feed-group .grp-head .top { grid-column: 1 / -1; }
.feed-group .grp-cats { display: flex; gap: 6px; flex-wrap: wrap; }
.feed-group .grp-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.feed-item .row { flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 520px) {
  .feed-item, .feed-group .grp-head { grid-template-columns: 1fr; }
  .feed-item .row, .feed-group .grp-actions { justify-content: flex-start; }
  .feed-item .when { margin-left: 0; }
}
.feed-group .grp-body { border-top: 1px solid var(--stroke); background: var(--bg); }
.feed-group .grp-body .feed-item { padding-left: 28px; }

/* ---- memories ----------------------------------------------------------- */
.mem { padding: 11px 16px; }
.mem .t { overflow-wrap: anywhere; }
.mem .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; color: var(--text-2); font-size: .85rem; }
.mem .acts { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
.mem.todo .row1 { display: flex; gap: 10px; align-items: flex-start; }
.mem .tick { flex: 0 0 auto; width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); cursor: pointer; }
.mem.finished .t { text-decoration: line-through; color: var(--text-2); }
.mem .editor { display: grid; gap: 8px; }

/* ---- vault -------------------------------------------------------------- */
.vx { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
.vx.noside { grid-template-columns: minmax(0, 1fr); }
.vx.noside .vx-side { display: none; }
.vx-side { position: sticky; top: 62px; max-height: calc(100vh - 80px); display: flex; flex-direction: column; background: var(--bg-2); border: 1px solid var(--stroke); border-radius: var(--radius); overflow: hidden; }
.vx-tools { padding: 10px; border-bottom: 1px solid var(--stroke); display: grid; gap: 8px; }
.vx-tools summary, .vx-disp summary { cursor: pointer; font-weight: 600; color: var(--text-2); }
.vx-tree { overflow: auto; padding: 6px; flex: 1 1 auto; min-height: 140px; }
.vx-tree ul { list-style: none; margin: 0; padding: 0; }
.vx-row { display: flex; width: 100%; align-items: center; gap: 4px; text-align: left; background: none; border: 0; border-radius: 6px; padding: 4px 8px 4px calc(6px + var(--d, 0) * 14px); cursor: pointer; color: var(--text); }
.vx-row:hover { background: var(--bg-3); }
.vx-row .chev { width: 1.1em; flex: 0 0 auto; color: var(--text-2); text-align: center; }
.vx-row .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vx-row .n { flex: 0 0 auto; color: var(--text-2); font-size: .8rem; }
.vx-row.dir .nm { font-weight: 600; }
.vx-row.more { color: var(--accent-text); }
.vx-row[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.vx-row[aria-selected="true"] .n { color: var(--on-accent); }
.vx-hit { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--stroke); padding: 8px 10px; cursor: pointer; color: var(--text); }
.vx-hit:hover { background: var(--bg-3); }
.vx-hit .t { font-weight: 600; } .vx-hit .p { color: var(--text-3); font-size: .8rem; margin-left: 6px; }
.vx-hit .ctx { display: block; color: var(--text-2); font-size: .88rem; overflow-wrap: anywhere; margin-top: 2px; }
mark { background: var(--warn-bg); color: var(--warn); border-radius: 3px; padding: 0 2px; }
kbd { font: inherit; font-size: .78rem; padding: 0 6px; border: 1px solid var(--stroke-2); border-bottom-width: 2px; border-radius: 5px; background: var(--bg-3); color: var(--text-2); }
.vx-main { min-width: 0; }
.vx-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.vx-crumb { color: var(--text-2); font-size: .88rem; flex: 1 1 12em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vx-note { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 16px; align-items: start; }
.vx-article { background: var(--bg-2); border: 1px solid var(--stroke); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
.vx-article > * + * { margin-top: 10px; }
.vx-rail details { background: var(--bg-2); border: 1px solid var(--stroke); border-radius: var(--radius); padding: 8px 12px; }
.vx-rail details + details { margin-top: 8px; }
.vx-rail summary { cursor: pointer; font-weight: 650; font-size: .88rem; }
.vx-links { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; }
.vx-links button { text-align: left; background: none; border: 0; padding: 3px 6px; border-radius: 6px; cursor: pointer; color: var(--accent-text); width: 100%; }
.vx-links button:hover { background: var(--bg-3); }
.vx-h { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); margin-top: 14px !important; font-weight: 700; }
.vx-lines { list-style: none; margin: 0; padding: 0; }
.vx-line { display: flex; gap: 10px; align-items: flex-start; padding: 9px 4px; border-top: 1px solid var(--stroke); }
.vx-lines > .vx-line:first-child { border-top: 0; }
.vx-line .tick { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); cursor: pointer; }
.vx-lt { flex: 1 1 auto; min-width: 0; }
.vx-lt .t { overflow-wrap: anywhere; }
.vx-line.finished .t { text-decoration: line-through; color: var(--text-2); }
.vx-line .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--text-2); font-size: .82rem; margin-top: 2px; }
.vx-line .editor { display: grid; gap: 8px; }
.vx-acts { display: flex; gap: 2px; flex: 0 0 auto; opacity: 0; transition: opacity .12s; }
.vx-line:hover .vx-acts, .vx-line:focus-within .vx-acts { opacity: 1; }
@media (hover: none) { .vx-acts { opacity: 1; } }
#g-wrap { position: relative; background: var(--bg-2); border: 1px solid var(--stroke); border-radius: var(--radius); overflow: hidden; height: min(68vh, 640px); min-height: 340px; }
#g-canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
.vx-zoom { position: absolute; right: 10px; bottom: 10px; display: grid; gap: 6px; }
.vx-zoom .btn { width: 34px; height: 34px; padding: 0; font-size: 1.1rem; line-height: 1; }
.vx-tip { position: absolute; left: 10px; top: 10px; background: var(--bg); border: 1px solid var(--stroke-2); border-radius: 8px; padding: 3px 10px; font-size: .86rem; pointer-events: none; }
.vx-disp { margin-top: 10px; background: var(--bg-2); border: 1px solid var(--stroke); border-radius: var(--radius); padding: 10px 14px; }
.vx-disp .ctl { display: grid; grid-template-columns: minmax(9em, 12em) 1fr; gap: 8px 14px; align-items: center; margin-top: 10px; max-width: 520px; }
.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
input[type=range] { accent-color: var(--accent); width: 100%; }
.sw-back { align-items: flex-start; padding-top: 12vh; }
.sw { width: min(560px, 100%); }
.sw ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 50vh; overflow: auto; }
.sw li button { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 7px 10px; cursor: pointer; color: var(--text); }
.sw li[aria-selected="true"] button { background: var(--accent); color: var(--on-accent); }
.sw li[aria-selected="true"] .faint { color: var(--on-accent); }
.seg { display: inline-flex; border: 1px solid var(--stroke-2); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--bg-2); border: 0; padding: 6px 14px; cursor: pointer; font-weight: 600; color: var(--text-2); }
.seg button + button { border-left: 1px solid var(--stroke-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--text-2); font-size: .85rem; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
.drawer-back { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: min(560px, 100%);
  background: var(--bg); border-left: 1px solid var(--stroke-2); overflow: auto; padding: 18px 18px 40px;
  box-shadow: -8px 0 24px rgba(0,0,0,.3);
}
.md h1, .md h2, .md h3 { margin: 14px 0 6px; } .md h1 { font-size: 1.2rem; } .md h2 { font-size: 1.08rem; } .md h3 { font-size: 1rem; }
.md p + p, .md ul + p, .md p + ul { margin-top: 8px; }
.md ul { margin: 6px 0 0; padding-left: 1.2em; } .md li + li { margin-top: 3px; }
.md code { background: var(--bg-3); border-radius: 4px; padding: 0 4px; }
.md .wl { color: var(--accent-text); text-decoration: underline; cursor: pointer; }
.md .wl.dead { color: var(--text-2); text-decoration: none; cursor: default; }
@media (max-width: 1000px) { .vx-note { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .vx { grid-template-columns: minmax(0, 1fr); }
  .vx-side { position: static; max-height: 60vh; }
  .vx-acts { opacity: 1; }
  .vx-line { flex-wrap: wrap; }
}

/* ---- people ------------------------------------------------------------- */
.split { display: grid; grid-template-columns: minmax(220px, 310px) 1fr; gap: 18px; align-items: start; }
.split .back { display: none; }
.person-row { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--text); }
.person-row:hover { background: var(--bg-3); }
.person-row[aria-current="true"] { background: var(--bg-3); box-shadow: inset 3px 0 0 var(--accent); }
.person-row .name { font-weight: 600; }
.person-row .sub { color: var(--text-2); font-size: .86rem; }
.chat { background: var(--bg); border: 1px solid var(--stroke); border-radius: 8px; padding: 10px 12px; max-height: 340px; overflow: auto; }
.chat p { padding: 4px 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.chat b { color: var(--accent-text); }
@media (max-width: 760px) {
  .split { grid-template-columns: 1fr; }
  .split.sel .plist { display: none; }
  .split:not(.sel) .pdetail { display: none; }
  .split .back { display: inline-block; }
}

/* ---- misc ---------------------------------------------------------------- */

/* ---- the folder tree ---- */
function buildTree(notes) {

  for (const n of notes) {
    const parts = n.path.split('/'); let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      const p = parts.slice(0, i + 1).join('/');
      if (!node.dirs.has(parts[i])) node.dirs.set(parts[i], { name: parts[i], path: p, dirs: new Map(), files: [], count: 0, updated: '' });
      node = node.dirs.get(parts[i]); node.count++; if ((n.updated || '') > node.updated) node.updated = n.updated || '';

}

  const up = (a, b) => (b.updated || '').localeCompare(a.updated || '');
  return { name: nm, 'name-desc': (a, b) => nm(b, a), new: (a, b) => up(a, b) || nm(a, b), old: (a, b) => up(b, a) || nm(a, b),
    big: (a, b) => ((b.count || 0) - (a.count || 0)) || nm(a, b) }[kind] || nm;
}
function treeRows(node, depth, out) {

  for (const d of dirs) {

    out.push(`<li role="none"><button class="vx-row dir" role="treeitem" aria-level="${depth + 1}" aria-expanded="${open}" data-act="v-dir" data-path="${esc(d.path)}" style="--d:${depth}">
      <span class="chev" aria-hidden="true">${open ? '▾' : '▸'}</span><span class="nm">${esc(d.name)}</span><span class="n">${d.count}</span></button></li>`);
    if (open) treeRows(d, depth + 1, out);

    out.push(`<li role="none"><button class="vx-row file" role="treeitem" aria-level="${depth + 1}" aria-selected="${on}" data-act="open-note" data-path="${esc(f.path)}" style="--d:${depth}">

function convRaw(c) {

  if (!parts) return `<div class="chat"><p>${esc(c.text)}</p></div>`;
  const who = (r) => r === 'user' ? 'You' : r === 'assistant' ? 'AI' : r;

}

function renderBio(editing) {

    : b.how === 'outline' ? 'A plain outline for now. It becomes a proper biography as soon as an AI helper is available.' : '';
  let body;

    body = `<textarea id="bio-text" rows="14" aria-label="Biography">${esc(b.text)}</textarea>

    body = b.memories ? `<p class="muted">Nothing is written yet.</p><div class="row"><button class="btn primary" data-act="bio-rewrite">Write it now</button></div>`
      : `<p class="muted">Nothing to write about yet. Tell me about yourself and I will write your biography.</p>`;

    body = `<div class="md">${md(b.text)}</div>

function renderEntries() {
  const list = state.journal.entries; const el = $('#entries'); if (!el) return;

/* ==========================================================================
   Clicks and typing
   ========================================================================== */
const MSG = { new: 'Saved the new answer.', old: 'Kept what I had.', both: 'Kept both.', neither: 'Discarded both. You can undo it from Review.', yes: 'Done.', no: 'Okay, kept them separate.', merge: 'Joined.', dismiss: 'Dismissed.', approve: 'Added.', deny: 'Skipped.', ok: 'Done.' };

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (el.tagName === 'A') e.preventDefault();
  switch (act) {
    case 'tab': return go(el.dataset.tab);
    case 'resume': return busy(el, async () => { await api('/api/anonymous', { method: 'POST', body: { anonymous: false } }); toast('Memory is back on.'); await refreshStatus(); refreshHere(); });
    case 'close-drawer': return closeDrawer();
    case 'open-note': return openNote(el.dataset.path);
    case 'note-edit': return openNote(vstate().cur.path, true);
    case 'note-view': return openNote(vstate().cur.path);
    case 'note-save': return busy(el, async () => {
      const n = vstate().cur; const body = { path: n.path, name: $('#ne-name').value, notes: $('#ne-notes').value };
      const fresh = await api('/api/vault/note', { method: 'PUT', body });
      toast('Saved.'); await loadAll(); await openNote(fresh.path || n.path); paintTree();
    });
    case 'v-tag': return setQ('tag:' + el.dataset.tag);
    case 'v-dir': { const v = vstate(); v.open[el.dataset.path] = !v.open[el.dataset.path]; vsave(); return paintTree(); }
    case 'v-dir-open': { const v = vstate(); v.open[el.dataset.path] = true; v.reveal = false; vsave(); paintTree(); const row = $$('#v-tree .vx-row').find(b => b.dataset.path === el.dataset.path); if (row) row.scrollIntoView({ block: 'nearest' }); return; }
    case 'v-collapse': { const v = vstate(); const any = Object.values(v.open).some(Boolean); for (const d of allDirs(v.tree)) v.open[d.path] = !any; vsave(); return paintTree(); }
    case 'v-more-files': { const v = vstate(); v.more[el.dataset.path] = (v.more[el.dataset.path] || PAGE) + PAGE; return paintTree(); }
    case 'v-more-hits': vstate().shown += 40; return paintTree();
    case 'v-clear': return setQ('');
    case 'v-view': { const v = vstate(); if (el.dataset.view === 'graph') return showGraph(); v.view = 'note'; stopGraph(); if (v.note) return showNote(v.note); paintBar(); return paintHome(); }
    case 'v-side': { const v = vstate(); v.hideSide = !v.hideSide; vsave(); $('#vx').classList.toggle('noside', v.hideSide); el.setAttribute('aria-expanded', String(!v.hideSide)); return; }
    case 'v-switcher': return openSwitcher();
    case 'v-jump': { const t = document.getElementById(el.dataset.to); if (t) t.scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
    case 'vl-edit': return lineEditor(el.closest('[data-mem]'), id);
    case 'vl-cancel': return refreshHere();
    case 'vl-save': return busy(el, async () => {
      const li = el.closest('[data-mem]'); const text = $('textarea', li).value.trim();
      if (!text) { toast('A memory cannot be empty. Use Forget to remove it.', true); return; }
      const body = { body: text };
      if (el.dataset.plain === 'true') { body.category = $('[data-f=cat]', li).value; body.note = $('[data-f=note]', li).value.trim(); }
      const saved = await api('/api/records/' + enc(id), { method: 'PUT', body });
      toast('Saved.'); const v = vstate(); await loadAll();
      if (saved && saved.note && saved.note !== v.note && v.all.some(n => n.path === saved.note)) { v.note = saved.note; }
      await showNote(v.note, false, true); paintTree();
    });
    case 'g-zoom': { const L = GRAPH.live; if (!L) return; return el.dataset.dir === 'fit' ? L.fit() : L.zoomBy(el.dataset.dir === 'in' ? 1.3 : 1 / 1.3); }
    case 'g-reset': { const v = vstate(); Object.assign(v.g, { center: 0.4, repel: 0.5, link: 0.5, dist: 0.4 }); vsave(); $$('[data-force]').forEach(r => { r.value = v.g[r.dataset.force]; }); if (GRAPH.live) GRAPH.live.reheat(v.g); return; }
    case 'goto-person': closeDrawer(); state.personId = id; return go('people');
    case 'tell': return busy(el, async () => {
      const t = $('#tell').value.trim(); if (!t) { toast('Type something first.', true); return; }
      const r = await api('/api/tell', { method: 'POST', body: { text: t } });
      const m = $('#tell-msg'); m.textContent = r.message; m.className = 'msg ' + (r.ok ? 'good' : 'err');
      if (r.ok) $('#tell').value = '';
      await refreshStatus(); await SCREENS.review(true);
    });
    case 'test-ai': return busy(el, async () => {
      const m = $('#ai-test-msg'); m.className = 'msg'; m.textContent = 'Asking it a small question…';
      const r = await api('/api/settings/ai/test', { method: 'POST' });
      m.className = 'msg ' + (r.ok ? 'good' : 'err');
      m.textContent = r.ok ? 'It answered. Anything that was waiting will be read now.'
        : r.reason === 'no_helper' ? 'I cannot reach an AI helper. Check that Hermes is running, or pick a model above.'
        : r.reason === 'empty' ? 'It was reached but gave an empty answer. Try again in a moment.'
        : 'It was reached but did not answer' + (r.detail ? ': ' + r.detail : '.');
      await refreshStatus();
    });
    case 'waiting-read': return busy(el, async () => {
      const r = await api('/api/waiting/read', { method: 'POST' });
      if (r.reason === 'no_helper') toast('I still cannot reach an AI helper. Your words stay safe until one is there.', true);
      else if (r.reason === 'nothing') toast('Nothing is waiting.');
      else toast('Reading…');
      await refreshStatus(); if (state.tab === 'review') await SCREENS.review(true);
    });
    case 'waiting-skip': return busy(el, async () => {
      const yes = await ask({ title: 'Skip this one?', body: '<p>I will not make any memories from it. It stays whole in Sources.</p>', yes: 'Skip it', no: 'Keep waiting' });
      if (!yes) return;
      await api(`/api/waiting/${enc(el.dataset.id)}/skip`, { method: 'POST' });
      toast('Skipped. It stays in Sources.'); await refreshStatus(); await SCREENS.review(true);
    });
    case 'doubt': return busy(el, async () => {
      await api(`/api/doubts/${enc(id)}/answer`, { method: 'POST', body: { answer: el.dataset.choice } });
      toast(MSG[el.dataset.choice] || 'Done.'); await SCREENS.review(true);
    });
    case 'unsure-keep': return busy(el, async () => { await api(`/api/unsure/${enc(id)}/keep`, { method: 'POST' }); toast('Kept.'); await SCREENS.review(true); });
    case 'unsure-skip': return busy(el, async () => { await api(`/api/unsure/${enc(id)}/skip`, { method: 'POST' }); toast('Dropped.'); await SCREENS.review(true); });
    case 'undo': return busy(el, async () => {
      const r = await api('/api/undo/' + enc(el.dataset.seq), { method: 'POST' });
      toast(r.result === 'changed_since' ? 'That was changed after this, so I left it as it is.' : r.reopened ? 'Put back. The question is waiting for you again.' : 'Put back.');
      await SCREENS.review(true); });
    case 'audit': return busy(el, async () => {
      const r = await api(`/api/audit/${enc(el.dataset.id)}/${enc(el.dataset.choice)}`, { method: 'POST' });
      toast(r.result === 'gone' ? 'That changed in the meantime, so I left it alone.' : ({ keep_new: 'Kept the newer one.', keep_old: 'Kept the older one.', keep_both: 'Kept both.', join: 'Kept just one.', done: 'Ticked off.', still: 'Okay, I will ask again later.', remove: 'Removed.', keep: 'Kept.', forget: 'Forgotten.' })[el.dataset.choice] || 'Done.');
      await SCREENS.review(true); });
    case 'feed-got-it': return busy(el, async () => {
      const seqs = String(el.dataset.seqs || '').split(',').map(Number).filter(Boolean);
      await api('/api/feed/dismiss', { method: 'POST', body: { seqs } });
      await SCREENS.review(true); });
    case 'feed-clear': return busy(el, async () => {
      await api('/api/feed/dismiss', { method: 'POST', body: { all: true } });
      toast('Cleared. The memories are all still saved.');
      await SCREENS.review(true); });
    case 'checkup': return busy(el, async () => {
      const r = await api('/api/checkup');
      const lines = (r.checkup.lines || []).map(l => `<p class="text">${esc(l)}</p>`).join('');
      await ask({ title: 'How your memory is doing', body: lines, yes: 'Close', no: null });
    });
    case 'sweep': return busy(el, async () => {
      const first = await api('/api/sweep', { method: 'POST', body: { apply: false } });
      if (!first.found) { toast('I found no old junk. Your notes look clean.'); return; }
      const ok = await ask({ title: 'Clean up old junk?', danger: true, yes: 'Move to trash',
        body: `I found ${plural(first.found, 'old line')} that look like server logs, pasted docs or agent text - not your life. Move ${first.found === 1 ? 'it' : 'them'} to the trash? Nothing is deleted, and you can undo this from Review.` });
      if (!ok) return;
      const r = await api('/api/sweep', { method: 'POST', body: { apply: true } });
      toast(`Moved ${plural(r.trashed, 'old junk line')} to the trash${r.tag_stripped ? ` and cleaned ${plural(r.tag_stripped, 'folder name')}` : ''}. Undo from Review if anything looks wrong.`);
      await SCREENS.review(true); });
    case 'dismiss-notice': return busy(el, async () => { await api('/api/notice/dismiss', { method: 'POST' }); await refreshStatus(); });
    case 'audit-run': return busy(el, async () => {
      const m = $('#audit-msg'); if (m) m.textContent = 'Looking…';
      const r = await api('/api/audit/run', { method: 'POST' });
      const noAi = r.ai && r.ai.used === false;      // the AI's second look was wanted but not had
      toast(r.summary.needs_you ? `Done. ${plural(r.summary.needs_you, 'thing')} to look at.${noAi ? ' The AI helper could not give a second look, so some may be false alarms.' : ''}`
        : noAi ? 'Done. My own checks found nothing. The AI helper could not give a second look, so I will check again when it can.'
        : 'Done. Everything looks fine.');
      await SCREENS.review(true); });
    case 'audit-lonely': { vstate().view = 'note'; await go('vault'); return setQ('is:orphan'); }
    case 'undo-group': return busy(el, async () => {
      const seqs = String(el.dataset.seqs || '').split(',').map(Number).filter(Boolean);
      const r = await api('/api/undo-many', { method: 'POST', body: { seqs } });
      toast(r.skipped ? `Put back ${plural(r.undone, 'thing')}. ${plural(r.skipped, 'other')} changed since, so I left ${r.skipped === 1 ? 'it' : 'them'}.` : `Put back ${plural(r.undone, 'thing')}.`);
      await SCREENS.review(true); });
    case 'toggle-group': { const ks = String(el.dataset.seqs || '').split(','); const now = ks.some(k => state.openGroups[k]); ks.forEach(k => { state.openGroups[k] = !now; }); return renderReviewBody(); }

    case 'mem-edit': { const li = el.closest('[data-mem]'); return memEditor(li, state.mem[id]); }
    case 'mem-cancel': return refreshHere();
    case 'mem-save': return busy(el, async () => {
      const li = el.closest('[data-mem]'); const text = $('textarea', li).value.trim(); const sel = $('select', li);
      if (!text) { toast('A memory cannot be empty. Use Forget to remove it.', true); return; }
      const body = { body: text }; if (sel) body.category = sel.value;
      await api('/api/records/' + enc(id), { method: 'PUT', body });
      toast('Saved.');
      if (state.tab === 'journal') { await SCREENS.journal(true); } else { await refreshHere(); }
    });
    case 'mem-forget': {
      const m = state.mem[id] || {};
      if (!(await ask({ title: 'Forget this?', body: `“${esc(m.text || '')}”<br>I will stop using it. You can put it back from Review.`, yes: 'Forget it', danger: true }))) return;
      return busy(el, async () => {
        await api('/api/records/' + enc(id), { method: 'DELETE' }); toast('Forgotten.');
        if (state.tab === 'journal') { await SCREENS.journal(true); } else { await refreshHere(); }
      });
    }

    case 'mem-private': {
      const m = state.mem[id] || {};
      if (!(await ask({ title: 'Keep this private?', body: `“${esc(m.text || '')}”<br>I will hide it from every screen and from every AI, including the one in Hermes. It stays on this computer, and you can bring it back from Settings.`, yes: 'Keep it private' }))) return;
      return busy(el, async () => { await api('/api/records/' + enc(id) + '/private', { method: 'POST' }); toast('Kept private.'); closeDrawer(); await refreshHere(); await refreshStatus(); });
    }
    case 'bring-back': {
      if (!(await ask({ title: 'Bring this memory back?', body: 'It will show on every screen again, and the AI can use it.', yes: 'Bring it back' }))) return;
      return busy(el, async () => { await api('/api/neversend/' + enc(id), { method: 'POST' }); toast('Brought back.'); await SCREENS.settings(); });
    }

    case 'tok': return toggleTok(el.dataset.tok, el.dataset.ex);

    case 'pick-person': return showPerson(id);
    case 'back-people': state.personId = null; return SCREENS.people(true);
    case 'add-person': {
      const v = await promptForm({ title: 'Add a person', yes: 'Add', fields: [{ id: 'name', label: 'Name' }, { id: 'relation', label: 'Who they are to you (optional)', ph: 'sister, friend, colleague…' }] });
      if (!v) return; if (!v.name) { toast('A person needs a name.', true); return; }
      try { const p = await api('/api/people', { method: 'POST', body: v }); state.personId = p.id; toast('Added.'); await SCREENS.people(true); } catch (err) { toast(err.message, true); }
      return;
    }
    case 'add-myself': {
      const v = await promptForm({ title: 'Add yourself', yes: 'Add', fields: [{ id: 'name', label: 'Your name', ph: 'the name others call you' }] });
      if (!v) return; if (!v.name) { toast('Type your name.', true); return; }
      try { const p = await api('/api/people/me', { method: 'POST', body: v }); state.personId = p.id; toast('Marked as you. You can undo it from Review.'); await SCREENS.people(true); } catch (err) { toast(err.message, true); }
      return;
    }
    case 'mark-me': case 'unmark-me': return busy(el, async () => {
      try {
        await api('/api/people/' + enc(state.personId) + '/me', { method: 'POST', body: { is_me: act === 'mark-me' } });
        toast(act === 'mark-me' ? 'Marked as you. You can undo it from Review.' : 'Taken off. You can undo it from Review.'); await SCREENS.people(true);
      } catch (err) { toast(err.message, true); }
    });
    case 'edit-person': return showPerson(state.personId, true);
    case 'cancel-person': return showPerson(state.personId);
    case 'save-person': return busy(el, async () => {
      const body = { name: $('#pe-name').value.trim(), relation: $('#pe-rel').value.trim(), notes: $('#pe-notes').value.trim(), aliases: $('#pe-alias').value.split(',').map(x => x.trim()).filter(Boolean) };
      if (!body.name) { toast('A person needs a name.', true); return; }
      await api('/api/people/' + enc(state.personId), { method: 'PUT', body }); toast('Saved.'); await SCREENS.people(true);
    });
    case 'read-conv': {
      const li = el.closest('[data-conv]'); const box = $('.conv-raw', li);
      if (box.innerHTML) { box.innerHTML = ''; el.textContent = 'Read it'; return; }
      return busy(el, async () => { const c = await api('/api/conversations/' + enc(id)); box.innerHTML = '<div style="margin-top:8px">' + convRaw(c) + '</div>'; el.textContent = 'Hide'; });
    }
    case 'merge-person': {
      const p = state.person; const other = $('#merge-with'); const o = p.others.find(x => x.id === other.value); if (!o) return;
      if (!(await ask({ title: 'Join these two profiles?', body: `<b>${esc(o.name)}</b> and <b>${esc(p.name)}</b> will become one profile, <b>${esc(p.name)}</b>. Their notes and conversations come together. You can undo this from Review.`, yes: 'Yes, same person' }))) return;
      return busy(el, async () => { await api('/api/people/merge', { method: 'POST', body: { keep_id: p.id, other_id: o.id } }); toast('Joined into one profile.'); await SCREENS.people(true); });
    }
    case 'delete-person': {
      const p = state.person; const n = p.conversation_list.length;
      const pick = await choose({
        title: `Remove ${p.name}?`,
        body: 'I will not make a profile for that name again. You can undo this from Review.' + (n ? `<br><br>You have ${plural(n, 'saved conversation')} with or about them. Chats that were only with them can go too; group chats with other people stay.` : ''),
        options: n ? [{ label: 'Remove the profile only', value: 'profile' }, { label: 'Remove the profile and their chats', value: 'chats', danger: true }]
                   : [{ label: 'Remove the profile', value: 'profile', danger: true }],
      });
      if (!pick) return;
      return busy(el, async () => {
        const r = await api('/api/people/' + enc(p.id) + (pick === 'chats' ? '?chats=true' : ''), { method: 'DELETE' });
        toast(pick === 'chats' && r.chats_removed ? `Removed, and ${plural(r.chats_removed, 'chat')} too.` : 'Removed.'); state.personId = null; await SCREENS.people(true);
      });
    }

    case 'bio-rewrite': {
      if (state.journal.biography.locked && !(await ask({ title: 'Rewrite your biography?', body: 'This replaces the version you edited.', yes: 'Rewrite it' }))) return;
      return busy(el, async () => { toast('Writing…'); state.journal.biography = await api('/api/journal/biography', { method: 'POST', body: { action: 'rewrite' } }); renderBio(); });
    }
    case 'bio-edit': return renderBio(true);
    case 'bio-cancel': return renderBio();
    case 'bio-save': return busy(el, async () => { state.journal.biography = await api('/api/journal/biography', { method: 'POST', body: { action: 'save', text: $('#bio-text').value } }); toast('Saved. I will not change it unless you ask.'); renderBio(); });
    case 'bio-unlock': return busy(el, async () => { state.journal.biography = await api('/api/journal/biography', { method: 'POST', body: { action: 'unlock' } }); toast('I can update it again.'); renderBio(); });
    case 'entry-add': return busy(el, async () => {
      const text = $('#j-text').value.trim(); if (!text) { toast('Write something first.', true); return; }
      const r = await api('/api/journal/entry', { method: 'POST', body: { text, day: $('#j-day').value || null } });
      state.journal.entries = r.entries; $('#j-text').value = ''; toast('Added.'); renderEntries();
    });

    case 'check-models': return busy(el, async () => {
      const r = await api('/api/settings/ai/models?address=' + enc($('#ai-addr').value.trim()));
      $('#ollama-models').innerHTML = r.models.map(m => `<option value="${esc(m)}">`).join('');
      $('#ai-models-msg').textContent = !r.reachable ? (r.message || 'I could not reach an AI server there. Check that it is running and the address is right.') : r.models.length ? `Found ${plural(r.models.length, 'model')} on ${r.kind === 'ollama' ? 'Ollama' : 'an OpenAI-style server (llama.cpp, LM Studio or vLLM)'}. Pick one from the list.` : 'The server is there but lists no models yet. Type the model name yourself.';
    });
    case 'save-ai': return busy(el, async () => {
      const mode = ($('input[name=aimode]:checked') || {}).value || 'auto';
      const body = { mode, meaning_model: $('#ai-embed').value.trim() };
      if (mode === 'custom') { body.address = $('#ai-addr').value.trim(); body.reading_model = $('#ai-model').value.trim(); }
      await api('/api/settings/ai', { method: 'POST', body }); toast('Saved.'); await SCREENS.settings();
    });
    case 'prepare-embed': return busy(el, async () => { $('#embed-msg').textContent = 'Working…'; const r = await api('/api/embed', { method: 'POST', body: {} }); $('#embed-msg').textContent = r.message; await refreshStatus(); });
    case 'save-never': return busy(el, async () => {
      const words = $('#never').value.split('\n').map(x => x.trim()).filter(Boolean);
      await api('/api/settings', { method: 'POST', body: { never_remember: words } }); toast('Saved.');
    });
    case 'bridge-start': case 'bridge-stop': return busy(el, async () => { await api('/api/proxy/' + act.slice(7), { method: 'POST' }); await SCREENS.settings(); });
    case 'import': return busy(el, doImport);
    case 'accept-originals': return busy(el, async () => { await api('/api/manifest', { method: 'POST' }); toast('Recorded again.'); await SCREENS.settings(); });
    case 'backup': return busy(el, async () => { const r = await api('/api/backup', { method: 'POST' }); $('#bk-msg').textContent = 'Saved: ' + r.name; });
    case 'tidy': return busy(el, async () => {
      $('#bk-msg').textContent = 'Working…'; const r = await api('/api/tidy', { method: 'POST' });
      const bad = r.steps.filter(s => s.ok === 'no').length;
      await refreshStatus(); const left = state.status ? state.status.waiting : 0;
      $('#bk-msg').textContent = bad ? 'Done, but a part did not finish. I will try again tonight.'
        : left && r.reading ? 'All tidy. Now reading what was waiting…'
        : left ? `All tidy, but ${plural(left, 'message')} still ${left === 1 ? 'waits' : 'wait'} for an AI helper. See Review.` : 'All tidy.';
    });
  }
});

async function doImport() {
  const msg = $('#imp-msg'); const file = $('#imp-file').files[0]; const text = $('#imp-text').value.trim();
  if (!file && !text) { msg.textContent = 'Choose a file or paste some notes first.'; msg.className = 'msg err'; return; }
  msg.className = 'msg'; msg.textContent = 'Reading…';
  const body = {};
  if (file) {
    if (file.size > 100 * 1024 * 1024) { msg.textContent = 'That file is too big to bring in from here (over 100 MB).'; msg.className = 'msg err'; return; }
    body.name = file.name; body.data_b64 = b64(await file.arrayBuffer()); body.me = $('#imp-me').value.trim();
  } else { body.name = 'pasted notes'; body.text = text; }
  try {
    const r = await api('/api/import', { method: 'POST', body });
    msg.textContent = r.message || 'Done.'; msg.className = 'msg good';
    $('#imp-file').value = ''; $('#imp-text').value = ''; refreshStatus();
  } catch (e) { msg.textContent = e.message; msg.className = 'msg err'; }
}

document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.name === 'aimode') { $('#ai-custom').hidden = t.value !== 'custom'; $$('label.radio').forEach(l => l.classList.toggle('on', $('input', l).checked)); return; }
  if (t.dataset.todo) {
    t.disabled = true;
    try { await api('/api/records/' + enc(t.dataset.todo) + '/done', { method: 'POST', body: { done: t.checked } }); toast(t.checked ? 'Ticked off.' : 'Back on your list.'); await refreshHere(); }
    catch (err) { t.checked = !t.checked; toast(err.message, true); }
    finally { t.disabled = false; }
    return;
  }
  if (t.dataset.graph) {
    const v = vstate(); v.g[t.dataset.graph] = t.checked; vsave();
    return ['local', 'names'].includes(t.dataset.graph) ? drawGraph() : showGraph();
  }
  if (t.dataset.depth !== undefined) { const v = vstate(); v.g.depth = +t.value; vsave(); return drawGraph(); }
  if (t.id === 'v-sort') { const v = vstate(); v.sort = t.value; vsave(); return paintTree(); }
  if (t.dataset.opt) {
    const key = t.dataset.opt; t.disabled = true;
    try {
      let said = 'Saved.';
      if (key === 'paused') await api('/api/anonymous', { method: 'POST', body: { anonymous: t.checked } });
      else { const r = await api('/api/settings', { method: 'POST', body: { [key]: t.checked } }); if (r && r.message) said = r.message; }
      toast(said); await keepFields(() => SCREENS.settings());
    } catch (err) { t.checked = !t.checked; toast(err.message, true); }
    finally { t.disabled = false; }
  }
});
const onType = debounce((e) => {
  const t = e.target;
  if (t.id === 'rv-q') { state.rq = t.value; runSearch(); }
  else if (t.id === 'v-q') { const v = vstate(); v.q = t.value.trim(); v.shown = 40; runVaultSearch(); if (v.view === 'graph') showGraph(); }
  else if (t.id === 'pl-q') { state.peopleQ = t.value; renderPeopleList(); }
}, 280);
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.force) { const v = vstate(); v.g[t.dataset.force] = +t.value; vsave(); if (GRAPH.live) GRAPH.live.reheat({ [t.dataset.force]: +t.value }); return; }
  onType(e);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'tell') { e.preventDefault(); const b = $('[data-act=tell]'); if (b) b.click(); }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'o') { e.preventDefault(); openSwitcher(); return; }
  /* the folder tree works from the keyboard like Obsidian's: arrows move, right opens, left closes */
  const row = e.target.closest && e.target.closest('#v-tree .vx-row');
  if (row) {
    const rows = $$('#v-tree .vx-row'); const i = rows.indexOf(row);
    if (e.key === 'ArrowDown') { e.preventDefault(); (rows[i + 1] || row).focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); (rows[i - 1] || row).focus(); }
    else if (row.classList.contains('dir') && e.key === 'ArrowRight' && row.getAttribute('aria-expanded') === 'false') { e.preventDefault(); row.click(); }
    else if (row.classList.contains('dir') && e.key === 'ArrowLeft' && row.getAttribute('aria-expanded') === 'true') { e.preventDefault(); row.click(); }
  }
});

/* A screen only draws while its own tab is open: a save that finishes after you moved on
   must not bring the old screen back. (go() sets the tab before it calls the screen.) */
for (const name of Object.keys(SCREENS)) {
  const draw = SCREENS[name];
  SCREENS[name] = function () { return state.tab === name ? draw.apply(this, arguments) : Promise.resolve(); };
}

/* ---- start ---- */
(async function start() {
  renderTabs();
  try { await refreshStatus(); } catch (e) {}
  await go('review');
})();
</script>
